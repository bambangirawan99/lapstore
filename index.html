      <div id="bk-svc-edit-err-${s.id}" class="bk-err" style="display:none;"></div>
      <div class="bk-svc-actions" style="margin-top:0; margin-bottom:10px;">
        <button class="bk-btn primary svc-save-detail" data-id="${s.id}">Simpan info</button>
        <button class="bk-btn ghost svc-cancel-detail" data-id="${s.id}">Batal</button>
      </div>
    ` : `
      ${s.kodeService ? `<div class="mono" style="display:inline-block; font-size:11px; font-weight:700; color:var(--accent3-ink); background:var(--accent3-bg); padding:3px 9px; border-radius:6px; margin-bottom:6px;">${escapeAttr(s.kodeService)}</div>` : ''}
      <div class="nm">${s.customerName} &middot; ${s.device}</div>
      <div class="sub">${s.complaint}${s.accessories ? ' &middot; Kelengkapan: '+s.accessories : ''}</div>
      <div class="sub">${new Date(s.createdAt).toLocaleDateString('id-ID')}${auditNoteHtml(s)}</div>
    `;

    return `<div class="bk-svc-card" data-svc="${s.id}">
      <div class="bk-svc-top">
        <input type="checkbox" class="bk-row-check bk-svc-check" data-id="${s.id}" style="margin-top:3px; flex-shrink:0;" ${selectedSvcIds.has(s.id) ? 'checked' : ''} />
        ${idx != null ? `<div class="bk-row-no" style="padding-top:2px;">${idx + 1}</div>` : ''}
        <div style="flex:1; min-width:0;">
          ${topInfoHtml}
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          ${badge}
          <div class="bk-svc-row-actions">
            ${!isEditingDetail ? `<div class="bk-icon-btn svc-edit-detail-btn" data-id="${s.id}" title="Edit info pelanggan/perangkat">&#9998;</div>` : ''}
            <div class="bk-icon-btn danger svc-del-btn" data-id="${s.id}" title="Hapus data service">&times;</div>
          </div>
        </div>
      </div>
      ${s.catatanDiagnosa && s.status !== 'diagnosa' ? `<div class="bk-svc-detail"><span class="lbl">Catatan diagnosa:</span> ${s.catatanDiagnosa}</div>` : ''}
      ${svcDpBlockHtml(s)}
      ${actionHtml}
      ${waBtn ? `<div class="bk-svc-actions">${waBtn}</div>` : ''}
      <div class="bk-svc-timeline">${(s.history||[]).map(h => `${serviceStatusLabel(h.status)} &middot; ${new Date(h.at).toLocaleString('id-ID')}`).join(' &rarr; ')}</div>
    </div>`;
  }

  function svcDpBlockHtml(s) {
    if (s.status === 'diambil') return '';
    if (s.dpAmount && s.dpTxnId) {
      return `<div class="bk-svc-dp-box" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <div><span class="lbl">DP diterima:</span> <strong>${rupiah(s.dpAmount)}</strong></div>
        <button class="bk-btn ghost svc-dp-remove" data-id="${s.id}" style="padding:6px 14px; font-size:11.5px;">Batalkan DP</button>
      </div>`;
    }
    return `<div class="bk-svc-dp-box">
      <div style="font-size:12px; font-weight:700; color:var(--accent2-ink); margin-bottom:8px;">Uang muka (DP) &mdash; opsional</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <input class="svc-dp-input" type="number" min="0" data-id="${s.id}" placeholder="Jumlah DP diterima" style="flex:1; min-width:140px; border:1.5px solid var(--line); border-radius:10px; padding:8px 11px; font-size:13px; font-family:'Inter',sans-serif;" />
        <button class="bk-btn ghost svc-dp-save" data-id="${s.id}" style="padding:8px 16px;">Catat DP</button>
      </div>
    </div>`;
  }

  function svcPartRowHtml(serviceId, item, idx) {
    const stockMap = computeStock();
    const stok = item.name ? (stockMap[item.name.trim().toLowerCase()] ? stockMap[item.name.trim().toLowerCase()].qty : 0) : null;
    return `<div class="bk-numbered-row-wrap">
      <div class="bk-row-no">${idx + 1}.</div>
      <div class="bk-svc-part-row svc-part-row" data-svc="${serviceId}" data-id="${item.id}">
      <input class="f-code" value="${escapeAttr(item.code||'')}" placeholder="Kode" list="bk-item-codes" />
      <input class="f-name" value="${escapeAttr(item.name)}" placeholder="Nama sparepart (dari stok)" list="bk-item-names" />
      <input class="f-qty" type="number" min="0" step="any" value="${escapeAttr(item.qty)}" placeholder="0" />
      <input class="f-unit" value="${escapeAttr(item.unit)}" placeholder="pcs/unit" title="${stok !== null ? 'Sisa stok: ' + stok : ''}" />
      <div class="rm" title="Hapus baris">&times;</div>
      </div>
    </div>`;
  }

  function wireServiceCardEvents() {
    const list = document.getElementById('bk-svc-list');
    if (!list) return;

    list.querySelectorAll('.svc-edit-detail-btn').forEach(b => b.addEventListener('click', () => {
      editingServiceDetailId = b.dataset.id;
      renderService();
    }));
    list.querySelectorAll('.svc-cancel-detail').forEach(b => b.addEventListener('click', () => {
      editingServiceDetailId = null;
      renderService();
    }));
    list.querySelectorAll('.svc-save-detail').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.id;
      const kodeService = list.querySelector(`.svc-edit-kode[data-id="${id}"]`).value.trim();
      const name = list.querySelector(`.svc-edit-name[data-id="${id}"]`).value.trim();
      const phone = list.querySelector(`.svc-edit-phone[data-id="${id}"]`).value.trim();
      const device = list.querySelector(`.svc-edit-device[data-id="${id}"]`).value.trim();
      const accessories = list.querySelector(`.svc-edit-accessories[data-id="${id}"]`).value.trim();
      const complaint = list.querySelector(`.svc-edit-complaint[data-id="${id}"]`).value.trim();
      const rekening = list.querySelector(`.svc-edit-rekening[data-id="${id}"]`).value;
      const errEl = document.getElementById(`bk-svc-edit-err-${id}`);
      if (!name || !device || !complaint) {
        if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'Nama pelanggan, merk/tipe laptop, dan keluhan wajib diisi.'; }
        return;
      }
      if (kodeService) {
        const dupe = services.find(x => x.id !== id && (x.kodeService||'').trim().toUpperCase() === kodeService.toUpperCase());
        if (dupe) {
          if (errEl) { errEl.style.display = 'block'; errEl.textContent = `Kode "${kodeService}" sudah dipakai oleh service milik ${dupe.customerName || 'pelanggan lain'}. Pakai kode lain.`; }
          return;
        }
      }
      await updateService(id, { kodeService, customerName: name, customerPhone: phone, device, accessories, complaint, rekening });
      editingServiceDetailId = null;
      renderService();
      showToast('Info service diperbarui.');
    }));

    list.querySelectorAll('.svc-dp-save').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.id;
      const s = services.find(x => x.id === id);
      if (!s) return;
      const input = list.querySelector(`.svc-dp-input[data-id="${id}"]`);
      const amount = Number(input.value) || 0;
      if (amount <= 0) { showToast('Isi jumlah DP terlebih dahulu.'); return; }
      b.disabled = true; b.textContent = 'Menyimpan...';
      try {
        const txn = {
          id: uid(),
          type: 'penjualan',
          items: [{ name: `DP Service Laptop - ${s.device} (${id.slice(0,6)})`, qty: 1, unit: 'jasa', price: amount }],
          total: amount,
          customerName: s.customerName,
          customerPhone: s.customerPhone,
          supplierName: '',
          paid: true,
          rekening: s.rekening || BANK_ACCOUNTS[0].id,
          createdAt: Date.now(),
        };
        await saveTxn(txn);
        txns.unshift(txn);
        s.dpAmount = amount;
        s.dpTxnId = txn.id;
        s.updatedAt = Date.now();
        s.history = s.history || [];
        s.history.push({ status: `DP diterima: ${rupiah(amount)}`, at: Date.now() });
        await saveService(s);
        renderService();
        showToast('DP tercatat sebagai pemasukan.');
      } catch (e) {
        console.error(e);
        showToast('Gagal mencatat DP, coba lagi.');
        b.disabled = false; b.textContent = 'Catat DP';
      }
    }));

    list.querySelectorAll('.svc-dp-remove').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.id;
      const s = services.find(x => x.id === id);
      if (!s) return;
      showConfirm(`Batalkan DP sebesar ${rupiah(s.dpAmount)}? Transaksi pemasukan DP ini akan ikut dihapus.`, async () => {
        showLoadingModal('Membatalkan DP...');
        try {
          if (s.dpTxnId) {
            try { await deleteTxnFromStore(s.dpTxnId); } catch (e) { /* mungkin sudah terhapus */ }
            txns = txns.filter(x => x.id !== s.dpTxnId);
          }
          s.dpAmount = 0;
          s.dpTxnId = null;
          s.updatedAt = Date.now();
          s.history = s.history || [];
          s.history.push({ status: 'DP dibatalkan', at: Date.now() });
          await saveService(s);
          closeLoadingModal();
          renderService();
          showToast('DP dibatalkan.');
        } catch (e) {
          console.error(e);
          closeLoadingModal();
          showToast('Gagal membatalkan DP, coba lagi.');
        }
      });
    }));

    list.querySelectorAll('.act-diagnosa').forEach(b => b.addEventListener('click', () => advanceServiceStatus(b.dataset.id, 'diagnosa')));
    list.querySelectorAll('.act-wa-diterima').forEach(b => b.addEventListener('click', () => sendServiceWhatsapp(b.dataset.id, 'diterima')));

    list.querySelectorAll('.act-kirim-estimasi').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.id;
      const note = list.querySelector(`.svc-diag-note[data-id="${id}"]`).value;
      const est = list.querySelector(`.svc-diag-est[data-id="${id}"]`).value;
      await updateService(id, { catatanDiagnosa: note, estimasiBiaya: Number(est) || 0 });
      await advanceServiceStatus(id, 'menunggu_konfirmasi', false);
      renderService();
      sendServiceWhatsapp(id, 'estimasi');
    }));

    list.querySelectorAll('.act-setuju').forEach(b => b.addEventListener('click', () => advanceServiceStatus(b.dataset.id, 'dikerjakan')));
    list.querySelectorAll('.act-revisi').forEach(b => b.addEventListener('click', () => advanceServiceStatus(b.dataset.id, 'diagnosa')));

    list.querySelectorAll('.svc-part-row').forEach(row => {
      const sid = row.dataset.svc, pid = row.dataset.id;
      const s = services.find(x => x.id === sid);
      const part = s && s.parts ? s.parts.find(p => p.id === pid) : null;
      if (!part) return;
      const codeInput = row.querySelector('.f-code');
      if (codeInput) {
        codeInput.addEventListener('input', e => {
          part.code = e.target.value;
          const codeVal = (part.code || '').trim();
          if (!codeVal) return;
          const reg = getItemCodeRegistry();
          const match = reg.byCode[codeVal.toLowerCase()];
          if (match) {
            part.name = match.name;
            part.unit = match.unit;
            renderService();
            showToast(`Kode ditemukan: ${match.name}`);
          }
        });
      }
      row.querySelector('.f-name').addEventListener('input', e => {
        part.name = e.target.value;
        const found = applyItemNameLookup(part);
        if (found) {
          renderService();
          showToast(`Kode otomatis terisi: ${part.code}`);
        }
      });
      row.querySelector('.f-qty').addEventListener('input', e => part.qty = e.target.value);
      row.querySelector('.f-unit').addEventListener('input', e => part.unit = e.target.value);
      row.querySelector('.rm').addEventListener('click', () => {
        s.parts = s.parts.filter(p => p.id !== pid);
        if (!s.parts.length) s.parts.push(blankSvcPart());
        renderService();
      });
    });
    list.querySelectorAll('.svc-add-part').forEach(b => b.addEventListener('click', () => {
      const s = services.find(x => x.id === b.dataset.id);
      if (!s) return;
      s.parts = s.parts || [];
      s.parts.push(blankSvcPart());
      renderService();
    }));

    list.querySelectorAll('.act-selesai').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.id;
      const s = services.find(x => x.id === id);
      if (!s) return;
      const biayaEl = list.querySelector(`.svc-biaya-final[data-id="${id}"]`);
      const biaya = Number(biayaEl.value) || 0;
      const vendorNamaEl = list.querySelector(`.svc-vendor-nama[data-id="${id}"]`);
      const vendorBiayaEl = list.querySelector(`.svc-vendor-biaya[data-id="${id}"]`);
      const vendorNama = vendorNamaEl ? vendorNamaEl.value.trim() : '';
      const vendorBiaya = vendorBiayaEl ? (Number(vendorBiayaEl.value) || 0) : 0;
      const validParts = (s.parts || []).filter(p => p.name && Number(p.qty) > 0)
        .map(p => ({ name: p.name.trim(), qty: Number(p.qty), unit: (p.unit||'').trim() }));

      if (validParts.length) {
        const stockMapSvc = computeStock();
        const kurangParts = [];
        validParts.forEach(p => {
          const avail = getAvailableQty(stockMapSvc, p.name);
          if (p.qty > avail) {
            kurangParts.push(`${p.name} (stok tersisa ${avail}${p.unit ? ' '+p.unit : ''}, diminta ${p.qty})`);
          }
        });
        if (kurangParts.length) {
          showToast(`Stok sparepart tidak cukup untuk: ${kurangParts.join('; ')}. Cek tab Stok atau catat pembelian dulu.`);
          return;
        }
      }

      const partsInfo = validParts.length ? ` Sparepart yang dipakai (${validParts.map(p=>p.name).join(', ')}) akan otomatis mengurangi Stok.` : '';
      const vendorInfo = vendorBiaya > 0 ? ` Biaya jasa vendor ${rupiah(vendorBiaya)}${vendorNama ? ' ('+vendorNama+')' : ''} akan tercatat sebagai Beban Operasional.` : '';
      showConfirm(`Tandai service "${s.customerName}" (${s.device}) selesai dikerjakan dengan biaya final ${rupiah(biaya)}?${partsInfo}${vendorInfo}`, async () => {
      showLoadingModal('Menyelesaikan service...');
      let serviceItemName = s.serviceItemName;
      if (validParts.length) {
        serviceItemName = `Jasa Service Laptop - ${s.device} (${id.slice(0,6)})`;
        const prodTxn = {
          id: uid(),
          type: 'produksi',
          bahan: validParts,
          hasil: [{ name: serviceItemName, qty: 1, unit: 'jasa' }],
          total: 0,
          createdAt: Date.now(),
        };
        try {
          await saveTxn(prodTxn);
          txns.unshift(prodTxn);
          s.prodTxnId = prodTxn.id;
        } catch (e) {
          console.error(e);
          closeLoadingModal();
          showToast('Gagal mencatat pemakaian sparepart, coba lagi.');
          return;
        }
      }

      let vendorBebanId = s.vendorBebanId || null;
      if (vendorBiaya > 0) {
        const bebanVendor = {
          id: uid(),
          kategori: 'Jasa Vendor Service',
          kategoriCustom: vendorNama || '',
          nominal: vendorBiaya,
          keterangan: `Vendor service untuk ${s.customerName || 'pelanggan'} (${s.device || ''})${vendorNama ? ' - '+vendorNama : ''}`,
          linkedServiceId: id,
          createdAt: Date.now(),
          createdBy: currentUser ? currentUser.email : null,
        };
        try {
          await saveBebanItem(bebanVendor);
          bebanList.unshift(bebanVendor);
          vendorBebanId = bebanVendor.id;
        } catch (e) {
          console.error(e);
          closeLoadingModal();
          showToast('Gagal mencatat biaya vendor, coba lagi.');
          return;
        }
      }

      await updateService(id, { biayaFinal: biaya, parts: s.parts, serviceItemName, vendorNama, vendorBiaya, vendorBebanId });
      await advanceServiceStatus(id, 'selesai', false);
      await recordServiceTagihanAtSelesai(id);
      closeLoadingModal();
      renderService();
      sendServiceWhatsapp(id, 'selesai');
      });
    }));

    list.querySelectorAll('.act-diambil').forEach(b => b.addEventListener('click', () => markServicePickedUp(b.dataset.id)));
    list.querySelectorAll('.svc-mark-lunas').forEach(b => b.addEventListener('click', () => markServiceLunas(b.dataset.id)));

    list.querySelectorAll('.act-wa').forEach(b => b.addEventListener('click', () => sendServiceWhatsapp(b.dataset.id, 'manual')));

    list.querySelectorAll('.act-print-nota').forEach(b => b.addEventListener('click', () => {
      const s = services.find(x => x.id === b.dataset.id);
      if (s) showServiceReceipt(s);
    }));

    list.querySelectorAll('.svc-del-btn').forEach(b => b.addEventListener('click', () => removeService(b.dataset.id)));

    // ---- Edit Transaksi Service (biaya final, sparepart, vendor, DP) untuk status selesai/diambil ----
    list.querySelectorAll('.svc-edit-txn-btn').forEach(b => b.addEventListener('click', () => {
      editingServiceTxnId = b.dataset.id;
      renderService();
    }));
    list.querySelectorAll('.svc-edittxn-cancel').forEach(b => b.addEventListener('click', () => {
      editingServiceTxnId = null;
      renderService();
    }));
    list.querySelectorAll('.svc-edittxn-save').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.id;
      const s = services.find(x => x.id === id);
      if (!s) return;
      const errEl = document.getElementById(`bk-svc-edittxn-err-${id}`);
      const newBiaya = Number((list.querySelector(`.svc-edittxn-biaya[data-id="${id}"]`)||{}).value) || 0;
      const newVendorNama = (list.querySelector(`.svc-edittxn-vendor-nama[data-id="${id}"]`)||{}).value || '';
      const newVendorBiaya = Number((list.querySelector(`.svc-edittxn-vendor-biaya[data-id="${id}"]`)||{}).value) || 0;
      const newDp = Number((list.querySelector(`.svc-edittxn-dp[data-id="${id}"]`)||{}).value) || 0;
      const newParts = (s.parts || []).filter(p => p.name && Number(p.qty) > 0)
        .map(p => ({ name: p.name.trim(), qty: Number(p.qty), unit: (p.unit||'').trim() }));

      if (newDp > newBiaya) {
        if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'DP tidak boleh lebih besar dari biaya final.'; }
        return;
      }
      errEl && (errEl.style.display = 'none');

      showLoadingModal('Menyimpan perubahan transaksi...');
      try {
        // 1) Sparepart berubah? Hapus produksi txn lama (stok kembali), buat baru kalau ada sparepart.
        const oldPartsKey = JSON.stringify((s.parts||[]).filter(p=>p.name&&Number(p.qty)>0).map(p=>({n:p.name.trim().toLowerCase(),q:Number(p.qty)})).sort((a,b)=>a.n.localeCompare(b.n)));
        const newPartsKey = JSON.stringify(newParts.map(p=>({n:p.name.toLowerCase(),q:p.qty})).sort((a,b)=>a.n.localeCompare(b.n)));
        if (oldPartsKey !== newPartsKey) {
          if (s.prodTxnId) {
            try { await deleteTxnFromStore(s.prodTxnId); } catch (e) { /* mungkin sudah terhapus */ }
            txns = txns.filter(x => x.id !== s.prodTxnId);
            s.prodTxnId = null;
          }
          if (newParts.length) {
            const stockMapNow = computeStock();
            const kurang = [];
            newParts.forEach(p => {
              const avail = getAvailableQty(stockMapNow, p.name);
              if (p.qty > avail) kurang.push(`${p.name} (stok tersisa ${avail}${p.unit?' '+p.unit:''}, diminta ${p.qty})`);
            });
            if (kurang.length) {
              closeLoadingModal();
              if (errEl) { errEl.style.display = 'block'; errEl.textContent = `Stok sparepart tidak cukup untuk: ${kurang.join('; ')}.`; }
              return;
            }
            const prodTxn = {
              id: uid(), type: 'produksi', bahan: newParts,
              hasil: [{ name: s.serviceItemName || `Jasa Service Laptop - ${s.device} (${id.slice(0,6)})`, qty: 1, unit: 'jasa' }],
              total: 0, createdAt: Date.now(),
            };
            await saveTxn(prodTxn);
            txns.unshift(prodTxn);
            s.prodTxnId = prodTxn.id;
          }
        }

        // 2) Vendor cost berubah? Update / buat / hapus Beban terkait.
        if (newVendorBiaya > 0) {
          if (s.vendorBebanId && bebanList.find(x => x.id === s.vendorBebanId)) {
            const beban = bebanList.find(x => x.id === s.vendorBebanId);
            beban.nominal = newVendorBiaya;
            beban.kategoriCustom = newVendorNama || '';
            beban.keterangan = `Vendor service untuk ${s.customerName || 'pelanggan'} (${s.device || ''})${newVendorNama ? ' - '+newVendorNama : ''}`;
            await saveBebanItem(beban);
          } else {
            const bebanVendor = {
              id: uid(), kategori: 'Jasa Vendor Service', kategoriCustom: newVendorNama || '', nominal: newVendorBiaya,
              keterangan: `Vendor service untuk ${s.customerName || 'pelanggan'} (${s.device || ''})${newVendorNama ? ' - '+newVendorNama : ''}`,
              linkedServiceId: id, createdAt: Date.now(), createdBy: currentUser ? currentUser.email : null,
            };
            await saveBebanItem(bebanVendor);
            bebanList.unshift(bebanVendor);
            s.vendorBebanId = bebanVendor.id;
          }
        } else if (s.vendorBebanId) {
          try { await window.storage.delete('beban:' + s.vendorBebanId, true); } catch (e) { /* mungkin sudah terhapus */ }
          bebanList = bebanList.filter(x => x.id !== s.vendorBebanId);
          s.vendorBebanId = null;
        }

        // 3) Update transaksi pemasukan (linkedTxnId) supaya nilainya ikut biaya final baru.
        if (s.linkedTxnId) {
          const t = txns.find(x => x.id === s.linkedTxnId);
          if (t) {
            t.total = newBiaya;
            if (t.items && t.items[0]) t.items[0].price = newBiaya;
            await saveTxn(t);
          }
        }

        // 4) Simpan field service.
        await updateService(id, { biayaFinal: newBiaya, parts: s.parts, vendorNama: newVendorNama, vendorBiaya: newVendorBiaya, dpAmount: newDp });

        editingServiceTxnId = null;
        invalidateStockCaches();
        closeLoadingModal();
        renderService();
        showToast('Transaksi service berhasil diperbarui.');
      } catch (e) {
        console.error(e);
        closeLoadingModal();
        if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'Gagal menyimpan perubahan, coba lagi.'; }
      }
    }));
  }

  async function updateService(id, patch) {
    const s = services.find(x => x.id === id);
    if (!s) return;
    Object.assign(s, patch, { updatedAt: Date.now() });
    try { await saveService(s); } catch (e) { console.error(e); showToast('Gagal menyimpan perubahan, coba lagi.'); }
  }

  async function advanceServiceStatus(id, newStatus, rerender = true) {
    const s = services.find(x => x.id === id);
    if (!s) return;
    s.status = newStatus;
    s.updatedAt = Date.now();
    s.history = s.history || [];
    s.history.push({ status: newStatus, at: Date.now() });
    try {
      await saveService(s);
      if (rerender) renderService();
    } catch (e) {
      console.error(e);
      showToast('Gagal memperbarui status, coba lagi.');
    }
  }

  async function finalizeServiceAsIncome(id) {
    const s = services.find(x => x.id === id);
    if (!s) return;
    const sisa = Math.max(0, (Number(s.biayaFinal)||0) - (Number(s.dpAmount)||0));
    const confirmMsg = s.dpAmount
      ? `Biaya final ${rupiah(s.biayaFinal)} dikurangi DP ${rupiah(s.dpAmount)} = sisa ${rupiah(sisa)} akan dicatat sebagai pemasukan, dan status ditandai sudah diambil. Lanjutkan?`
      : `Catat biaya service ${rupiah(s.biayaFinal)} sebagai pemasukan dan tandai sudah diambil?`;
    showConfirm(confirmMsg, async () => {
      try {
        const txn = {
          id: uid(),
          type: 'penjualan',
          items: [{ name: s.serviceItemName || `Jasa Service Laptop - ${s.device}`, qty: 1, unit: 'jasa', price: sisa }],
          total: sisa,
          customerName: s.customerName,
          customerPhone: s.customerPhone,
          supplierName: '',
          paid: sisa <= 0 ? true : (s.paid !== false),
          rekening: s.rekening || BANK_ACCOUNTS[0].id,
          createdAt: Date.now(),
        };
        await saveTxn(txn);
        txns.unshift(txn);
        s.linkedTxnId = txn.id;
        s.paid = txn.paid;
        s.status = 'diambil';
        s.updatedAt = Date.now();
        s.history = s.history || [];
        s.history.push({ status: 'diambil', at: Date.now() });
        await saveService(s);
        renderService();
        showServiceReceipt(s);
      } catch (e) {
        console.error(e);
        showToast('Gagal menyelesaikan data service, coba lagi.');
      }
    });
  }

  // Dipanggil otomatis begitu service ditandai "Selesai dikerjakan" - langsung catat sebagai
  // tagihan/pemasukan saat itu juga, supaya muncul di tab Tagihan tanpa menunggu diambil.
  // Ini mencegah dobel pencatatan: saat nanti benar-benar diambil, tinggal update status saja.
  async function recordServiceTagihanAtSelesai(id) {
    const s = services.find(x => x.id === id);
    if (!s || s.linkedTxnId) return; // sudah pernah tercatat, jangan buat lagi
    const sisa = Math.max(0, (Number(s.biayaFinal)||0) - (Number(s.dpAmount)||0));
    try {
      const txn = {
        id: uid(),
        type: 'penjualan',
        items: [{ name: s.serviceItemName || `Jasa Service Laptop - ${s.device}`, qty: 1, unit: 'jasa', price: sisa }],
        total: sisa,
        customerName: s.customerName,
        customerPhone: s.customerPhone,
        supplierName: '',
        paid: sisa <= 0 ? true : false,
        rekening: s.rekening || BANK_ACCOUNTS[0].id,
        createdAt: Date.now(),
      };
      await saveTxn(txn);
      txns.unshift(txn);
      s.linkedTxnId = txn.id;
      s.paid = txn.paid;

  // Dipanggil saat "Sudah diambil pelanggan" - kalau tagihan sudah tercatat sejak status Selesai,
  // di sini cuma update status (tidak membuat transaksi baru, jadi tidak dobel).
  async function markServicePickedUp(id) {
    const s = services.find(x => x.id === id);
    if (!s) return;
    // Fallback untuk data lama yang sudah di status Selesai sebelum fitur ini ada (belum ada linkedTxnId)
    if (!s.linkedTxnId) { finalizeServiceAsIncome(id); return; }
    const sisa = Math.max(0, (Number(s.biayaFinal)||0) - (Number(s.dpAmount)||0));
    const statusLabel = s.paid === false ? `masih ada tagihan ${rupiah(sisa)} belum lunas` : 'sudah lunas';
    showConfirm(`Tandai service "${s.customerName}" (${s.device}) sudah diambil pelanggan? (Status pembayaran: ${statusLabel})`, async () => {
      try {
        s.status = 'diambil';
        s.updatedAt = Date.now();
        s.history = s.history || [];
        s.history.push({ status: 'diambil', at: Date.now() });
        await saveService(s);
        renderService();
        showServiceReceipt(s);
      } catch (e) {
        console.error(e);
        showToast('Gagal memperbarui status, coba lagi.');
      }
    });
  }

  async function removeService(id) {
    if (!requireOwnerForDelete()) return;
    const s = services.find(x => x.id === id);
    if (!s) return;
    showConfirm('Hapus data service ini? Kalau ada transaksi pemasukan terkait, transaksi itu juga akan ikut terhapus.', async () => {
      showLoadingModal('Menghapus data service...');
      try {
        const linkedTxnsSnapshot = [s.linkedTxnId, s.prodTxnId, s.dpTxnId]
          .filter(Boolean).map(tid => txns.find(x => x.id === tid)).filter(Boolean);
        await logToTrash('service', `${s.customerName || 'Tanpa nama'} - ${s.device || ''}`, { service: s, linkedTxns: linkedTxnsSnapshot });
        trashEntriesCache = null;
        if (s.linkedTxnId) {
          try { await deleteTxnFromStore(s.linkedTxnId); } catch (e) { /* mungkin sudah terhapus */ }
          txns = txns.filter(x => x.id !== s.linkedTxnId);
        }
        if (s.prodTxnId) {
          try { await deleteTxnFromStore(s.prodTxnId); } catch (e) { /* mungkin sudah terhapus */ }
          txns = txns.filter(x => x.id !== s.prodTxnId);
        }
        if (s.dpTxnId) {
          try { await deleteTxnFromStore(s.dpTxnId); } catch (e) { /* mungkin sudah terhapus */ }
          txns = txns.filter(x => x.id !== s.dpTxnId);
        }
        if (s.vendorBebanId) {
          try { await window.storage.delete('beban:' + s.vendorBebanId, true); } catch (e) { /* mungkin sudah terhapus */ }
          bebanList = bebanList.filter(x => x.id !== s.vendorBebanId);
        }

        services = services.filter(x => x.id !== id);
        closeLoadingModal();
        renderService();
        showToast('Data service dihapus.');

  // Hapus banyak data service sekaligus (dari tab "Sedang berjalan" maupun "Riwayat service"),
  // sama seperti hapus massal transaksi di Riwayat - pilih via checkbox, satu dialog konfirmasi,
  // satu modal loading dengan progres, baru dieksekusi satu-satu.
  async function hapusServiceMassal(ids, refreshFn) {
    if (!requireOwnerForDelete()) return;
    if (!ids.length) return;
    const targets = ids.map(id => services.find(s => s.id === id)).filter(Boolean);
    if (!targets.length) { showToast('Tidak ada data service yang bisa dihapus.'); selectedSvcIds.clear(); refreshFn(); return; }
    const daftar = targets.map(s => `${escapeAttr(s.customerName || 'Tanpa nama')} &middot; ${escapeAttr(s.device || '')}`).join('<br/>');
    showConfirm(
      `Hapus <strong>${targets.length}</strong> data service terpilih? Kalau ada transaksi pemasukan terkait, transaksi itu juga akan ikut terhapus.<br/><br/><span style="font-size:12px; color:var(--ink-soft); text-align:left; display:block;">${daftar}</span>`,
      async () => {
        showLoadingModal(`Menghapus 0/${targets.length} service...`);
        let doneCount = 0;
        let failedCount = 0;
        for (const s of targets) {
          try {
            const linkedTxnsSnapshot = [s.linkedTxnId, s.prodTxnId, s.dpTxnId]
              .filter(Boolean).map(tid => txns.find(x => x.id === tid)).filter(Boolean);
            await logToTrash('service', `${s.customerName || 'Tanpa nama'} - ${s.device || ''}`, { service: s, linkedTxns: linkedTxnsSnapshot });
            if (s.linkedTxnId) {
              try { await deleteTxnFromStore(s.linkedTxnId); } catch (e) { /* mungkin sudah terhapus */ }
              txns = txns.filter(x => x.id !== s.linkedTxnId);
            }
            if (s.prodTxnId) {
              try { await deleteTxnFromStore(s.prodTxnId); } catch (e) { /* mungkin sudah terhapus */ }
              txns = txns.filter(x => x.id !== s.prodTxnId);
            }
            if (s.dpTxnId) {
              try { await deleteTxnFromStore(s.dpTxnId); } catch (e) { /* mungkin sudah terhapus */ }
              txns = txns.filter(x => x.id !== s.dpTxnId);
            }
            if (s.vendorBebanId) {
              try { await window.storage.delete('beban:' + s.vendorBebanId, true); } catch (e) { /* mungkin sudah terhapus */ }
              bebanList = bebanList.filter(x => x.id !== s.vendorBebanId);
            }
            await deleteServiceFromStore(s.id);
            services = services.filter(x => x.id !== s.id);
            doneCount++;
          } catch (e) {
            console.error('Gagal menghapus service', s.id, e);
            failedCount++;
          }
          updateLoadingModal(`Menghapus ${doneCount + failedCount}/${targets.length} service...`);
        }
        selectedSvcIds.clear();
        trashEntriesCache = null;
        closeLoadingModal();
        refreshFn();
        showToast(failedCount
          ? `${doneCount} service berhasil dihapus, ${failedCount} GAGAL (masalah koneksi) - coba lagi.`
          : `${doneCount} data service berhasil dihapus.`);
      }
    );
  }

  // Pasang event checkbox pilih-per-baris, "Pilih semua", dan tombol "Hapus terpilih" untuk
  // daftar service yang sedang tampil di #bk-svc-list. refreshFn dipanggil setiap kali seleksi
  // berubah supaya bar seleksi (jumlah terpilih, tombol Hapus) selalu sinkron dengan checkbox.
  function wireServiceBulkDeleteBar(refreshFn) {
    const list = document.getElementById('bk-svc-list');
    const checks = list ? Array.from(list.querySelectorAll('.bk-svc-check')) : [];
    checks.forEach(chk => chk.addEventListener('change', () => {
      const id = chk.dataset.id;
      if (chk.checked) selectedSvcIds.add(id); else selectedSvcIds.delete(id);
      refreshFn();
    }));
    const selectAllBox = document.getElementById('bk-svc-select-all');
    if (selectAllBox) selectAllBox.addEventListener('change', () => {
      const ids = checks.map(c => c.dataset.id);
      if (selectAllBox.checked) ids.forEach(id => selectedSvcIds.add(id));
      else ids.forEach(id => selectedSvcIds.delete(id));
      refreshFn();
    });
    const bulkBtn = document.getElementById('bk-svc-bulk-del-btn');
    if (bulkBtn) bulkBtn.addEventListener('click', () => {
      if (!selectedSvcIds.size) return;
      hapusServiceMassal(Array.from(selectedSvcIds), refreshFn);
    });
  }

      const lines = [];

  // ---------- PIUTANG ----------
  function renderPiutang() {
    const unpaidTxn = txns.filter(t => t.type === 'penjualan' && t.paid === false);
    const unpaidManual = manualTagihan.filter(m => m.paid === false);
    const combined = [
      ...unpaidTxn.map(t => ({ kind: 'txn', data: t, at: t.createdAt })),
      ...unpaidManual.map(m => ({ kind: 'manual', data: m, at: m.createdAt })),
    ].sort((a, b) => b.at - a.at);
    const total = combined.reduce((s, x) => s + (x.kind === 'txn' ? x.data.total : (Number(x.data.nominal) || 0)), 0);
    bodyEl.innerHTML = `
      <div class="bk-stats" style="grid-template-columns: 1fr;">
        <div class="bk-stat out"><div class="lbl">Total piutang belum lunas</div><div class="val">${rupiah(total)}</div></div>
      </div>
      <div class="bk-stok-note">Termasuk piutang dari penjualan/service dan tagihan manual (dibuat di tab Service &rarr; Tagihan) &mdash; otomatis tergabung di sini.</div>
      <div id="bk-piutang-list">${combined.length ? combined.map(x => x.kind === 'txn' ? piutangRowHtml(x.data) : manualTagihanRowHtml(x.data)).join('') : '<div class="bk-empty">Tidak ada piutang. Semua sudah lunas.</div>'}</div>
    `;
    bodyEl.querySelectorAll('[data-lunas]').forEach(btn => {
      btn.addEventListener('click', () => markLunas(btn.dataset.lunas));
    });
    bodyEl.querySelectorAll('[data-nota]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = txns.find(x => x.id === btn.dataset.nota);
        if (t) downloadNotaDotMatrix(t);
      });
    });
    bodyEl.querySelectorAll('[data-remind]').forEach(btn => {
      btn.addEventListener('click', () => remindWhatsapp(btn.dataset.remind));
    });
    wireManualTagihanActions(bodyEl, renderPiutang);
  }

  // ---------- EXPORT EXCEL (Laba Rugi, Neraca, Arus Kas, Beban, Stok Bulanan, Per Rekening) ----------
  function stripEntities(s) {
    return String(s || '')
      .replace(/&middot;/g, ' - ')
      .replace(/&minus;/g, '-')
      .replace(/&rarr;/g, '->')
      .replace(/&amp;/g, '&')
      .replace(/&mdash;/g, '-');
  }

  function itemBreakdownRows(scopedTxns, type) {
    const map = {};
    scopedTxns.filter(t => t.type === type && !findLinkedService(t.id)).forEach(t => {
      t.items.forEach(i => {
        const key = i.name.trim();
        if (!map[key]) map[key] = { qty: 0, total: 0, unit: i.unit || '' };
        map[key].qty += Number(i.qty) || 0;
        map[key].total += (Number(i.qty)||0) * (Number(i.price)||0);
      });
    });
    return Object.entries(map).sort((a,b) => b[1].total - a[1].total).map(([name, r]) => [name, r.qty, r.unit, r.total]);
  }

  // Rincian pendapatan jasa Service secara terpisah (per pelanggan/unit, bukan digabung per nama item)
  function serviceIncomeRows(scopedTxns) {
    return scopedTxns
      .filter(t => t.type === 'penjualan' && findLinkedService(t.id))
      .sort((a,b) => (b.createdAt||0) - (a.createdAt||0))
      .map(t => [
        t.customerName || 'Tanpa nama',
        (t.items && t.items[0] && t.items[0].name) || 'Jasa Service',
        new Date(t.createdAt).toLocaleDateString('id-ID'),
        t.total,
      ]);
  }

  function computeLabaRugiForMonth(mKey) {
    const byMonth = mKey === 'semua' ? txns : txns.filter(t => monthKey(t.createdAt) === mKey);
    const masuk = byMonth.filter(t => t.type === 'penjualan').reduce((s,t) => s + t.total, 0);
    const keluar = byMonth.filter(t => t.type === 'pembelian').reduce((s,t) => s + t.total, 0);
    const hppAll = computeHPP();
    const hppBulan = byMonth.filter(t => t.type === 'penjualan').reduce((s,t) => s + (hppAll.hppByTxn[t.id] || 0), 0);
    const labaKotorBulan = masuk - hppBulan;
    const bebanFiltered = bebanList.filter(b => mKey === 'semua' ? true : monthKey(b.createdAt) === mKey);
    const totalBeban = bebanFiltered.reduce((s,b) => s + (Number(b.nominal)||0), 0);
    const labaBersih = labaKotorBulan - totalBeban;
    return { byMonth, masuk, keluar, hppBulan, labaKotorBulan, bebanFiltered, totalBeban, labaBersih };
  }

    const bebanRows = Object.entries(bebanMap).sort((a,b) => b[1] - a[1]);
    const hasSplit = produkIncome != null && svcIncome != null;

  // ---------- LAPORAN LABA RUGI (PDF) ----------
  // ---------- NOTA PDF FORMAT DOT MATRIX (kertas kontinu, mirip printer POS lama) ----------
  function downloadNotaDotMatrix(t) {
    if (!window.jspdf) { showToast('Modul PDF belum siap, coba lagi sebentar.'); return; }
    const { jsPDF } = window.jspdf;
    // Ukuran kertas kontinu dot matrix: 9.5 x 5.5 inch - lebar 9.5" adalah standar baku kertas
    // kontinu (cocok dengan spek Epson LQ-310, lebar kertas 4"-10"), panjang 5.5" ukuran umum untuk nota.
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [139.7, 241.3] });
    const pageW = 241.3;
    const pageH = 139.7;
    const bottomSafeMargin = 6; // sisa ruang kosong di bawah supaya benar-benar tidak meluber ke lembar berikutnya
    const storeName = document.getElementById('bk-storename').value || 'Toko Saya';
    const acc = BANK_ACCOUNTS.find(a => a.id === t.rekening) || null;
    const isTransfer = !!t.rekening;
    const tgl = new Date(t.createdAt);
    const tglLabel = tgl.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }) + ' ' + tgl.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const marginL = 12, marginR = pageW - 12;
    const items = t.items || [];
    const N = Math.max(1, items.length);

    // Hitung dulu berapa ruang yang PASTI dipakai bagian tetap (header, info, kepada, tabel head,
    // ringkasan, tanda tangan, footer) TANPA baris item, supaya bisa tahu berapa ruang tersisa
    // untuk baris item - baris item lalu dipadatkan otomatis kalau jumlahnya banyak, supaya
    // total tinggi konten PASTI tidak pernah melebihi 1 halaman (tidak meluber ke lembar ke-2).
    const yBeforeItems = 12 + 3 /*perkiraan max(header,info)+3, dihitung ulang presisi di bawah*/;
    // (nilai presisi dihitung ulang saat render sesungguhnya di bawah; ini hanya untuk estimasi budget)
    const fixedAfterItems = 2.5 + 4.5 /*garis bawah tabel*/ + (5 * 3.8) /*ringkasan (dipadatkan)*/ + 4 /*jarak*/ + 22 /*ttd ke footer (dipadatkan)*/;
    const estimatedFixedBeforeItems = 58.0; // header+info+kepada+judul tabel (nilai tetap, sudah diverifikasi lewat perhitungan manual)
    const budgetForItems = Math.max(4, (pageH - bottomSafeMargin) - estimatedFixedBeforeItems - fixedAfterItems);
    const idealLineH = 4.3;
    let itemLineH = idealLineH;
    let itemFontSize = 8.5;
    if (N * idealLineH > budgetForItems) {
      itemLineH = Math.max(2.6, budgetForItems / N);
      itemFontSize = Math.max(6, 8.5 * (itemLineH / idealLineH));
    }

    let y = 12;

    doc.setFont('courier', 'normal'); doc.setFontSize(7); doc.setTextColor(140);
    doc.text('Nota Kasir - ' + storeName, marginL, 7);
    doc.text(new Date().toLocaleString('id-ID'), marginR, 7, { align: 'right' });
    doc.setTextColor(20);

    // Header toko
    doc.setFont('courier', 'bold'); doc.setFontSize(14);
    doc.text(storeName, marginL, y); y += 6;
    doc.setFont('courier', 'normal'); doc.setFontSize(8.5);
    doc.text('Nota Penjualan', marginL, y);

    // Info invoice (kanan atas)
    let yInfo = 12;
    doc.setFontSize(8.5);
    const infoRows = [
      ['No. Invoice', ': ' + (t.kodeTransaksi || t.id.slice(0,8).toUpperCase())],
      ['Tanggal', ': ' + tglLabel],
      ['Transaksi', ': ' + (isTransfer ? ('Transfer - ' + (acc ? acc.label : '')) : 'Tunai / Cash')],
      ['Kasir', ': ' + (t.createdBy || 'Admin')],
    ];
    infoRows.forEach(([label, val]) => {
      doc.text(label, marginR - 67, yInfo);
      doc.text(val, marginR - 45, yInfo);
      yInfo += 4.3;
    });
    y = Math.max(y, yInfo) + 3;

    doc.setDrawColor(90); doc.setLineWidth(0.2);
    doc.line(marginL, y, marginR, y); y += 5;

    doc.setFont('courier', 'bold'); doc.setFontSize(8.5);
    doc.text('Kepada', marginL, y); y += 4.3;
    doc.setFont('courier', 'normal');
    doc.text(`Nama : ${t.customerName || '-'}`, marginL, y); y += 4;
    doc.text(`No.HP: ${t.customerPhone || '-'}`, marginL, y); y += 5.5;

    // Tabel item - kolom diberi jarak cukup supaya nilai Rupiah tidak tumpang tindih
    const colDesc = marginL + 3;
    const colTotal = marginR - 3;
    const dividerTotal = marginR - 41;
    const colHarga = dividerTotal - 3;
    const dividerHarga = dividerTotal - 37;
    const dividerQty = dividerHarga - 19;
    const colQty = (dividerQty + dividerHarga) / 2;
    const tableTop = y;
    doc.setFont('courier', 'bold'); doc.setFontSize(8.5);
    doc.text('Item Description', colDesc, y + 4.3);
    doc.text('Qty', colQty, y + 4.3, { align: 'center' });
    doc.text('Harga', colHarga, y + 4.3, { align: 'right' });
    doc.text('Total Harga', colTotal, y + 4.3, { align: 'right' });
    y += 7;
    doc.line(marginL, y, marginR, y);
    y += 0.8;

    doc.setFont('courier', 'normal'); doc.setFontSize(itemFontSize);
    items.forEach(i => {
      y += itemLineH;

  // ---------- LAPORAN: Arus Kas, Neraca, Beban Operasional, Stok Bulanan, Per Rekening ----------
  // ---------- JURNAL UMUM (derivasi otomatis dari seluruh transaksi, format akuntansi debit/kredit) ----------
  function computeJurnalUmum(mKey) {
    const hpp = computeHPP();
    const entries = [];
    const inScope = (ts) => mKey === 'semua' ? true : monthKey(ts) === mKey;

    txns.forEach(t => {
      if (!inScope(t.createdAt)) return;
      if (t.type === 'pembelian') {
        entries.push({
          at: t.createdAt,
          ket: `Pembelian - ${t.supplierName || 'Supplier'}${t.kodeTransaksi ? ' (' + t.kodeTransaksi + ')' : ''}`,
          lines: [
            { akun: 'Persediaan Barang', debit: t.total, kredit: 0 },
            { akun: 'Kas', debit: 0, kredit: t.total },
          ],
        });
      } else if (t.type === 'penjualan') {
        const isLunas = t.paid !== false;
        const hppAmt = hpp.hppByTxn[t.id] || 0;
        const lines = [];
        if (isLunas) lines.push({ akun: 'Kas', debit: t.total, kredit: 0 });
        else lines.push({ akun: 'Piutang Usaha', debit: t.total, kredit: 0 });
        lines.push({ akun: 'Penjualan', debit: 0, kredit: t.total });
        if (hppAmt > 0) {
          lines.push({ akun: 'Harga Pokok Penjualan (HPP)', debit: hppAmt, kredit: 0 });
          lines.push({ akun: 'Persediaan Barang', debit: 0, kredit: hppAmt });
        }
        entries.push({
          at: t.createdAt,
          ket: `Penjualan - ${t.customerName || 'Pelanggan'}${t.kodeTransaksi ? ' (' + t.kodeTransaksi + ')' : ''}${isLunas ? '' : ' [Piutang]'}`,
          lines,
        });
      } else if (t.type === 'produksi') {
        const info = hpp.prodCostByTxn[t.id];
        const cost = info ? info.batchCost : 0;
        if (cost > 0) {
          entries.push({
            at: t.createdAt,
            ket: `Produksi${t.kodeTransaksi ? ' (' + t.kodeTransaksi + ')' : ''} - ${summarizeProduksi(t).replace(/&rarr;/, '->')}`,
            lines: [
              { akun: 'Persediaan Produk Jadi', debit: cost, kredit: 0 },
              { akun: 'Persediaan Bahan Baku', debit: 0, kredit: cost },
            ],
          });
        }
      }
    });

    bebanList.forEach(b => {
      if (!inScope(b.createdAt)) return;
      const label = (b.kategori === 'Lainnya' && b.kategoriCustom) ? b.kategoriCustom : b.kategori;
      const nominal = Number(b.nominal) || 0;
      entries.push({
        at: b.createdAt,
        ket: `Beban ${label}${b.keterangan ? ' - ' + b.keterangan : ''}`,
        lines: [
          { akun: `Beban ${label}`, debit: nominal, kredit: 0 },
          { akun: 'Kas', debit: 0, kredit: nominal },
        ],
      });
    });

    utangList.forEach(u => {
      if (!inScope(u.createdAt)) return;
      const nominal = Number(u.nominalAwal) || 0;
      entries.push({
        at: u.createdAt,
        ket: `Terima pinjaman - ${u.kreditur} (${u.jenis})`,
        lines: [
          { akun: 'Kas', debit: nominal, kredit: 0 },
          { akun: 'Utang Usaha', debit: 0, kredit: nominal },
        ],
      });
    });
    utangPayments.forEach(p => {
      if (!inScope(p.createdAt)) return;
      const u = utangList.find(x => x.id === p.utangId);
      const nominal = Number(p.nominal) || 0;
      entries.push({
        at: p.createdAt,
        ket: `Bayar cicilan utang - ${u ? u.kreditur : '-'}`,
        lines: [
          { akun: 'Utang Usaha', debit: nominal, kredit: 0 },
          { akun: 'Kas', debit: 0, kredit: nominal },
        ],
      });
    });

    modalEntries.forEach(m => {
      if (!inScope(m.createdAt)) return;
      const nominal = Number(m.nominal) || 0;
      if (m.jenis === 'penarikan') {
        entries.push({
          at: m.createdAt,
          ket: `Penarikan modal${m.keterangan ? ' - ' + m.keterangan : ''}`,
          lines: [
            { akun: 'Modal (Penarikan/Prive)', debit: nominal, kredit: 0 },
            { akun: 'Kas', debit: 0, kredit: nominal },
          ],
        });
      } else {
        entries.push({
          at: m.createdAt,
          ket: `Setoran modal${m.keterangan ? ' - ' + m.keterangan : ''}`,
          lines: [
            { akun: 'Kas', debit: nominal, kredit: 0 },
            { akun: 'Modal', debit: 0, kredit: nominal },
          ],
        });
      }
    });

    manualTagihan.forEach(m => {
      if (!inScope(m.createdAt)) return;
      const nominal = Number(m.nominal) || 0;
      const isLunas = m.paid === true;
      entries.push({
        at: m.createdAt,
        ket: `Tagihan manual - ${m.customerName || 'Pelanggan'}${m.kodeTagihan ? ' (' + m.kodeTagihan + ')' : ''}${m.keterangan ? ' - ' + m.keterangan : ''}`,
        lines: [
          { akun: isLunas ? 'Kas' : 'Piutang Usaha', debit: nominal, kredit: 0 },
          { akun: 'Pendapatan Jasa Lain-lain', debit: 0, kredit: nominal },
        ],
      });
    });

    entries.sort((a, b) => (b.at || 0) - (a.at || 0));
    const totalDebit = entries.reduce((s, e) => s + e.lines.reduce((s2, l) => s2 + l.debit, 0), 0);
    const totalKredit = entries.reduce((s, e) => s + e.lines.reduce((s2, l) => s2 + l.kredit, 0), 0);
    return { entries, totalDebit, totalKredit };
  }

  function laporanAvailableMonths() {
    const set = new Set();
    txns.forEach(t => set.add(monthKey(t.createdAt)));
    bebanList.forEach(b => set.add(monthKey(b.createdAt)));
    utangList.forEach(u => set.add(monthKey(u.createdAt)));
    utangPayments.forEach(p => set.add(monthKey(p.createdAt)));
    modalEntries.forEach(m => set.add(monthKey(m.createdAt)));
    return Array.from(set).sort().reverse();
  }

  function computeKasTotal() {
    let kas = 0;
    txns.forEach(t => {
      if (t.type === 'penjualan' && t.paid !== false) kas += t.total;
      if (t.type === 'pembelian') kas -= t.total;
    });
    bebanList.forEach(b => { kas -= Number(b.nominal) || 0; });
    utangList.forEach(u => { kas += Number(u.nominalAwal) || 0; });
    utangPayments.forEach(p => { kas -= Number(p.nominal) || 0; });
    modalEntries.forEach(m => { const amt = Number(m.nominal) || 0; kas += (m.jenis === 'penarikan' ? -amt : amt); });
    return kas;
  }
  function computePiutangTotalLap() {
    return txns.filter(t => t.type === 'penjualan' && t.paid === false).reduce((s,t) => s + t.total, 0)
      + manualTagihan.filter(m => m.paid === false).reduce((s,m) => s + (Number(m.nominal)||0), 0);
  }
  function computePersediaanTotal() {
    const stockMap = computeStock();
    const hpp = computeHPP();
    let total = 0;
    Object.values(stockMap).forEach(r => {
      if (/^Jasa Service Laptop/i.test(r.name)) return;
      if (r.qty > 0) total += r.qty * hpp.getCurrentUnitCost(r.name);
    });
    return total;
  }
  function computeKewajibanTotal() {
    return utangList.reduce((s,u) => s + (Number(u.sisaUtang)||0), 0);
  }
  function computeNeraca() {
    const kas = computeKasTotal();
    const piutang = computePiutangTotalLap();
    const persediaan = computePersediaanTotal();
    const kewajiban = computeKewajibanTotal();
    const modalAwalTotal = computeModalAwalTotal();
    const totalAset = kas + piutang + persediaan;
    const totalModal = totalAset - kewajiban;
    const labaDitahan = totalModal - modalAwalTotal;
    return { kas, piutang, persediaan, kewajiban, totalAset, modalAwal: modalAwalTotal, labaDitahan, totalModal };
  }

  function computeArusKasForMonth(mKey) {
    const inflow = [];
    const outflow = [];
    txns.forEach(t => {
      const inMonth = mKey === 'semua' ? true : monthKey(t.createdAt) === mKey;
      if (!inMonth) return;
      if (t.type === 'penjualan' && t.paid !== false) {
        inflow.push({ label: `${t.customerName || 'Penjualan'} &middot; ${(t.items||[]).map(i=>i.name).join(', ')}`, amount: t.total, date: t.createdAt });
      }
      if (t.type === 'pembelian') {
        outflow.push({ label: `${t.supplierName || 'Pembelian'} &middot; ${(t.items||[]).map(i=>i.name).join(', ')}`, amount: t.total, date: t.createdAt });
      }
    });
    bebanList.forEach(b => {
      const inMonth = mKey === 'semua' ? true : monthKey(b.createdAt) === mKey;
      if (!inMonth) return;
      const kategoriLabel = b.kategori === 'Lainnya' && b.kategoriCustom ? b.kategoriCustom : b.kategori;
      outflow.push({ label: `Beban: ${kategoriLabel}${b.keterangan ? ' - '+b.keterangan : ''}`, amount: Number(b.nominal)||0, date: b.createdAt });
    });
    utangList.forEach(u => {
      const inMonth = mKey === 'semua' ? true : monthKey(u.createdAt) === mKey;
      if (!inMonth) return;
      inflow.push({ label: `Terima pinjaman: ${u.kreditur} (${u.jenis})`, amount: Number(u.nominalAwal)||0, date: u.createdAt });
    });
    utangPayments.forEach(p => {
      const inMonth = mKey === 'semua' ? true : monthKey(p.createdAt) === mKey;
      if (!inMonth) return;
      const u = utangList.find(x => x.id === p.utangId);
      outflow.push({ label: `Bayar cicilan utang: ${u ? u.kreditur : '-'}`, amount: Number(p.nominal)||0, date: p.createdAt });
    });
    modalEntries.forEach(m => {
      const inMonth = mKey === 'semua' ? true : monthKey(m.createdAt) === mKey;
      if (!inMonth) return;
      const amt = Number(m.nominal) || 0;
      if (m.jenis === 'penarikan') {
        outflow.push({ label: `Penarikan modal: ${m.keterangan || 'Tanpa keterangan'}`, amount: amt, date: m.createdAt });
      } else {
        inflow.push({ label: `Setoran modal: ${m.keterangan || 'Tanpa keterangan'}`, amount: amt, date: m.createdAt });
      }
    });
    inflow.sort((a,b)=>b.date-a.date);
    outflow.sort((a,b)=>b.date-a.date);
    const totalMasuk = inflow.reduce((s,x)=>s+x.amount,0);
    const totalKeluar = outflow.reduce((s,x)=>s+x.amount,0);
    return { inflow, outflow, totalMasuk, totalKeluar, netKas: totalMasuk - totalKeluar };
  }
  function computeSaldoKasSebelum(mKey) {
    if (mKey === 'semua') return 0;
    let saldo = 0;
    txns.forEach(t => {
      if (monthKey(t.createdAt) < mKey) {
        if (t.type === 'penjualan' && t.paid !== false) saldo += t.total;
        if (t.type === 'pembelian') saldo -= t.total;
      }
    });
    bebanList.forEach(b => { if (monthKey(b.createdAt) < mKey) saldo -= (Number(b.nominal)||0); });
    utangList.forEach(u => { if (monthKey(u.createdAt) < mKey) saldo += (Number(u.nominalAwal)||0); });
    utangPayments.forEach(p => { if (monthKey(p.createdAt) < mKey) saldo -= (Number(p.nominal)||0); });
    modalEntries.forEach(m => { if (monthKey(m.createdAt) < mKey) { const amt = Number(m.nominal) || 0; saldo += (m.jenis === 'penarikan' ? -amt : amt); } });
    return saldo;
  }

  function computeStokBulanan(mKey) {
    const items = {};
    function ensure(name, unit) {
      const k = (name||'').trim().toLowerCase();
      if (!k || /^jasa service laptop/i.test(name||'')) return null;
      if (!items[k]) items[k] = { name: name.trim(), unit: unit||'', awal:0, masuk:0, keluar:0 };
      if (unit) items[k].unit = unit;
      return items[k];
    }
    const sorted = [...txns].sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    sorted.forEach(t => {
      const tMonth = monthKey(t.createdAt);
      if (mKey !== 'semua' && tMonth > mKey) return;
      const isBefore = mKey !== 'semua' && tMonth < mKey;
      if (t.type === 'pembelian') {
        t.items.forEach(i => {
          const it = ensure(i.name, i.unit); if (!it) return;
          if (isBefore) it.awal += Number(i.qty)||0; else it.masuk += Number(i.qty)||0;
        });
      } else if (t.type === 'penjualan') {
        t.items.forEach(i => {
          const it = ensure(i.name, i.unit); if (!it) return;
          if (isBefore) it.awal -= Number(i.qty)||0; else it.keluar += Number(i.qty)||0;
        });
      } else if (t.type === 'produksi') {
        (t.bahan||[]).forEach(i => {
          const it = ensure(i.name, i.unit); if (!it) return;
          if (isBefore) it.awal -= Number(i.qty)||0; else it.keluar += Number(i.qty)||0;
        });
        (t.hasil||[]).forEach(i => {
          const it = ensure(i.name, i.unit); if (!it) return;
          if (isBefore) it.awal += Number(i.qty)||0; else it.masuk += Number(i.qty)||0;
        });
      }
    });
    return Object.values(items).map(it => ({ ...it, akhir: it.awal + it.masuk - it.keluar })).sort((a,b) => a.name.localeCompare(b.name));
  }

  function computeRekeningReport() {
    const byAccount = {};
    BANK_ACCOUNTS.forEach(acc => byAccount[acc.id] = { ...acc, total: 0, transactions: [] });
    txns.forEach(t => {
      if (t.type === 'penjualan' && t.paid !== false && t.rekening && byAccount[t.rekening]) {
        byAccount[t.rekening].total += t.total;
        byAccount[t.rekening].transactions.push(t);
      }
    });
    // Terapkan efek pemindahan dana antar rekening: berkurang di rekening asal, bertambah di rekening tujuan
    transferRekening.forEach(tr => {
      const jumlah = Number(tr.jumlah) || 0;
      if (byAccount[tr.dariRekening]) byAccount[tr.dariRekening].total -= jumlah;
      if (byAccount[tr.keRekening]) byAccount[tr.keRekening].total += jumlah;
    });
    Object.values(byAccount).forEach(a => a.transactions.sort((x,y) => (y.createdAt||0) - (x.createdAt||0)));
    return byAccount;
  }

  // Hitung pratinjau berapa item/transaksi yang terkait barang yang sudah dihapus dari Stok
  // (deletedStokNames), supaya pemilik tahu dulu skala dampaknya sebelum membersihkan.
  // Deteksi service yang "tautannya putus" - punya linkedTxnId tapi transaksinya sudah tidak ada
  // (biasanya akibat reset/hapus transaksi massal), sehingga pendapatannya hilang dari laporan keuangan.
  // ---------- SAMAKAN PEMBELIAN MIGRASI YANG YATIM (pasangan Penjualan sudah terhapus duluan) ----------
  // Transaksi Pembelian dari fitur "Migrasi Riwayat Penjualan Lama" selalu dibuat berpasangan dengan
  // Penjualan (supaya HPP/laba rugi lama akurat). Sebelum ada pairTxnId, kalau salah satu sisi dihapus
  // manual, sisi lainnya jadi "yatim" - tetap tercatat sebagai pengeluaran padahal penjualannya sudah
  // tidak ada. Fungsi ini mencari Pembelian migrasi (supplierName khas) yang TIDAK punya pairTxnId DAN
  // tidak ada Penjualan yang cocok (barang + jumlah sama, dibuat persis ~1 detik sesudahnya).
  function cariPembelianMigrasiYatim() {
    const kandidat = txns.filter(t => t.type === 'pembelian' && t.supplierName === 'Migrasi data lama' && !t.pairTxnId);
    return kandidat.filter(pt => {
      const itemP = (pt.items || [])[0];
      if (!itemP) return false;
      const match = txns.find(st => {
        if (st.type !== 'penjualan') return false;
        const itemS = (st.items || [])[0];
        if (!itemS) return false;
        const namaCocok = itemS.name && itemP.name && itemS.name.trim().toLowerCase() === itemP.name.trim().toLowerCase();
        const qtyCocok = Number(itemS.qty) === Number(itemP.qty);
        const waktuCocok = Math.abs((st.createdAt || 0) - (pt.createdAt || 0) - 1000) < 3000; // toleransi 3 detik
        return namaCocok && qtyCocok && waktuCocok;
      });
      return !match;
    });
  }

      <div style="font-size:12px; color:var(--ink-soft); text-align:left; margin-bottom:14px; padding:10px 12px; background:var(--paper); border:1px dashed var(--line); border-radius:8px;">${daftar}${moreNote}</div>

  // ---------- SINKRONKAN NO. HP DARI SERVICE KE TRANSAKSI TERKAIT ----------
  // Kalau transaksi pemasukan service dibuat/diubah sebelum No. HP sempat tersimpan dengan
  // benar (atau data lama), nota jadi tidak menampilkan No. HP walau di kartu Service-nya
  // sudah terisi. Alat ini mencari service yang No. HP-nya beda dari transaksi terkait, lalu
  // menyamakan transaksi mengikuti data Service (yang dianggap paling terbaru/benar).
  function cariServiceTeleponTidakSinkron() {
    return services.filter(s => {
      if (!s.linkedTxnId || !s.customerPhone) return false;
      const t = txns.find(x => x.id === s.linkedTxnId);
      return !!t && (t.customerPhone || '') !== s.customerPhone;
    });
  }
  async function sinkronkanTeleponServiceKeTransaksi() {
    if (!requireOwnerForDelete()) return;

        for (const s of targets) {
          const t = txns.find(x => x.id === s.linkedTxnId);
          if (t) {
            t.customerPhone = s.customerPhone;
            t.customerName = s.customerName || t.customerName;
            await saveTxn(t);

  // ---------- PINDAHKAN TANGGAL RIWAYAT SERVICE KE BULAN LAIN ----------
  // Untuk kasus tanggal salah (migrasi data lama, salah input, dll) - service "Sudah diambil"
  // beserta transaksi pemasukannya dipindahkan ke bulan target, TAPI urutan waktu antar riwayat
  // status (diterima -> diagnosa -> selesai -> diambil) tetap dipertahankan (cuma di-shift bareng).
  async function pindahkanTanggalServiceKeBulan() {
    if (!requireOwnerForDelete()) return;
    const fromSel = document.getElementById('bk-svc-move-from');
    const toInput = document.getElementById('bk-svc-move-to');
    const statusEl = document.getElementById('bk-svc-move-status');
    const fromMonth = fromSel.value;
    const toMonthStr = toInput.value; // format "YYYY-MM" dari <input type="month">
    if (!fromMonth) { statusEl.style.color = 'var(--money-out)'; statusEl.textContent = 'Belum ada bulan asal untuk dipilih.'; return; }
    if (!toMonthStr) { statusEl.style.color = 'var(--money-out)'; statusEl.textContent = 'Pilih dulu bulan tujuan.'; return; }
    if (fromMonth === toMonthStr) { statusEl.style.color = 'var(--money-out)'; statusEl.textContent = 'Bulan asal dan tujuan sama, tidak ada yang perlu dipindah.'; return; }
    const targets = services.filter(s => s.status === 'diambil' && svcMonthKey(svcCompletedAt(s)) === fromMonth);
    if (!targets.length) { statusEl.style.color = 'var(--money-out)'; statusEl.textContent = `Tidak ada riwayat service di ${monthLabel(fromMonth)}.`; return; }
    const totalNilai = targets.reduce((s,x) => s + Number(x.biayaFinal || x.estimasiBiaya || 0), 0);
    const [toY, toM] = toMonthStr.split('-').map(Number);
    showConfirm(
      `Pindahkan <strong>${targets.length}</strong> riwayat service dari <strong>${monthLabel(fromMonth)}</strong> ke <strong>${monthLabel(toMonthStr)}</strong>? Total nilai yang dipindah: <strong>${rupiah(totalNilai)}</strong>. Transaksi pemasukan yang tertaut juga ikut dipindah tanggalnya. Urutan waktu antar riwayat status tetap sama, cuma bulannya berubah.`,
      async () => {
        statusEl.style.color = 'var(--ink-soft)';
        statusEl.textContent = `Memindahkan ${targets.length} riwayat...`;
        showLoadingModal(`Memindahkan 0/${targets.length} riwayat...`);
        try {
          let doneCount = 0;
          for (const s of targets) {
            const oldCompleted = svcCompletedAt(s);
            const oldDate = new Date(oldCompleted);
            // Tanggal baru: bulan/tahun target, tanggal & jam ASLI dipertahankan supaya urutan
            // relatif antar service (yang di bulan lama urut per tanggal) tetap masuk akal.
            // Kalau tanggal aslinya lebih besar dari jumlah hari di bulan target, dibulatkan ke akhir bulan.
            const daysInTargetMonth = new Date(toY, toM, 0).getDate();
            const newDay = Math.min(oldDate.getDate(), daysInTargetMonth);
            const newCompleted = new Date(toY, toM - 1, newDay, oldDate.getHours(), oldDate.getMinutes(), oldDate.getSeconds()).getTime();
            const deltaMs = newCompleted - oldCompleted;
            // Shift SEMUA riwayat status dengan delta yang sama, supaya urutan diterima->diagnosa->selesai->diambil tetap valid
            s.history = (s.history || []).map(h => ({ ...h, at: h.at + deltaMs }));
            s.createdAt = (s.createdAt || 0) + deltaMs;
            s.updatedAt = newCompleted;
            await saveService(s);
            if (s.linkedTxnId) {
              const t = txns.find(x => x.id === s.linkedTxnId);
              if (t) {
                t.createdAt = newCompleted;
                await saveTxn(t);
              }
            }
            doneCount++;
            updateLoadingModal(`Memindahkan ${doneCount}/${targets.length} riwayat...`);
          }
          await loadServices();
          await loadTxns();
          invalidateStockCaches();
          closeLoadingModal();
          renderLaporan();
          statusEl.style.color = 'var(--money-in)';
          statusEl.textContent = `${doneCount} riwayat service berhasil dipindah ke ${monthLabel(toMonthStr)}.`;
          showToast(`${doneCount} riwayat service dipindah ke ${monthLabel(toMonthStr)}.`);
        } catch (err) {
          console.error(err);
          closeLoadingModal();
          statusEl.style.color = 'var(--money-out)';
          statusEl.textContent = 'Gagal memindahkan, coba lagi.';
        }
      }
    );
  }

  function hitungPreviewBersihkanTerhapus() {
    let jumlahTransaksiTerpengaruh = 0, totalNilaiDihapus = 0, jumlahItemDihapus = 0;
    txns.forEach(t => {
      if (t.type !== 'pembelian' && t.type !== 'penjualan') return;
      const items = t.items || [];
      const matched = items.filter(i => deletedStokNames.has((i.name||'').trim().toLowerCase()));
      if (matched.length) {
        jumlahTransaksiTerpengaruh++;
        jumlahItemDihapus += matched.length;
        totalNilaiDihapus += matched.reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);
      }
    });
    return { jumlahTransaksiTerpengaruh, totalNilaiDihapus, jumlahItemDihapus };
  }

  // Membersihkan HANYA bagian item yang sudah dihapus dari Stok, dari transaksi Pembelian/Penjualan
  // yang masih menyimpannya. Transaksi yang jadi kosong (semua itemnya barang terhapus) dihapus
  // seluruhnya; transaksi yang masih punya item lain yang valid cuma dikurangi & totalnya dihitung ulang.
  async function bersihkanTransaksiBarangTerhapus() {
    if (!requireOwnerForDelete()) return;
    const preview = hitungPreviewBersihkanTerhapus();
    if (!preview.jumlahTransaksiTerpengaruh) { showToast('Tidak ada yang perlu dibersihkan.'); return; }
    showConfirm(`Bersihkan ${preview.jumlahItemDihapus.toLocaleString('id-ID')} item (senilai ${rupiah(preview.totalNilaiDihapus)}) dari ${preview.jumlahTransaksiTerpengaruh.toLocaleString('id-ID')} transaksi yang terkait barang yang sudah dihapus dari Stok? Transaksi lain yang tidak terkait TIDAK akan disentuh. Tindakan ini tidak bisa dibatalkan.`, async () => {
      const statusEl = document.getElementById('bk-cleanup-status');
      statusEl.style.color = 'var(--ink-soft)';
      statusEl.textContent = 'Membersihkan...';
      showLoadingModal('Membersihkan data...');
      try {
        const toDelete = [];
        const toUpdate = [];
        txns.forEach(t => {
          if (t.type !== 'pembelian' && t.type !== 'penjualan') return;
          const items = t.items || [];
          const remaining = items.filter(i => !deletedStokNames.has((i.name||'').trim().toLowerCase()));
          if (remaining.length === items.length) return; // tidak terpengaruh, lewati
          if (remaining.length === 0) {
            toDelete.push(t.id);
          } else {
            const newTotal = remaining.reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);
            toUpdate.push({ ...t, items: remaining, total: newTotal });
          }
        });
        const jobFns = [
          ...toDelete.map(id => () => deleteTxnFromStore(id)),
          ...toUpdate.map(t => () => saveTxn(t)),
        ];
        await runJobsInChunks(jobFns, (done, total) => { statusEl.textContent = `Memproses... (${done}/${total})`; updateLoadingModal(`Memproses ${done}/${total}...`); });
        await loadTxns();
        invalidateStockCaches();
        closeLoadingModal();
        renderLaporan();
        showToast(`Berhasil dibersihkan: ${preview.jumlahItemDihapus.toLocaleString('id-ID')} item (${rupiah(preview.totalNilaiDihapus)}) dari ${preview.jumlahTransaksiTerpengaruh.toLocaleString('id-ID')} transaksi.`);
      } catch (err) {
        console.error(err);
        closeLoadingModal();
        statusEl.style.color = 'var(--money-out)';
        statusEl.textContent = 'Gagal membersihkan, coba lagi.';
      }
    });
  }

  function downloadFullBackup() {
    const backup = buildFullBackupObject();
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup-lapstore-${new Date().toISOString().slice(0,10)}.json`;

  // ---------- AUTO-BACKUP HARIAN ----------
  // Setiap kali aplikasi dibuka, cek apakah sudah ada backup otomatis untuk HARI INI. Kalau
  // belum, buat snapshot penuh data dan simpan ke Supabase (key: autobackup:YYYY-MM-DD) - tanpa
  // perlu diunduh manual. Backup lama (>30 hari) otomatis dihapus supaya tidak menumpuk terus.
  const AUTO_BACKUP_RETENTION_DAYS = 30;
  function todayDateKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  async function runAutoBackupHarianJikaPerlu() {
    try {
      const key = 'autobackup:' + todayDateKey();
      let already = false;
      try {
        const r = await window.storage.get(key, true);
        already = !!(r && r.value);
      } catch (e) { already = false; } // key belum ada = belum backup hari ini
      if (!already) {
        const backup = buildFullBackupObject();
        await window.storage.set(key, JSON.stringify(backup), true);
      }
      // Bersihkan backup otomatis yang lebih tua dari batas retensi
      const listRes = await window.storage.list('autobackup:', true);
      const keys = (listRes && listRes.keys) || [];
      const cutoff = Date.now() - AUTO_BACKUP_RETENTION_DAYS * 24 * 60 * 60 * 1000;
      for (const k of keys) {
        const dateStr = k.slice('autobackup:'.length);
        const t = new Date(dateStr + 'T00:00:00').getTime();
        if (!isNaN(t) && t < cutoff) {
          try { await window.storage.delete(k, true); } catch (e) { /* biarkan, coba lagi besok */ }
        }
      }
    } catch (err) {
      console.error('Auto-backup harian gagal:', err);
      // Diam-diam gagal tidak masalah - backup manual tetap tersedia, dan akan dicoba lagi besok/refresh berikutnya
    }
  }

  async function listAutoBackups() {
    try {
      const listRes = await window.storage.list('autobackup:', true);
      const keys = (listRes && listRes.keys) || [];
      return keys.map(k => k.slice('autobackup:'.length)).sort().reverse();
    } catch (e) { return []; }
  }

  // ---------- RIWAYAT DATA YANG DIHAPUS (TRASH / RECYCLE BIN) ----------
  // Setiap kali sesuatu dihapus lewat aplikasi ini, salinan datanya disimpan dulu ke sini
  // sebelum benar-benar dihapus dari tabel aslinya. Kalau salah hapus, bisa dipulihkan lagi
  // dari sini - dikelompokkan per hari. Otomatis dibersihkan setelah TRASH_RETENTION_DAYS hari.
  const TRASH_RETENTION_DAYS = 30;
  const TRASH_TYPE_LABELS = {
    txn: 'Transaksi', stok: 'Stok', service: 'Service Laptop', utang: 'Utang',
    beban: 'Beban Operasional', modal: 'Setoran/Penarikan Modal', tagihan: 'Tagihan Manual',
    transfer: 'Pemindahan Dana', closing: 'Snapshot Tutup Buku',
  };
  async function logToTrash(type, label, data) {
    try {
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      const entry = { type, label, data, deletedAt: Date.now(), deletedBy: currentUser ? currentUser.email : null };
      await window.storage.set('trash:' + id, JSON.stringify(entry), true);
    } catch (err) {
      console.error('Gagal mencatat ke riwayat penghapusan (trash):', err);
      // Diam-diam gagal tidak menghalangi proses hapus utama tetap berjalan
    }
  }
  async function loadTrashEntries() {
    try {
      const listRes = await window.storage.list('trash:', true);
      const keys = (listRes && listRes.keys) || [];
      const entries = [];
      for (const k of keys) {
        try {
          const r = await window.storage.get(k, true);
          if (r && r.value) entries.push({ id: k.slice('trash:'.length), ...JSON.parse(r.value) });
        } catch (e) { /* lewati entri yang gagal dibaca */ }
      }
      entries.sort((a,b) => (b.deletedAt||0) - (a.deletedAt||0));
      return entries;
    } catch (e) { return []; }
  }
  async function pruneOldTrash() {
    try {
      const listRes = await window.storage.list('trash:', true);
      const keys = (listRes && listRes.keys) || [];
      const cutoff = Date.now() - TRASH_RETENTION_DAYS * 24 * 60 * 60 * 1000;
      for (const k of keys) {
        try {
          const r = await window.storage.get(k, true);
          const entry = r && r.value ? JSON.parse(r.value) : null;
          if (entry && (entry.deletedAt||0) < cutoff) {
            await window.storage.delete(k, true);
          }
        } catch (e) { /* lewati */ }
      }
    } catch (e) { /* diam-diam gagal, coba lagi nanti */ }
  }
  function trashDayKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  async function restoreTrashEntry(trashId, entry) {
    if (!requireOwnerForDelete()) return;
    showConfirm(`Pulihkan "${escapeAttr(entry.label)}" yang dihapus pada ${new Date(entry.deletedAt).toLocaleString('id-ID')}?`, async () => {
      showLoadingModal('Memulihkan data...');
      try {
        const d = entry.data;
        if (entry.type === 'txn') {
          await saveTxn(d);
          if (!txns.some(x => x.id === d.id)) txns.unshift(d);
        } else if (entry.type === 'stok') {
          await pulihkanStokNama(d.name);
        } else if (entry.type === 'service') {
          await saveService(d.service);
          if (!services.some(x => x.id === d.service.id)) services.unshift(d.service);
          for (const t of (d.linkedTxns || [])) {
            await saveTxn(t);
            if (!txns.some(x => x.id === t.id)) txns.unshift(t);
          }
        } else if (entry.type === 'utang') {
          await saveUtangItem(d);
          if (!utangList.some(x => x.id === d.id)) utangList.unshift(d);
        } else if (entry.type === 'beban') {
          await saveBebanItem(d);
          if (!bebanList.some(x => x.id === d.id)) bebanList.unshift(d);
        } else if (entry.type === 'modal') {
          await saveModalEntry(d);
          if (!modalEntries.some(x => x.id === d.id)) modalEntries.push(d);
        } else if (entry.type === 'tagihan') {
          await saveManualTagihanItem(d);
          if (!manualTagihan.some(x => x.id === d.id)) manualTagihan.unshift(d);
        } else if (entry.type === 'transfer') {
          await saveTransferItem(d);
          if (!transferRekening.some(x => x.id === d.id)) transferRekening.unshift(d);
        } else if (entry.type === 'closing') {
          await saveClosingSnapshot(d);
          if (!closings.some(x => x.id === d.id)) closings.unshift(d);
        }
        await window.storage.delete('trash:' + trashId, true);
        if (trashEntriesCache) trashEntriesCache = trashEntriesCache.filter(x => x.id !== trashId);
        invalidateStockCaches();
        closeLoadingModal();
        renderLaporan();
        showToast(`"${entry.label}" berhasil dipulihkan.`);
      } catch (err) {
        console.error(err);
        closeLoadingModal();
        showToast('Gagal memulihkan, coba lagi.');
      }
    });
  }

          e.target.value = '';
        }
      });
    };
    reader.readAsText(file);
  }

  async function restoreFullBackup(backup) {
    const jobs = [];
    (backup.txns || []).forEach(t => jobs.push(saveTxn(t)));
    (backup.services || []).forEach(s => jobs.push(saveService(s)));
    (backup.bebanList || []).forEach(b => jobs.push(saveBebanItem(b)));
    (backup.closings || []).forEach(c => jobs.push(saveClosingSnapshot(c)));
    (backup.utangList || []).forEach(u => jobs.push(saveUtangItem(u)));
    (backup.utangPayments || []).forEach(p => jobs.push(saveUtangPayment(p)));
    (backup.modalEntries || []).forEach(m => jobs.push(saveModalEntry(m)));
    (backup.manualTagihan || []).forEach(m => jobs.push(saveManualTagihanItem(m)));
    if (backup.pricelistData && typeof backup.pricelistData === 'object') {
      Object.entries(backup.pricelistData).forEach(([key, val]) => {
        const markup = Number(val && val.markup) || 0;
        const hargaJual = (val && val.hargaJual != null) ? Number(val.hargaJual) : null;
        jobs.push(savePricelistEntry(key, hargaJual, markup));
      });
    }
    await Promise.all(jobs);
  }

  function renderTrashListHtml() {
    if (trashEntriesCache === null) return '<div class="bk-empty" style="padding:10px 0;">Memuat riwayat penghapusan...</div>';
    if (!trashEntriesCache.length) return '<div class="bk-empty" style="padding:10px 0;">Belum ada data yang dihapus (aman semua).</div>';
    const byDay = {};
    trashEntriesCache.forEach(e => {
      const dk = trashDayKey(e.deletedAt);
      if (!byDay[dk]) byDay[dk] = [];
      byDay[dk].push(e);
    });
    const days = Object.keys(byDay).sort().reverse();
    return days.map(dk => `
      <div style="margin-bottom:14px;">
        <div style="font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:6px;">${new Date(dk + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} (${byDay[dk].length})</div>
        ${byDay[dk].map(e => `
          <div class="bk-list-row">
            <div class="bk-list-left">
              <div class="nm">${escapeAttr(e.label)}</div>
              <div class="sub">${TRASH_TYPE_LABELS[e.type] || e.type} &middot; dihapus ${new Date(e.deletedAt).toLocaleTimeString('id-ID')}${e.deletedBy ? ' oleh '+escapeAttr(e.deletedBy) : ''}</div>
            </div>
            <button class="bk-btn ghost bk-trash-restore-btn" data-id="${e.id}">Pulihkan</button>
          </div>
        `).join('')}
      </div>
    `).join('');
  }

  // ---------- LAPORAN LABA RUGI (ringkasan lengkap: Pendapatan, HPP, Laba Kotor, Beban, Laba Bersih) ----------
  // Nilai stok yang BELUM terjual (modal yang masih "tertahan" di barang) - snapshot HARI INI,
  // bukan per-bulan, karena ini posisi stok saat ini, bukan transaksi pada suatu periode.
  function computeNilaiStokBelumTerjual() {
    const stockMap = computeStock();
    const hppNow = computeHPP();
    const codeRegNow = getItemCodeRegistry();
    let nilaiStokLaptop = 0, nilaiStokOnderdil = 0;
    Object.values(stockMap).forEach(r => {
      if (r.qty <= 0 || deletedStokNames.has(r.name.trim().toLowerCase())) return;
      if (/^Jasa Service Laptop/i.test(r.name)) return;
      const unitCost = hppNow.getCurrentUnitCost(r.name);
      const nilai = r.qty * unitCost;
      const code = codeRegNow.byName[r.name.trim().toLowerCase()] || '';
      if (/^LPSRV/i.test(code)) nilaiStokOnderdil += nilai; else nilaiStokLaptop += nilai;
    });
    return { nilaiStokLaptop, nilaiStokOnderdil, nilaiStokTotal: nilaiStokLaptop + nilaiStokOnderdil };
  }

  function renderLabaRugiBreakdownHtml(list) {
    const map = {};
    list.forEach(t => {
      (t.items || []).forEach(i => {
        const key = (i.name || '').trim();
        if (!key) return;
        if (!map[key]) map[key] = { qty: 0, total: 0, unit: i.unit || '' };
        map[key].qty += Number(i.qty) || 0;
        map[key].total += (Number(i.qty)||0) * (Number(i.price)||0);
      });
    });
    const rows = Object.entries(map).sort((a,b) => b[1].total - a[1].total);
    if (!rows.length) return '<div class="bk-empty">Tidak ada data pada periode ini.</div>';
    return rows.map(([name, r]) => `
      <div class="bk-list-row">
        <div class="bk-list-left"><div class="nm">${escapeAttr(name)}</div><div class="sub">${r.qty.toLocaleString('id-ID')} ${escapeAttr(r.unit || '')}</div></div>
        <div class="bk-list-amt">${rupiah(r.total)}</div>
      </div>
    `).join('');
  }

    const pdfBtn = document.getElementById('bk-lr-pdf-btn');
