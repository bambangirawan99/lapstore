<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
}
body {
  background: linear-gradient(160deg, #060A12 0%, #0F1B33 30%, #1B2A4A 55%, #26406B 78%, #35588C 100%);
  background-attachment: fixed;
  padding: 32px 20px;
}
#bk-root {
  --paper: #F6F9FC;
  --bg-page: #F5F8FA;
  --ink: #1F2937;
  --ink-soft: #6B7280;
  --line: #DDE4EC;
  --money-in: #2F6F4E;
  --money-in-bg: #E6F1EC;
  --money-out: #A6423A;
  --money-out-bg: #F5E9E7;
  --accent: #1B2A4A;
  --accent-ink: #0F1B33;
  --accent-bg: #E9EDF3;
  --accent2: #B08D57;
  --accent2-ink: #6B4F24;
  --accent2-bg: #F3EAD9;
  --accent3: #3F6B77;
  --accent3-ink: #1F3A40;
  --accent3-bg: #E4EEEF;
  --navy-900: #0A0F1C;
  --navy-800: #0F1B33;
  --navy-700: #152544;
  --navy-600: #1B2A4A;
  --navy-500: #26406B;
  --navy-400: #35588C;
  --navy-300: #5580AC;
  --navy-200: #8BAFC9;
  --navy-100: #C3DCE9;
  --navy-50: #EAF4F8;
  --navy-grad: linear-gradient(90deg, var(--navy-900) 0%, var(--navy-700) 25%, var(--navy-500) 50%, var(--navy-300) 75%, var(--navy-100) 100%);
  --navy-grad-diag: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-600) 55%, var(--navy-400) 100%);
  --navy-grad-btn: linear-gradient(135deg, var(--navy-700), var(--navy-500));
  --gold-grad-btn: linear-gradient(135deg, #C7A46C, #9C7A48);
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  background: var(--bg-page);
  border-radius: 12px;
  padding: 0;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
  border: 1px solid var(--line);
  overflow: hidden;
}
#bk-root * { box-sizing: border-box; }
#bk-root .disp { font-family: 'Playfair Display', serif; }
#bk-root .mono { font-family: 'IBM Plex Mono', monospace; }

/* Header */
#bk-root .bk-header {
  background: var(--navy-grad-diag);
  color: #fff;
  padding: 20px 28px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: relative;
}
#bk-root .bk-header::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
  background: var(--navy-grad);
}
#bk-root .bk-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
#bk-root .bk-logo-mark {
  width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.28), rgba(255,255,255,.08));
  border: 1px solid rgba(212,175,110,.5);
  display: flex; align-items: center; justify-content: center;
  color: #F0CB78;
  filter: drop-shadow(0 0 4px rgba(240,203,120,.5));
}
#bk-root .bk-header-titlewrap { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 1px; }
#bk-root .bk-header input {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 22px;
  background: linear-gradient(100deg, #8A6A3C 0%, #E9C577 22%, #FFF3D0 45%, #E9C577 68%, #8A6A3C 100%);
  background-size: 220% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  caret-color: #F5D98A;
  animation: bkGoldShine 5s linear infinite;
  border: none;
  outline: none;
  padding: 2px 0;
  border-bottom: 1px dashed transparent;
  max-width: 100%;
  min-width: 0;
  width: 100%;
}
@keyframes bkGoldShine {
  0% { background-position: 220% 0; }
  100% { background-position: -60% 0; }
}
@keyframes bk-spin {
  to { transform: rotate(360deg); }
}
#bk-root .bk-header-tagline {
  font-size: 10.5px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
  color: #E9C577; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#bk-root .bk-header input:focus { border-bottom: 1px dashed rgba(233,197,119,.6); }
#bk-root .bk-header .bk-date {
  font-size: 11px; font-weight: 700; color: var(--navy-800);
  font-family: 'IBM Plex Mono', monospace;
  background: linear-gradient(135deg, #FFE8A8, var(--accent2));
  padding: 5px 11px;
  border-radius: 6px;
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(0,0,0,.18);
}
#bk-root #bk-refresh-btn {
  transition: transform .4s ease, background .15s ease;
  color: rgba(255,255,255,.9) !important;
  width: 30px; height: 30px; border-radius: 999px;
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.28);
  display: flex; align-items: center; justify-content: center;
}
#bk-root #bk-refresh-btn:hover { background: rgba(255,255,255,.26); }
#bk-root .bk-shared-banner {
  background: var(--accent2-bg); color: var(--accent2-ink); font-size: 11.5px; font-weight: 500;
  padding: 7px 28px; border-bottom: 1px solid var(--line); line-height: 1.5;
}

/* Tabs */
#bk-root .bk-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 10px 20px;
}
#bk-root .bk-tab {
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 999px;
  user-select: none;
  transition: color .15s ease, background .15s ease, box-shadow .15s ease;
}
#bk-root .bk-tab.active { background: var(--navy-grad-btn); color: #fff; box-shadow: 0 3px 10px rgba(27,42,74,.35); }
#bk-root .bk-tab:hover:not(.active) { background: var(--accent-bg); color: var(--accent-ink); }

#bk-root .bk-body { padding: 24px 28px 30px; background: var(--paper); min-height: 320px; }

/* Dashboard */
#bk-root .bk-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 12px; margin-bottom: 22px; }
#bk-root .bk-stat { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px; background: var(--paper); min-width: 0; }
#bk-root .bk-stat::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--navy-grad); }
#bk-root .bk-stat.in::before { background: linear-gradient(90deg, var(--money-in), #6FAE8D); }
#bk-root .bk-stat.out::before { background: linear-gradient(90deg, var(--money-out), #D4837A); }
#bk-root .bk-stat .lbl { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; font-weight: 600; overflow-wrap: break-word; }
#bk-root .bk-stat .val { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; word-break: break-word; }
#bk-root .bk-stat.in .val { color: var(--money-in); }
#bk-root .bk-stat.out .val { color: var(--money-out); }

#bk-root .bk-ai-box { border: 1px solid var(--accent3); background: var(--accent3-bg); border-radius: 10px; padding: 16px 18px; margin-bottom: 22px; position: relative; overflow: hidden; }
#bk-root .bk-ai-box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent3), var(--navy-300), var(--accent2)); }
#bk-root .bk-ai-box .ai-head { display:flex; align-items:center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
#bk-root .bk-ai-box .ai-title { font-size: 13px; font-weight: 700; color: var(--accent3-ink); }
#bk-root .bk-ai-box .ai-body { font-size: 13.5px; color: var(--ink); line-height: 1.6; white-space: pre-wrap; max-width: 780px; }
#bk-root .bk-ai-box .ai-body ul { margin: 6px 0 0 18px; padding: 0; }

#bk-root .bk-section-title { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 18px; margin: 0 0 12px; color: var(--ink); }

#bk-root .bk-list-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; gap: 10px;
}
#bk-root .bk-list-row:last-child { border-bottom: none; }
#bk-root .bk-list-left { display:flex; flex-direction:column; gap: 2px; min-width: 0; }
#bk-root .bk-list-left .nm { font-weight: 600; }
#bk-root .bk-list-left .sub { font-size: 11.5px; color: var(--ink-soft); }
#bk-root .bk-list-amt { font-family: 'IBM Plex Mono', monospace; font-weight: 600; white-space: nowrap; }
#bk-root .bk-list-amt.in { color: var(--money-in); }
#bk-root .bk-list-amt.out { color: var(--money-out); }
#bk-root .bk-empty { color: var(--ink-soft); font-size: 13px; padding: 18px 0; text-align: center; }

/* Forms */
#bk-root .bk-quickai { display: flex; gap: 8px; margin-bottom: 18px; }
#bk-root .bk-quickai input {
  flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13.5px;
  font-family: 'Inter', sans-serif; background: #fff;
}
#bk-root .bk-quickai input:focus { outline: none; border-color: var(--navy-400); box-shadow: 0 0 0 3px var(--navy-50); }
#bk-root .bk-btn {
  border: none; border-radius: 999px; padding: 10px 18px; font-size: 13.5px; font-weight: 700;
  cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap;
  transition: transform .12s ease, box-shadow .15s ease, filter .15s ease;
}
#bk-root .bk-btn.primary { background: var(--navy-grad-btn); color: #fff; box-shadow: 0 3px 10px rgba(27,42,74,.3); }
#bk-root .bk-btn.primary:hover { filter: brightness(1.1); }
#bk-root .bk-btn.accent { background: var(--gold-grad-btn); color: #fff; box-shadow: 0 3px 10px rgba(155,120,60,.3); }
#bk-root .bk-btn.accent:hover { filter: brightness(1.08); }
#bk-root .bk-btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
#bk-root .bk-btn.ghost:hover { border-color: var(--navy-500); color: var(--accent-ink); }
#bk-root .bk-btn:active { transform: translateY(1px); filter: brightness(.97); }
#bk-root .bk-btn:disabled { opacity: .5; cursor: default; transform: none; filter: none; }

#bk-root .bk-item-row { display: grid; grid-template-columns: 260px 1fr 65px 85px 105px 30px; gap: 8px; margin-bottom: 8px; align-items: center; }
#bk-root .bk-item-row input {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; font-size: 13px; font-family: 'Inter', sans-serif;
}
#bk-root .bk-item-row input:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent2-bg); }
#bk-root .bk-item-row .rm { cursor: pointer; color: var(--money-out); text-align: center; font-size: 16px; user-select: none; }
#bk-root .bk-numbered-row-wrap { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
#bk-root .bk-row-no { flex-shrink: 0; width: 26px; padding-top: 8px; text-align: right; font-size: 15px; font-weight: 700; color: var(--ink); font-family: 'IBM Plex Mono', monospace; }
#bk-root .bk-numbered-row-wrap > .bk-item-row,
#bk-root .bk-numbered-row-wrap > .bk-svc-part-row { flex: 1; min-width: 0; margin-bottom: 0; }
#bk-root .bk-item-head { display: grid; grid-template-columns: 260px 1fr 65px 85px 105px 30px; gap: 8px; font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; font-weight: 700; }

#bk-root .bk-prod-item-row { display: grid; grid-template-columns: 1fr 90px 90px 30px; gap: 8px; margin-bottom: 8px; align-items: center; }
#bk-root .bk-svc-part-row { display: grid; grid-template-columns: 80px 1fr 80px 80px 30px; gap: 8px; margin-bottom: 8px; align-items: center; }
#bk-root .bk-svc-part-row input {
  border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 9px; font-size: 13px; font-family: 'Inter', sans-serif;
}
#bk-root .bk-svc-part-row input:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent2-bg); }
#bk-root .bk-svc-part-row .rm { cursor: pointer; color: var(--money-out); text-align: center; font-size: 16px; user-select: none; }
#bk-root .bk-svc-part-head { display: grid; grid-template-columns: 80px 1fr 80px 80px 30px; gap: 8px; font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; font-weight: 700; }
#bk-root .bk-prod-item-row input {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; font-size: 13px; font-family: 'Inter', sans-serif;
}
#bk-root .bk-prod-item-row input:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent2-bg); }
#bk-root .bk-prod-item-row .rm { cursor: pointer; color: var(--money-out); text-align: center; font-size: 16px; user-select: none; }
#bk-root .bk-prod-item-head { display: grid; grid-template-columns: 1fr 90px 90px 30px; gap: 8px; font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; font-weight: 700; }

#bk-root .bk-field { margin-bottom: 14px; }
#bk-root .bk-field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 5px; font-weight: 600; }
#bk-root .bk-field input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-family: 'Inter', sans-serif; }
#bk-root .bk-field input:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent2-bg); }
#bk-root .bk-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

#bk-root .bk-total-line { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 18px; padding-top: 12px; border-top: 1px solid var(--line); }
#bk-root .bk-total-line .t-lbl { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
#bk-root .bk-total-line .t-val { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 700; color: var(--accent-ink); }
#bk-root .bk-err { color: var(--money-out); font-size: 12px; margin-top: -8px; margin-bottom: 12px; font-weight: 600; }
#bk-root .bk-msg { font-size: 12px; color: var(--ink-soft); margin-left: 4px; }

/* Riwayat filter */
#bk-root .bk-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
#bk-root .bk-chip { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink-soft); background: #fff; }
#bk-root .bk-chip.active { background: var(--navy-grad-btn); color: #fff; border-color: transparent; box-shadow: 0 2px 8px rgba(27,42,74,.3); }

/* Row actions + badges */
#bk-root .bk-badge { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; display: inline-block; }
#bk-root .bk-badge.lunas { background: var(--money-in-bg); color: var(--money-in); }
#bk-root .bk-badge.belum { background: var(--money-out-bg); color: var(--money-out); }
#bk-root .bk-row-actions { display: flex; gap: 4px; flex-shrink: 0; }
#bk-root .bk-icon-btn {
  border: 1px solid var(--line); background: #fff; border-radius: 8px; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; color: var(--ink-soft);
  transition: border-color .15s ease, color .15s ease;
}
#bk-root .bk-icon-btn:hover { color: var(--accent-ink); border-color: var(--accent); }
#bk-root .bk-icon-btn.danger:hover { color: var(--money-out); border-color: var(--money-out); }
#bk-root .bk-list-row-wrap { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
#bk-root .bk-list-row-wrap:last-child { border-bottom: none; }
#bk-root .bk-list-row-wrap .bk-list-row { flex: 1; padding: 0; border-bottom: none; }
#bk-root .bk-row-check { width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
#bk-root .bk-select-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
#bk-root .bk-select-all { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); cursor: pointer; user-select: none; font-weight: 600; }
#bk-root .bk-select-all input { width: 16px; height: 16px; cursor: pointer; }
#bk-root .bk-bulk-del { display: none; background: linear-gradient(135deg, #C0554B, var(--money-out)); color: #fff; box-shadow: 0 3px 10px rgba(166,66,58,.3); }
#bk-root .bk-bulk-del.show { display: inline-flex; }
#bk-root .bk-checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; }
#bk-root .bk-checkbox-row input { width: 16px; height: 16px; }
#bk-root .bk-cancel-edit { margin-bottom: 14px; font-size: 12px; color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: underline; }

/* Stok */
#bk-root .bk-stok-row {
  display: grid; grid-template-columns: 1fr 90px 100px; gap: 10px; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px;
}
#bk-root .bk-stok-row:last-child { border-bottom: none; }
#bk-root .bk-stok-row .qty { font-family: 'IBM Plex Mono', monospace; font-weight: 600; text-align: right; }
#bk-root .bk-stok-row.low .qty { color: var(--money-out); }
#bk-root .bk-stok-note { font-size: 12px; color: var(--ink-soft); margin-bottom: 16px; max-width: 900px; }

/* Piutang */
#bk-root .bk-piutang-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
#bk-root .bk-piutang-row:last-child { border-bottom: none; }
#bk-root .bk-piutang-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
#bk-root .bk-piutang-actions { display: flex; gap: 8px; }

/* Receipt modal */
#bk-root .bk-overlay {
  position: fixed; inset: 0; background: rgba(15,27,51,.5); display: flex; align-items: center; justify-content: center;
  z-index: 999; padding: 24px;
}
#bk-root .bk-receipt {
  width: 300px; background: var(--paper); padding: 26px 20px 4px;
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink);
  box-shadow: 0 12px 28px rgba(15,27,51,.22);
  border-radius: 10px 10px 0 0;
  position: relative;
  overflow: hidden;
}
#bk-root .bk-receipt::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px;
  background: var(--navy-grad);
}
#bk-root .bk-receipt .r-store { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 17px; text-align: center; color: var(--accent-ink); }
#bk-root .bk-receipt .r-sub { text-align: center; color: var(--ink-soft); font-size: 10.5px; margin-top: 2px; }
#bk-root .bk-receipt hr { border: none; border-top: 1px dashed var(--line); margin: 12px 0; }
#bk-root .bk-receipt .r-item { margin-bottom: 6px; }
#bk-root .bk-receipt .r-item-top { display: flex; justify-content: space-between; }
#bk-root .bk-receipt .r-item-sub { color: var(--ink-soft); font-size: 10.5px; margin-top: 1px; }
#bk-root .bk-receipt .r-item .qn { color: var(--ink-soft); font-size: 11px; }
#bk-root .bk-receipt .r-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; margin-top: 6px; color: var(--accent-ink); }
#bk-root .bk-receipt .r-note { text-align: center; font-size: 10.5px; color: var(--ink-soft); margin-top: 10px; }
#bk-root .zigzag {
  height: 12px;
  background:
    linear-gradient(135deg, var(--bg-page) 50%, transparent 50%) 0 0/16px 12px repeat-x,
    linear-gradient(-135deg, var(--bg-page) 50%, transparent 50%) 0 0/16px 12px repeat-x;
}
#bk-root .bk-receipt-actions { width: 300px; display: flex; gap: 8px; margin-top: 14px; }
#bk-root .bk-receipt-actions .bk-btn { flex: 1; }
#bk-root .bk-close-x { position: absolute; top: 14px; right: 14px; cursor: pointer; color: #fff; font-size: 22px; line-height: 1; }
#bk-root .bk-receipt-wrap { position: relative; display:flex; flex-direction: column; align-items: center; }

/* Service Laptop */
#bk-root .bk-service-status-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
#bk-root .bk-svc-card { border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; background:#fff; }
#bk-root .bk-svc-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }

<script>
// ====== KONFIGURASI SUPABASE (WAJIB DIISI SEBELUM DEPLOY) ======
// Ambil dari Supabase Dashboard > Project Settings > API
const SUPABASE_URL = 'https://gdhtrwisuiaqpekieqvx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkaHRyd2lzdWlhcXBla2llcXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTAxNjQsImV4cCI6MjEwMjg2NjE2NH0.VGTFpLmcfwbegGCIooYnQ1SWVKfVooXbMXTTbWIS8-c';

// ====== KONFIGURASI FITUR AI (OPSIONAL) ======
// Kosongkan jika tidak memakai fitur AI (Isi otomatis & Analisis AI).
// Isi dengan URL Supabase Edge Function proxy (lihat README.md), JANGAN pernah
// menaruh API key Anthropic langsung di sini karena file ini bersifat publik.
const AI_PROXY_URL = '';

const SUPABASE_CONFIGURED = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith('GANTI_');

let sbClient = null;
if (SUPABASE_CONFIGURED) {
  sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

// Shim agar seluruh kode aplikasi (yang aslinya ditulis untuk window.storage milik Claude)
// tetap jalan tanpa perlu diubah, cukup dialihkan ke tabel kv_store di Supabase.
window.storage = {
  async get(key) {
    const { data, error } = await sbClient.from('kv_store').select('value').eq('key', key).maybeSingle();
    if (error) throw error;
    if (!data) throw new Error('key not found: ' + key);
    return { key, value: data.value, shared: true };
  },
  async set(key, value) {
    // PENTING: sama seperti delete() di bawah - Supabase bisa mengembalikan "tidak ada error"
    // walau baris SEBENARNYA tidak tersimpan (misal diam-diam diblokir kebijakan akses/RLS,
    // atau sesi login sempat kedaluwarsa saat itu). Kalau kita cuma percaya absennya error,
    // data yang "berhasil disimpan" bisa hilang begitu dimuat ulang dari server - ini
    // penyebab kasus migrasi/transaksi yang terlihat sukses tapi tidak masuk ke laporan.
    // Sekarang kita minta baris yang benar-benar tersimpan dikembalikan (.select()), lalu
    // verifikasi ulang kalau kosong.
    const { data, error } = await sbClient.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() }).select('key');
    if (error) throw error;
    if (!data || data.length === 0) {
      const check = await sbClient.from('kv_store').select('key').eq('key', key).maybeSingle();
      if (!check.data) {
        throw new Error('Simpan DITOLAK server (data tidak tersimpan, kemungkinan kebijakan akses/RLS memblokir INSERT/UPDATE, atau sesi login kedaluwarsa). key: ' + key);
      }
    }
    return { key, value, shared: true };
  },
  async delete(key) {
    // PENTING: Supabase bisa mengembalikan "tidak ada error" walau baris SEBENARNYA tidak
    // terhapus (misal diam-diam diblokir kebijakan akses/RLS). Kalau kita cuma percaya
    // absennya error, transaksi yang "sudah dihapus" bisa muncul lagi begitu data dimuat
    // ulang dari server - itu sebabnya sebelumnya Laporan/Riwayat kadang terlihat tidak
    // berubah walau sudah "berhasil" dihapus. Sekarang kita minta baris yang benar-benar
    // terhapus dikembalikan (.select()), lalu verifikasi ulang kalau kosong.
    const { data, error } = await sbClient.from('kv_store').delete().eq('key', key).select('key');
    if (error) throw error;
    if (!data || data.length === 0) {
      const check = await sbClient.from('kv_store').select('key').eq('key', key).maybeSingle();
      if (check.data) {
        throw new Error('Hapus DITOLAK server (data masih ada, kemungkinan kebijakan akses/RLS memblokir DELETE). key: ' + key);
      }
    }
    return { key, deleted: true, shared: true };
  },
  async list(prefix) {
    let q = sbClient.from('kv_store').select('key');
    if (prefix) q = q.like('key', `${prefix}%`);
    const { data, error } = await q;
    if (error) throw error;
    return { keys: (data || []).map(r => r.key), prefix, shared: true };
  },
};
</script>

  // ---------- REKENING TUJUAN PEMBAYARAN ----------

  // Dipanggil setiap kali data transaksi berubah (simpan/hapus) supaya cache Stok & Kode Barang
  // TIDAK PERNAH menampilkan data basi - sebelumnya cache ini cuma kedaluwarsa otomatis tiap 1.5 detik,
  // jadi data yang baru saja diupload/disimpan bisa terlihat "belum tercatat" untuk sesaat.
  function invalidateStockCaches() {

  // Dipakai untuk upload Excel dengan banyak baris (bisa puluhan/ratusan). Kalau SEMUA baris ditembak
  // bersamaan sekaligus ke server, bisa melebihi batas kemampuan server menerima permintaan serentak,
  // sehingga SEBAGIAN diam-diam gagal tersimpan tanpa ketahuan. Fungsi ini memproses per kelompok kecil
  // (default 6 baris sekaligus) secara berurutan, dan MENCATAT baris mana saja yang benar-benar gagal
  // (bukan cuma percaya begitu saja kalau prosesnya "selesai").
  async function runJobsInChunks(jobFns, onProgress, chunkSize = 3, delayMs = 250) {
    const results = [];
    for (let i = 0; i < jobFns.length; i += chunkSize) {
      const chunk = jobFns.slice(i, i + chunkSize);
      const chunkResults = await Promise.allSettled(chunk.map(fn => fn()));
      results.push(...chunkResults);
      if (onProgress) onProgress(Math.min(i + chunkSize, jobFns.length), jobFns.length);
      if (i + chunkSize < jobFns.length && delayMs) await new Promise(res => setTimeout(res, delayMs));
    }
    return results;
  }

  async function callClaudeAI(prompt) {
    if (!AI_PROXY_URL) {
      const err = new Error('AI_PROXY_NOT_CONFIGURED');
      err.friendly = 'Fitur AI belum diatur. Lihat README.md bagian "Mengaktifkan fitur AI" untuk memasang proxy amannya.';
      throw err;
    }
    const res = await fetch(AI_PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) throw new Error('AI proxy error: ' + res.status);
    const data = await res.json();
    return (data.content || []).map(c => c.text || '').join('\n').trim();
  }

  async function runAiInsight() {
    const btn = document.getElementById('bk-ai-btn');
    const out = document.getElementById('bk-ai-out');
    btn.disabled = true; btn.textContent = 'Menganalisis...';
    out.textContent = 'Sedang menganalisis transaksi...';
    try {
      const t = totals();
      const last = txns.slice(0, 15).map(x => {
        if (x.type === 'produksi') return `produksi | ${summarizeProduksi(x).replace(/&rarr;/, '->')}`;
        return `${x.type} | ${x.items.map(i=>i.name+' x'+i.qty).join(', ')} | total ${x.total}`;
      }).join('\n');
      const prompt = `Data keuangan UMKM:\nTotal pemasukan: ${t.masuk}\nTotal pengeluaran: ${t.keluar}\nSaldo: ${t.saldo}\n15 transaksi terakhir:\n${last || '(belum ada transaksi)'}\n\nBerikan maksimal 3 poin analisis singkat dan actionable dalam Bahasa Indonesia (bahan baku yang sering dibeli, produk yang laku, atau saran arus kas). Setiap poin maksimal 1 kalimat. Jangan pakai markdown, cukup teks biasa dengan baris baru per poin, awali tiap poin dengan tanda "-".`;
      const text = await callClaudeAI(prompt);
      out.textContent = text || 'Belum cukup data untuk dianalisis.';
    } catch (e) {
      out.textContent = e.friendly || 'Gagal memuat analisis. Coba lagi.';
      console.error(e);
    } finally {
      btn.disabled = false; btn.textContent = 'Buat analisis';
    }
  }

      const scanInput = document.getElementById('bk-barcode-scan');
      if (scanInput) {
        scanInput.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const serial = scanInput.value.trim();
          if (!serial) return;
          const serialReg = getItemSerialRegistry();
          const match = serialReg[serial.toLowerCase()];
          // Kalau baris kosong terakhir masih benar-benar kosong, pakai baris itu; kalau tidak, tambah baris baru
          let target = st.items.find(i => !i.name && !i.code && !i.serial);
          if (!target) { target = blankItem(); st.items.push(target); }
          target.serial = serial;
          if (match) {
            target.name = match.name;
            target.unit = match.unit || 'pcs';
            target.code = match.code || '';
            if (match.price) target.price = match.price;
            target.codeManuallySet = true; // kode dari histori scan, jangan ditimpa deteksi kata kunci

            showToast('Barcode baru dicatat. Isi nama barangnya, kategori akan terdeteksi otomatis.');
          }
          scanInput.value = '';
          renderForm(type);
          setTimeout(() => {
            const freshScan = document.getElementById('bk-barcode-scan');
            if (freshScan) freshScan.focus();
          }, 30);
        });
      }
    }

    document.getElementById('bk-add-item').addEventListener('click', () => {
      st.items.push(blankItem());
      renderForm(type);
    });

    document.getElementById('bk-items').querySelectorAll('.bk-item-row').forEach(row => {

          applyItemCodeLookup(item, type);
        });
        codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyItemCodeLookup(item, type); } });
      }

          if (found) { renderForm(type); showToast(`Kode otomatis terisi: ${item.code}`); }
        } else if (type === 'pembelian' && !item.codeManuallySet) {
          const prefix = detectKategoriFromName(item.name);
          const currentPrefix = (item.code || '').split('-')[0];
          if (item.name.trim() && currentPrefix !== prefix) {
            item.code = generateItemCodeSequence(prefix, 1)[0];
            const selectEl = row.querySelector('.f-code');
            if (selectEl) {
              selectEl.innerHTML = `<option value="">-- manual --</option>${itemCodeDropdownOptionsHtml(item.code)}`;
              selectEl.value = item.code;
            }
          }
        }
      });
      row.querySelector('.f-qty').addEventListener('input', e => { item.qty = e.target.value; refreshTotal(type); });
      row.querySelector('.f-unit') && row.querySelector('.f-unit').addEventListener('input', e => item.unit = e.target.value);
      row.querySelector('.f-price').addEventListener('input', e => { item.price = e.target.value; refreshTotal(type); });
      const rm = row.querySelector('.rm');
      if (rm) rm.addEventListener('click', () => {
        st.items = st.items.filter(i => i.id !== id);
        if (st.items.length === 0) st.items.push(blankItem());
        renderForm(type);
      });
    });

    if (!isEdit) document.getElementById('bk-quick-btn').addEventListener('click', () => runQuickAi(type));
    document.getElementById('bk-save-btn').addEventListener('click', () => saveTransaction(type, true));
    if (!isEdit && isJual) document.getElementById('bk-save-noresi-btn').addEventListener('click', () => saveTransaction(type, false));
    if (!isEdit && isJual) {
      const gotoMigrasiBtn = document.getElementById('bk-penjualan-goto-migrasi');
      if (gotoMigrasiBtn) gotoMigrasiBtn.addEventListener('click', () => {
        activeTab = 'migrasi';
        renderTabs();
        renderBody();
      });
    }
  }

  // ---------- KODE BARANG (barcode) ----------
  let _itemCodeRegistryCache = null;
  let _itemCodeRegistryCacheAt = 0;
  function getItemCodeRegistry() {
    const now = Date.now();
    if (_itemCodeRegistryCache && (now - _itemCodeRegistryCacheAt) < 1500) {
      return _itemCodeRegistryCache;
    }
    const byCode = {};
    const byName = {};
    const byNameFull = {};
    const relevant = [...txns].filter(t => t.type === 'pembelian' || t.type === 'produksi').sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    relevant.forEach(t => {
      const list = t.type === 'pembelian' ? (t.items || []) : (t.hasil || []);
      list.forEach(i => {
        if (i.name && deletedStokNames.has(i.name.trim().toLowerCase())) return; // sudah dibersihkan, jangan didaftarkan lagi
        if (i.code && i.code.trim()) {
          const code = i.code.trim();
          const prevSpec = (byCode[code.toLowerCase()] && byCode[code.toLowerCase()].spec) || '';
          const rec = { name: i.name, unit: i.unit || '', code, spec: (i.spec && i.spec.trim()) || prevSpec || '' };
          byCode[code.toLowerCase()] = rec;
          if (i.name) { byName[i.name.trim().toLowerCase()] = code; byNameFull[i.name.trim().toLowerCase()] = rec; }
        }
      });
    });
    _itemCodeRegistryCache = { byCode, byName, byNameFull };
    _itemCodeRegistryCacheAt = now;
    return _itemCodeRegistryCache;
  }
  function itemCodesDatalistHtml() {
    const reg = getItemCodeRegistry();
    const codes = Object.values(reg.byCode).map(v => v.code);
    return `<datalist id="bk-item-codes">${codes.map(c => `<option value="${escapeAttr(c)}"></option>`).join('')}</datalist>`;
  }
  function applyItemCodeLookup(item, type) {
    const codeVal = (item.code || '').trim();
    if (!codeVal) return;
    const reg = getItemCodeRegistry();
    const match = reg.byCode[codeVal.toLowerCase()];
    if (match) {
      item.name = match.name;
      item.unit = match.unit;
      if (type === 'penjualan') {
        // Harga jual DEFAULT mengikuti apa yang TAMPIL di tab Pricelist untuk barang ini, tapi
        // tetap bisa diubah manual sesudahnya - ini cuma nilai awal, bukan kunci.
        // PENTING: cari baris Stok yang PERSIS SAMA dengan cara tab Pricelist mengidentifikasi
        // barangnya (lewat reg.byName dari nama versi Stok, bukan versi pembelian terakhir),
        // supaya key pricelist yang dibentuk 100% sama dengan yang dipakai tab Pricelist.
        const stockMap = computeStock();
        const stockRow = Object.values(stockMap).find(r => {
          const c = reg.byName[r.name.trim().toLowerCase()];
          return c && c.toLowerCase() === codeVal.toLowerCase();
        });
        const nameForKey = stockRow ? stockRow.name : match.name;
        const rowCode = stockRow ? (reg.byName[stockRow.name.trim().toLowerCase()] || codeVal) : codeVal;
        const itemKey = pricelistKeyFor(rowCode, nameForKey);
        // Jalur cadangan: coba juga key berbasis nama saja (kalau dulu disimpan sebelum barang
        // punya kode) dan key berbasis nama versi pembelian terakhir (kalau beda dari versi Stok).
        const fallbackKey1 = pricelistKeyFor('', nameForKey);
        const fallbackKey2 = pricelistKeyFor(codeVal, match.name);
        const entry = pricelistData[itemKey] || pricelistData[fallbackKey1] || pricelistData[fallbackKey2];
        console.log('[Harga jual lookup]', { codeVal, matchName: match.name, stockRowName: stockRow ? stockRow.name : null, rowCode, itemKey, fallbackKey1, fallbackKey2, found: !!entry, entry, allPricelistKeys: Object.keys(pricelistData) });
        if (entry && entry.hargaJual != null) {
          item.price = entry.hargaJual;
        } else {
          // Belum pernah disimpan eksplisit di Pricelist (baru sekadar angka default yang
          // tampil di layar, belum ditekan/diubah user) - pakai rumus yang PERSIS SAMA dengan
          // yang dihitung & ditampilkan di tab Pricelist: HPP saat ini + markup% (0% kalau belum diatur).
          const hppNow = computeHPP();
          const unitCost = hppNow.getCurrentUnitCost(nameForKey);
          if (unitCost > 0) {
            item.price = Math.round(unitCost / 100) * 100;
          }
        }
      }
      renderForm(type);
      showToast(`Kode ditemukan: ${match.name}`);
    }
  }
  // Kebalikan dari applyItemCodeLookup - kalau admin ingat NAMA barang tapi lupa kodenya,
  // ketik/pilih namanya, kode otomatis ikut terisi. Dipakai di kolom sparepart Service.
  function applyItemNameLookup(item) {
    const nameVal = (item.name || '').trim();
    if (!nameVal) return false;
    const reg = getItemCodeRegistry();
    const match = reg.byNameFull[nameVal.toLowerCase()];
    if (match && !item.code) {
      item.code = match.code;
      item.unit = match.unit;
      return true;
    }
    return false;
  }

  // ---------- KODE BARANG OTOMATIS PER KATEGORI (LPSTK = Laptop, LPSRV = Onderdil/Sparepart, LPPRD = Hasil Produksi) ----------
  const ITEM_KATEGORI = [
    { prefix: 'LPSTK', label: 'Laptop' },
    { prefix: 'LPSRV', label: 'Onderdil (Sparepart)' },
  ];
  function nextItemCodeNumber(prefix) {
    let maxNum = 0;
    const re = new RegExp('^' + prefix + '-(\\d+)$', 'i');
    txns.forEach(t => {
      if (t.type === 'pembelian') {
        (t.items || []).forEach(i => {
          const m = (i.code || '').match(re);
          if (m) { const n = parseInt(m[1], 10); if (n > maxNum) maxNum = n; }
        });
      } else if (t.type === 'produksi') {
        (t.hasil || []).forEach(i => {
          const m = (i.code || '').match(re);
          if (m) { const n = parseInt(m[1], 10); if (n > maxNum) maxNum = n; }
        });
      }
    });
    return maxNum + 1;
  }
  function generateItemCodeSequence(prefix, n) {
    const start = nextItemCodeNumber(prefix);
    const result = [];
    for (let i = 0; i < n; i++) result.push(prefix + '-' + String(start + i).padStart(5, '0'));
    return result;
  }
  // Dipakai saat upload banyak baris sekaligus (Excel): nextItemCodeNumber() cuma melihat data yang
  // SUDAH TERSIMPAN, jadi kalau dipanggil berulang untuk tiap baris dalam satu proses upload, semua
  // baris akan dapat kode yang SAMA (karena belum ada yang tersimpan saat baris berikutnya diproses).
  // Fungsi ini membuat "penghitung lokal" yang diingat & dinaikkan sendiri selama proses upload berjalan.
  function makeLocalItemCodeCounter() {
    const counters = {};
    return function nextLocalCode(prefix) {
      if (!(prefix in counters)) counters[prefix] = nextItemCodeNumber(prefix);
      const code = prefix + '-' + String(counters[prefix]).padStart(5, '0');
      counters[prefix]++;
      return code;
    };
  }
  function makeLocalServiceCodeCounter() {
    let counter = nextServiceNumber();
    return function nextLocalServiceCode() {
      const code = SVC_KODE_PREFIX + String(counter).padStart(5, '0');
      counter++;
      return code;
    };
  }
  function itemCodeDropdownOptionsHtml(selectedVal) {
    return ITEM_KATEGORI.map(k => {
      const opts = generateItemCodeSequence(k.prefix, 3);
      return `<optgroup label="${escapeAttr(k.label)} (${k.prefix})">
        ${opts.map(c => `<option value="${c}" ${selectedVal===c?'selected':''}>${c}</option>`).join('')}
      </optgroup>`;
    }).join('');
  }

  // Dropdown kode barang untuk form PENJUALAN - HANYA berisi kode yang benar-benar terdaftar
  // di Stok (dari riwayat pembelian/produksi) dan masih ada sisanya, TIDAK BISA diketik manual.
  // Ini memastikan data penjualan selalu match dengan barang yang benar-benar ada di Stok,
  // mencegah salah ketik nama/kode yang bikin data penjualan & stok tidak sinkron.
  function stockItemCodeDropdownOptionsHtml(selectedVal) {
    const codeReg = getItemCodeRegistry();
    const stockMap = computeStock();
    let rows = Object.values(codeReg.byCode)
      .map(rec => {
        const stok = stockMap[rec.name.trim().toLowerCase()];
        const qty = stok ? stok.qty : 0;
        return { ...rec, qty };
      })
      .filter(r => !deletedStokNames.has(r.name.trim().toLowerCase()));
    // Barang dengan sisa stok > 0 boleh dipilih untuk penjualan baru. Barang yang kebetulan
    // sedang jadi kode terpilih saat ini (misal lagi edit transaksi lama, stoknya sudah habis
    // sekarang) tetap ditampilkan supaya tidak hilang dari tampilan, ditandai "stok habis".
    rows = rows.filter(r => r.qty > 0 || r.code === selectedVal);
    if (!rows.length) return '<option value="">-- belum ada stok tersedia --</option>';
    rows.sort((a,b) => a.name.localeCompare(b.name, 'id', { sensitivity: 'base' }));
    const laptopRows = rows.filter(r => /^LPSTK/i.test(r.code));
    const onderdilRows = rows.filter(r => !/^LPSTK/i.test(r.code));
    const optHtml = (list) => list.map(r => `<option value="${escapeAttr(r.code)}" ${selectedVal===r.code?'selected':''}>${escapeAttr(r.code)} - ${escapeAttr(r.name)} (${r.qty > 0 ? 'sisa '+r.qty.toLocaleString('id-ID') : 'stok habis'})</option>`).join('');
    let html = `<option value="">-- pilih kode barang dari Stok --</option>`;
    if (laptopRows.length) html += `<optgroup label="Stock Laptop">${optHtml(laptopRows)}</optgroup>`;
    if (onderdilRows.length) html += `<optgroup label="Stock Onderdil">${optHtml(onderdilRows)}</optgroup>`;
    return html;
  }

  // Deteksi kategori dari kata kunci di nama barang (dipakai untuk auto-arahkan dropdown kode
  // saat scan barcode/ketik nama), tapi hasilnya tetap bisa diubah manual oleh pengguna.
  const LAPTOP_KEYWORDS = ['laptop', 'notebook', 'macbook', 'asus', 'lenovo', 'thinkpad', 'acer', 'hp ', 'hp-', 'dell', 'msi', 'axioo', 'toshiba', 'fujitsu', 'huawei', 'gigabyte', 'razer', 'chromebook', 'zenbook', 'ideapad', 'aspire', 'pavilion', 'vivobook'];
  function detectKategoriFromName(name) {
    const n = (' ' + (name || '').toLowerCase() + ' ');
    return LAPTOP_KEYWORDS.some(k => n.includes(k)) ? 'LPSTK' : 'LPSRV';
  }
  // Registry nomor seri/barcode hasil scan -> data barang, dibangun dari riwayat pembelian
  // supaya kalau barcode yang sama pernah discan sebelumnya, nama & kode langsung dikenali.
  function getItemSerialRegistry() {
    const bySerial = {};
    [...txns].filter(t => t.type === 'pembelian').sort((a,b) => (a.createdAt||0) - (b.createdAt||0)).forEach(t => {
      (t.items || []).forEach(i => {
        if (i.serial && i.serial.trim()) {
          bySerial[i.serial.trim().toLowerCase()] = { name: i.name, unit: i.unit || '', code: i.code || '', price: i.price };
        }
      });
    });
    return bySerial;
  }

  function getKnownItemNames() {
    const set = new Set();
    txns.forEach(t => {
      if (t.type === 'pembelian' || t.type === 'penjualan') {
        (t.items || []).forEach(i => { if (i.name) set.add(i.name.trim()); });
      } else if (t.type === 'produksi') {
        (t.bahan || []).forEach(i => { if (i.name) set.add(i.name.trim()); });
        (t.hasil || []).forEach(i => { if (i.name) set.add(i.name.trim()); });
      }
    });
    return Array.from(set).filter(n => !deletedStokNames.has(n.trim().toLowerCase())).sort();
  }
  function itemNamesDatalistHtml() {
    return `<datalist id="bk-item-names">${getKnownItemNames().map(n => `<option value="${escapeAttr(n)}"></option>`).join('')}</datalist>`;
  }

  function itemRowHtml(item, type, idx) {
    const isJual = type === 'penjualan';
    const codeField = type === 'pembelian'
      ? `<select class="f-code" style="width:100%; max-width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:8px; padding:8px 9px; font-size:12px; font-family:'IBM Plex Mono',monospace; background:#fff;">
          <option value="">-- manual --</option>
          ${itemCodeDropdownOptionsHtml(item.code)}
        </select>`
      : isJual
        ? `<select class="f-code" style="width:100%; max-width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:8px; padding:8px 9px; font-size:11.5px; font-family:'IBM Plex Mono',monospace; background:#fff;">
            ${stockItemCodeDropdownOptionsHtml(item.code)}
          </select>`
        : `<input class="f-code" value="${escapeAttr(item.code||'')}" placeholder="Kode" list="bk-item-codes" />`;
    const nameField = isJual
      ? `<input class="f-name" value="${escapeAttr(item.name)}" placeholder="Pilih kode dulu" readonly style="background:var(--bg-page); color:var(--ink-soft); cursor:not-allowed;" />`
      : `<input class="f-name" value="${escapeAttr(item.name)}" placeholder="Nama item" list="bk-item-names" />`;
    return `<div class="bk-numbered-row-wrap">
      <div class="bk-row-no">${idx + 1}.</div>
      <div class="bk-item-row" data-id="${item.id}">
      ${codeField}
      ${nameField}
      <input class="f-qty" type="number" min="0" value="${escapeAttr(item.qty)}" placeholder="0" />
      <input class="f-unit" value="${escapeAttr(item.unit||'')}" placeholder="pcs/kg" ${isJual ? 'readonly style="background:var(--bg-page); color:var(--ink-soft); cursor:not-allowed;"' : ''} />
      <input class="f-price" type="number" min="0" value="${escapeAttr(item.price)}" placeholder="0" />
      <div class="rm" title="Hapus item">&times;</div>
      </div>
    </div>`;
  }

  function refreshTotal(type) {
    const st = formState[type];
    const itemsTotal = st.items.reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);
    const ongkosKirim = type === 'pembelian' ? (Number(st.ongkosKirim) || 0) : 0;
    const tv = bodyEl.querySelector('.t-val');
    if (tv) tv.textContent = rupiah(itemsTotal + ongkosKirim);
  }

  function escapeAttr(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  async function runQuickAi(type) {
    const input = document.getElementById('bk-quick-input');
    const btn = document.getElementById('bk-quick-btn');
    const text = input.value.trim();
    if (!text) { input.placeholder = 'Tulis dulu deskripsi transaksinya...'; input.focus(); return; }
    btn.disabled = true; btn.textContent = 'Memproses...';
    try {
      const schemaNote = type === 'penjualan'
        ? 'Format JSON: [{"name":"nama produk","qty":angka,"price":harga satuan dalam rupiah}]'
        : 'Format JSON: [{"name":"nama bahan","qty":angka,"unit":"satuan seperti kg/pcs/liter","price":harga satuan dalam rupiah}]';
      const prompt = `Ubah teks transaksi berikut menjadi data terstruktur.\nTeks: "${text}"\n${schemaNote}\nBalas HANYA dengan JSON array yang valid, tanpa teks lain, tanpa markdown code fence.`;
      const raw = await callClaudeAI(prompt);
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      if (Array.isArray(parsed) && parsed.length) {
        formState[type].items = parsed.map(p => ({ id: uid(), name: p.name || '', qty: p.qty ?? '', unit: p.unit || '', price: p.price ?? '' }));
        if (type === 'penjualan') {
          // Coba cocokkan otomatis nama hasil AI ke kode barang yang benar-benar ada di Stok,
          // supaya dropdown Kode langsung terisi kalau namanya cukup mirip/sama dengan barang
          // yang tercatat. Kalau tidak ketemu, dibiarkan kosong - user pilih manual dari dropdown.
          const codeReg = getItemCodeRegistry();
          const stockMap = computeStock();
          formState[type].items.forEach(item => {
            const nameKey = (item.name || '').trim().toLowerCase();
            const directMatch = codeReg.byName[nameKey];
            let matchedCode = directMatch || '';
            if (!matchedCode && nameKey) {
              // fallback: cari nama stok yang mengandung/dikandung nama hasil AI
              const found = Object.keys(codeReg.byName).find(k => k.includes(nameKey) || nameKey.includes(k));
              if (found) matchedCode = codeReg.byName[found];
            }
            if (matchedCode) {
              const rec = codeReg.byCode[matchedCode.toLowerCase()];
              const stok = rec ? stockMap[rec.name.trim().toLowerCase()] : null;
              if (rec && stok && stok.qty > 0) {
                item.code = matchedCode;
                item.name = rec.name;
                item.unit = rec.unit;
              }
            }
          });
        }
        input.value = '';
      }
      renderForm(type);
    } catch (e) {
      console.error(e);
      const err = document.getElementById('bk-form-err');
      if (err) { err.style.display = 'block'; err.textContent = e.friendly || 'AI tidak bisa membaca teks itu, coba tulis ulang atau isi manual.'; }
      btn.disabled = false; btn.textContent = 'Isi otomatis (AI)';
    }
  }

  async function saveTransaction(type, withReceipt) {
    const st = formState[type];
    const errEl = document.getElementById('bk-form-err');
    const validItems = st.items.filter(i => i.name && Number(i.qty) > 0 && Number(i.price) >= 0);
    if (validItems.length === 0) {
      errEl.style.display = 'block';
      errEl.textContent = 'Isi minimal satu item dengan nama, jumlah, dan harga yang valid.';
      return;
    }
    errEl.style.display = 'none';
    const isEdit = !!editingTxnId;

    if (type === 'penjualan') {
      const stockMap = isEdit ? computeStockExcluding(editingTxnId) : computeStock();
      const kurang = [];
      validItems.forEach(i => {
        const avail = getAvailableQty(stockMap, i.name);
        if (Number(i.qty) > avail) {
          kurang.push(`${i.name} (stok tersisa ${avail}${i.unit ? ' '+i.unit : ''}, diminta ${i.qty})`);
        }
      });
      if (kurang.length) {
        errEl.style.display = 'block';
        errEl.textContent = `Stok tidak cukup untuk: ${kurang.join('; ')}. Cek tab Stok atau catat pembelian dulu.`;
        return;
      }
    }

    const itemsTotal = validItems.reduce((s,i) => s + Number(i.qty) * Number(i.price), 0);
    const ongkosKirim = type === 'pembelian' ? (Number(st.ongkosKirim) || 0) : 0;
    const total = itemsTotal + ongkosKirim;
    const existing = isEdit ? txns.find(x => x.id === editingTxnId) : null;
    const txn = {
      id: isEdit ? editingTxnId : uid(),
      type,
      kodeTransaksi: isEdit && existing ? existing.kodeTransaksi : generateTxnCode(type),
      items: validItems.map(i => ({ name: i.name, qty: Number(i.qty), unit: i.unit || '', price: Number(i.price), code: (i.code||'').trim(), serial: (i.serial||'').trim(), spec: (i.spec||'').trim() })),
      total,
      ongkosKirim: type === 'pembelian' ? ongkosKirim : undefined,
      customerName: type === 'penjualan' ? st.party : '',
      customerPhone: type === 'penjualan' ? st.phone : '',
      supplierName: type === 'pembelian' ? st.party : '',
      paid: type === 'penjualan' ? (st.paid !== false) : undefined,
      rekening: type === 'penjualan' ? st.rekening : undefined,
      createdAt: isEdit && existing ? existing.createdAt : Date.now(),
      createdBy: isEdit && existing ? existing.createdBy : (currentUser ? currentUser.email : null),
    };
    const clickedBtnId = withReceipt === false ? 'bk-save-noresi-btn' : 'bk-save-btn';
    const saveBtn = document.getElementById(clickedBtnId) || document.getElementById('bk-save-btn');
    const otherBtn = document.getElementById(withReceipt === false ? 'bk-save-btn' : 'bk-save-noresi-btn');
    const originalLabel = saveBtn.textContent;
    saveBtn.disabled = true; saveBtn.textContent = 'Menyimpan...';
    if (otherBtn) otherBtn.disabled = true;
    try {
      await saveTxn(txn);
      if (type === 'pembelian') await autoReviveStokNames(validItems.map(i => i.name));
      if (isEdit) {
        const idx = txns.findIndex(x => x.id === editingTxnId);
        if (idx >= 0) txns[idx] = txn; else txns.unshift(txn);
      } else {
        txns.unshift(txn);
      }
      const wasEdit = isEdit;
      editingTxnId = null;
      formState[type] = type === 'penjualan'
        ? { items: [blankItem()], party: '', phone: '', paid: true, note: '', rekening: BANK_ACCOUNTS[0].id }
        : { items: [blankItem()], party: '', note: '', ongkosKirim: '' };
      clearDraft(type);
      if (wasEdit) {
        activeTab = 'riwayat';
        renderTabs(); renderBody();
      } else if (type === 'penjualan' && withReceipt !== false) {
        showReceipt(txn);
      } else if (type === 'penjualan') {
        activeTab = 'dashboard';
        renderTabs(); renderBody();
        showToast('Penjualan tersimpan tanpa resi.');
      } else {
        activeTab = 'dashboard';
        renderTabs(); renderBody();
      }
    } catch (e) {
      errEl.style.display = 'block';
      errEl.textContent = 'Gagal menyimpan transaksi. Coba lagi.';
      console.error(e);
      saveBtn.disabled = false; saveBtn.textContent = originalLabel;
      if (otherBtn) otherBtn.disabled = false;
    }
  }

  function startEdit(id) {
    const t = txns.find(x => x.id === id);
    if (!t) return;
    editingTxnId = id;
    if (t.type === 'produksi') {
      produksiFormState = {

      ? { items: t.items.map(i => ({ id: uid(), name: i.name, qty: i.qty, unit: i.unit || '', price: i.price, code: i.code || '' })), party: t.customerName || '', phone: t.customerPhone || '', paid: t.paid !== false, note: '', rekening: t.rekening || BANK_ACCOUNTS[0].id }
      : { items: t.items.map(i => ({ id: uid(), name: i.name, qty: i.qty, unit: i.unit || '', price: i.price, code: i.code || '' })), party: t.supplierName || '', note: '', ongkosKirim: t.ongkosKirim || '' };

  async function syncServiceAfterLinkedTxnDeleted(deletedTxnId) {
    const s = findLinkedService(deletedTxnId);
    if (!s) return;
    try {
      if (s.prodTxnId === deletedTxnId) {
        if (s.linkedTxnId) {
          try { await deleteTxnFromStore(s.linkedTxnId); } catch (e) { /* mungkin sudah terhapus */ }
          txns = txns.filter(x => x.id !== s.linkedTxnId);
        }
        s.prodTxnId = null;
        s.linkedTxnId = null;
        s.serviceItemName = null;
        s.status = 'dikerjakan';
        s.updatedAt = Date.now();
        s.history = s.history || [];
        s.history.push({ status: 'dikerjakan (otomatis dikembalikan, catatan sparepart dihapus)', at: Date.now() });
        await saveService(s);
        showToast(`Catatan sparepart untuk service "${s.customerName}" dihapus, status dikembalikan ke "Dikerjakan".`);
      } else if (s.linkedTxnId === deletedTxnId) {
        s.linkedTxnId = null;
        s.status = 'selesai';
        s.updatedAt = Date.now();
        s.history = s.history || [];
        s.history.push({ status: 'selesai (otomatis dikembalikan, transaksi pemasukan dihapus)', at: Date.now() });
        await saveService(s);
        showToast(`Transaksi pemasukan untuk service "${s.customerName}" dihapus, status dikembalikan ke "Selesai".`);
      } else if (s.dpTxnId === deletedTxnId) {
        s.dpAmount = 0;
        s.dpTxnId = null;
        s.updatedAt = Date.now();
        s.history = s.history || [];
        s.history.push({ status: 'DP dibatalkan otomatis (transaksi DP dihapus dari Riwayat)', at: Date.now() });
        await saveService(s);
        showToast(`Catatan DP untuk service "${s.customerName}" dihapus dari Riwayat.`);
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function removeTxn(id) {
    if (!requireOwnerForDelete()) return;
    const t = txns.find(x => x.id === id);
    if (!t) return;
    const linkedSvc = findLinkedService(id);
    const pairTxn = t.pairTxnId ? txns.find(x => x.id === t.pairTxnId) : null;
    let confirmMsg;
    if (linkedSvc) {
      confirmMsg = `Transaksi ini terhubung dengan data Service Laptop atas nama "${linkedSvc.customerName}" (${linkedSvc.device}). Menghapusnya akan mengembalikan status service tersebut secara otomatis. Lanjutkan hapus?`;
    } else if (pairTxn) {
      const pairLabel = pairTxn.type === 'pembelian' ? 'Pembelian' : 'Penjualan';
      confirmMsg = `Transaksi ini adalah pasangan hasil migrasi (Penjualan &harr; Pembelian dibuat bersamaan supaya laba rugi balance). Menghapusnya akan otomatis ikut menghapus transaksi ${pairLabel} pasangannya (${rupiah(pairTxn.total)}, ${new Date(pairTxn.createdAt).toLocaleDateString('id-ID')}). Lanjutkan hapus keduanya?`;
    } else {
      confirmMsg = 'Hapus transaksi ini? Tindakan ini tidak bisa dibatalkan.';
    }
    showConfirm(confirmMsg, async () => {
      showLoadingModal(pairTxn ? 'Menghapus transaksi & pasangannya...' : 'Menghapus transaksi...');
      try {
        await logToTrash('txn', trashLabelForTxn(t), t);
        if (pairTxn) await logToTrash('txn', trashLabelForTxn(pairTxn), pairTxn);
        trashEntriesCache = null;
        await deleteTxnFromStore(id);
        txns = txns.filter(x => x.id !== id);
        if (pairTxn) {
          try { await deleteTxnFromStore(pairTxn.id); } catch (e) { /* mungkin sudah terhapus */ }
          txns = txns.filter(x => x.id !== pairTxn.id);
        }
        await syncServiceAfterLinkedTxnDeleted(id);
        closeLoadingModal();
        renderBody();
        if (!linkedSvc) showToast(pairTxn ? 'Transaksi & pasangannya berhasil dihapus.' : 'Transaksi berhasil dihapus.');
      } catch (e) {
        console.error(e);
        closeLoadingModal();
        showToast('Gagal menghapus transaksi, coba lagi.');
      }
    });
  }
  function trashLabelForTxn(t) {
    const namePart = t.type === 'produksi' ? summarizeProduksi(t).replace(/&rarr;/, '->').replace(/<[^>]+>/g, '')
      : (t.items && t.items[0] ? t.items[0].name : '');
    const who = t.type === 'penjualan' ? (t.customerName || '') : t.type === 'pembelian' ? (t.supplierName || '') : '';
    const typeLabel = t.type === 'penjualan' ? 'Penjualan' : t.type === 'pembelian' ? 'Pembelian' : 'Produksi';
    return `${typeLabel}${who ? ' - '+who : ''}${namePart ? ' ('+namePart+')' : ''} - ${rupiah(t.total || 0)}`;
  }

  function receiptText(t, storeName) {

  // ---------- STOK ----------
  let _computeStockCache = null;
  let _computeStockCacheAt = 0;
  function computeStock() {
    const now = Date.now();
    if (_computeStockCache && (now - _computeStockCacheAt) < 1500) {
      return _computeStockCache;
    }
    const stockMap = {};
    function addQty(name, unit, delta) {
      const key = (name || '').trim().toLowerCase();
      if (!key) return;
      if (!stockMap[key]) stockMap[key] = { name: name.trim(), unit: unit || '', qty: 0 };
      stockMap[key].qty += delta;
      if (unit) stockMap[key].unit = unit;
    }
    txns.forEach(t => {
      if (t.type === 'pembelian') {
        t.items.forEach(i => addQty(i.name, i.unit, Number(i.qty) || 0));
      } else if (t.type === 'penjualan') {
        t.items.forEach(i => addQty(i.name, i.unit, -(Number(i.qty) || 0)));
      } else if (t.type === 'produksi') {
        (t.bahan || []).forEach(i => addQty(i.name, i.unit, -(Number(i.qty) || 0)));
        (t.hasil || []).forEach(i => addQty(i.name, i.unit, Number(i.qty) || 0));
      }
    });
    _computeStockCache = stockMap;
    _computeStockCacheAt = now;
    return stockMap;
  }

  // Sama seperti computeStock, tapi mengabaikan satu transaksi tertentu (dipakai saat validasi stok pada mode edit,
  // supaya kuantitas transaksi yang sedang diedit itu sendiri tidak ikut menghalangi/menghitung dobel).
  function computeStockExcluding(txnId) {
    const stockMap = {};
    function addQty(name, unit, delta) {
      const key = (name || '').trim().toLowerCase();
      if (!key) return;
      if (!stockMap[key]) stockMap[key] = { name: name.trim(), unit: unit || '', qty: 0 };
      stockMap[key].qty += delta;
      if (unit) stockMap[key].unit = unit;
    }
    txns.forEach(t => {
      if (t.id === txnId) return;
      if (t.type === 'pembelian') {
        t.items.forEach(i => addQty(i.name, i.unit, Number(i.qty) || 0));
      } else if (t.type === 'penjualan') {
        t.items.forEach(i => addQty(i.name, i.unit, -(Number(i.qty) || 0)));
      } else if (t.type === 'produksi') {
        (t.bahan || []).forEach(i => addQty(i.name, i.unit, -(Number(i.qty) || 0)));
        (t.hasil || []).forEach(i => addQty(i.name, i.unit, Number(i.qty) || 0));
      }
    });
    return stockMap;
  }
  function getAvailableQty(stockMap, name) {
    const key = (name || '').trim().toLowerCase();
    return stockMap[key] ? stockMap[key].qty : 0;
  }

  // ---------- HPP (Harga Pokok Penjualan) via metode rata-rata bergerak ----------
  function computeHPP() {
    const sorted = [...txns].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const avg = {}; // key -> { qty, cost } biaya kumulatif per item
    const keyOf = n => (n || '').trim().toLowerCase();

    function addStock(name, qty, cost) {
      const k = keyOf(name);
      if (!k || qty <= 0) return;
      if (!avg[k]) avg[k] = { name: (name || '').trim(), qty: 0, cost: 0 };
      avg[k].qty += qty;
      avg[k].cost += cost;
    }
    function unitCostOf(name) {
      const k = keyOf(name);
      const r = avg[k];
      return (r && r.qty > 0) ? r.cost / r.qty : 0;
    }
    function removeStock(name, qty) {
      const k = keyOf(name);
      const r = avg[k];
      const uc = unitCostOf(name);
      if (r) {
        r.qty -= qty;
        r.cost -= qty * uc;
        if (r.qty < 0.0000001) { r.qty = 0; r.cost = 0; }
      }
      return uc;
    }

    const hppByTxn = {};
    const prodCostByTxn = {};
    let totalRevenue = 0, totalHPP = 0;

    sorted.forEach(t => {
      if (t.type === 'pembelian') {
        const shipping = Number(t.ongkosKirim) || 0;
        const subtotal = t.items.reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);
        t.items.forEach(i => {
          const qty = Number(i.qty) || 0;
          const itemValue = qty * (Number(i.price) || 0);
          const allocShipping = shipping > 0 ? (subtotal > 0 ? shipping * (itemValue / subtotal) : shipping / t.items.length) : 0;
          addStock(i.name, qty, itemValue + allocShipping);
        });
      } else if (t.type === 'produksi') {
        let batchCost = 0;
        (t.bahan || []).forEach(i => {
          const qty = Number(i.qty) || 0;
          batchCost += qty * removeStock(i.name, qty);
        });
        const totalHasilQty = (t.hasil || []).reduce((s, i) => s + (Number(i.qty) || 0), 0) || 1;
        const hasilDetail = [];
        (t.hasil || []).forEach(i => {
          const qty = Number(i.qty) || 0;
          const allocCost = batchCost * (qty / totalHasilQty);
          addStock(i.name, qty, allocCost);
          hasilDetail.push({ name: i.name, qty, unit: i.unit || '', allocCost, unitCost: qty > 0 ? allocCost / qty : 0 });
        });
        prodCostByTxn[t.id] = { batchCost, hasil: hasilDetail };
      } else if (t.type === 'penjualan') {
        let txnHpp = 0;
        t.items.forEach(i => {
          const qty = Number(i.qty) || 0;
          txnHpp += qty * removeStock(i.name, qty);
        });
        hppByTxn[t.id] = txnHpp;
        totalHPP += txnHpp;
        totalRevenue += t.total;
      }
    });

    return { hppByTxn, prodCostByTxn, totalHPP, totalRevenue, labaKotor: totalRevenue - totalHPP, getCurrentUnitCost: unitCostOf };
  }

  // Sama seperti computeHPP, tapi hanya memproses transaksi sampai tanggal cutoff tertentu.
  // Dipakai untuk menghitung nilai stok pakai HPP "pada saat itu", bukan harga sekarang.
  function computeHPPUpTo(cutoffTs) {
    const sorted = [...txns].filter(t => (t.createdAt || 0) <= cutoffTs).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const avg = {};
    const keyOf = n => (n || '').trim().toLowerCase();
    function addStock(name, qty, cost) {
      const k = keyOf(name);
      if (!k || qty <= 0) return;
      if (!avg[k]) avg[k] = { name: (name || '').trim(), qty: 0, cost: 0 };
      avg[k].qty += qty;
      avg[k].cost += cost;
    }
    function unitCostOf(name) {
      const k = keyOf(name);
      const r = avg[k];
      return (r && r.qty > 0) ? r.cost / r.qty : 0;
    }
    function removeStock(name, qty) {
      const k = keyOf(name);
      const r = avg[k];
      const uc = unitCostOf(name);
      if (r) {
        r.qty -= qty;
        r.cost -= qty * uc;
        if (r.qty < 0.0000001) { r.qty = 0; r.cost = 0; }
      }
      return uc;
    }
    sorted.forEach(t => {
      if (t.type === 'pembelian') {
        const shipping = Number(t.ongkosKirim) || 0;
        const subtotal = t.items.reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);
        t.items.forEach(i => {
          const qty = Number(i.qty) || 0;
          const itemValue = qty * (Number(i.price) || 0);
          const allocShipping = shipping > 0 ? (subtotal > 0 ? shipping * (itemValue / subtotal) : shipping / t.items.length) : 0;
          addStock(i.name, qty, itemValue + allocShipping);
        });
      } else if (t.type === 'produksi') {
        let batchCost = 0;
        (t.bahan || []).forEach(i => {
          const qty = Number(i.qty) || 0;
          batchCost += qty * removeStock(i.name, qty);
        });
        const totalHasilQty = (t.hasil || []).reduce((s, i) => s + (Number(i.qty) || 0), 0) || 1;
        (t.hasil || []).forEach(i => {
          const qty = Number(i.qty) || 0;
          addStock(i.name, qty, batchCost * (qty / totalHasilQty));
        });
      } else if (t.type === 'penjualan') {
        t.items.forEach(i => removeStock(i.name, Number(i.qty) || 0));
      }
    });
    return { getUnitCostAt: unitCostOf };
  }
  function monthEndTimestamp(mKey) {
    const [y, m] = mKey.split('-').map(Number);
    return new Date(y, m, 0, 23, 59, 59, 999).getTime();

  function computeStokValueForMonth(mKey) {
    const rows = computeStokBulanan(mKey);

      totalValue += value;
      return { ...r, unitCost: uc, value };
    });
    return { rows: withValue, totalValue };
  }

  // Menghapus stok = mencatat PENYESUAIAN STOK (bukan menghapus riwayat transaksi lama).
  // Dibuat sebagai transaksi penjualan senilai Rp0 supaya sisa stok item ini jadi 0,
  // sekaligus tetap tercatat & bisa dilacak di Riwayat (audit trail tetap utuh).
  // Edit manual sisa stok = mencatat PENYESUAIAN STOK (bukan mengubah riwayat transaksi lama).
  // Selisih antara angka lama dan angka baru dibuatkan satu transaksi penyesuaian senilai Rp0,
  // supaya sisa stok item ini persis sesuai yang diketik, sekaligus tetap tercatat & bisa dilacak.
  // Membuat satu transaksi penyesuaian stok (dipakai bareng oleh simpanSemuaPerubahanStok)
  function buildStokAdjustmentTxn(name, unit, code, selisih) {
    const naik = selisih > 0;
    return {
      id: uid(),
      type: naik ? 'pembelian' : 'penjualan',
      kodeTransaksi: generateTxnCode(naik ? 'pembelian' : 'penjualan'),
      items: [{ name, qty: Math.abs(selisih), unit: unit || 'pcs', price: 0, code }],
      total: 0,
      supplierName: naik ? 'Penyesuaian Stok (Edit Manual)' : undefined,
      customerName: !naik ? 'Penyesuaian Stok (Edit Manual)' : undefined,
      customerPhone: '',
      paid: true,
      rekening: !naik ? BANK_ACCOUNTS[0].id : undefined,
      createdAt: Date.now(),
      createdBy: currentUser ? currentUser.email : null,
    };
  }
  function updateStokBulkEditBar() {
    const bar = document.getElementById('bk-stok-bulk-edit-bar');
    if (!bar) return;
    const countEl = document.getElementById('bk-stok-edit-count');
    if (pendingStokEdits.size > 0) {
      bar.style.display = 'flex';
      if (countEl) countEl.textContent = pendingStokEdits.size;
    } else {
      bar.style.display = 'none';
    }
  }
  // Simpan banyak perubahan sisa stok sekaligus dalam SATU konfirmasi (bukan konfirmasi per baris),
  // supaya edit stok banyak barang jadi jauh lebih cepat.
  async function simpanSemuaPerubahanStok() {
    if (!requireOwnerForDelete()) { renderStok(); return; }
    if (!pendingStokEdits.size) return;
    const codeReg = getItemCodeRegistry();
    const entries = Array.from(pendingStokEdits.entries());
    const daftar = entries.map(([name, e]) => `${escapeAttr(name)}: ${e.orig.toLocaleString('id-ID')} &rarr; ${e.newQty.toLocaleString('id-ID')} ${escapeAttr(e.unit||'')}`).join('<br>');
    showConfirm(`Simpan ${entries.length} perubahan sisa stok sekaligus?<br><br><span style="font-size:12px; color:var(--ink-soft); text-align:left; display:block;">${daftar}</span><br>Riwayat transaksi lama tidak diubah.`, async () => {
      stokSavingInProgress = true;
      renderStok();
      try {
        const jobFns = entries.map(([name, e]) => async () => {
          const code = codeReg.byName[name.trim().toLowerCase()] || '';
          const selisih = e.newQty - e.orig;
          const txn = buildStokAdjustmentTxn(name, e.unit, code, selisih);
          const savedResult = await window.storage.set('txn:' + txn.id, JSON.stringify(txn), true);
          if (!savedResult) throw new Error('Server menolak simpan (kemungkinan masalah koneksi)');
          invalidateStockCaches();
          txns.unshift(txn);
          await autoReviveStokNames([name]);
        });
        const results = await runJobsInChunks(jobFns);
        results.forEach((r, idx) => { if (r.status === 'rejected') console.error('Gagal menyimpan perubahan stok untuk', entries[idx][0], ':', r.reason); });

        // VERIFIKASI NYATA: muat ulang data langsung dari server (bukan percaya update lokal saja),
        // lalu cek satu-satu apakah sisa stok yang tersimpan benar-benar sesuai target. Ini menangkap
        // kasus dimana penyimpanan "kelihatan berhasil" tapi sebenarnya gagal diam-diam di server.
        await loadTxns();
        invalidateStockCaches();
        const stockAfter = computeStock();
        const failedNames = [];
        entries.forEach(([name, e]) => {
          const actual = stockAfter[name.trim().toLowerCase()] ? stockAfter[name.trim().toLowerCase()].qty : 0;
          if (actual !== e.newQty) failedNames.push(name);
        });
        entries.forEach(([name]) => { if (!failedNames.includes(name)) pendingStokEdits.delete(name); });
        stokSaveAttemptFailed = failedNames.length > 0;
        if (failedNames.length) {
          showToast(`${entries.length - failedNames.length} TERVERIFIKASI tersimpan di server. ${failedNames.length} TIDAK TERSIMPAN (server menolak/koneksi bermasalah): ${failedNames.slice(0,3).join(', ')}${failedNames.length>3?', dst':''} - masih di daftar, klik "Lanjutkan Menyimpan" untuk coba lagi (mungkin perlu beberapa kali kalau koneksi tidak stabil).`);
        } else {
          showToast(`${entries.length} perubahan sisa stok TERVERIFIKASI tersimpan di server.`);
        }
      } catch (err) {
        console.error('Gagal total proses simpan massal stok:', err);
        stokSaveAttemptFailed = true;
        showToast('Terjadi kesalahan saat menyimpan. Klik "Lanjutkan Menyimpan" untuk coba lagi.');
      } finally {
        stokSavingInProgress = false;
        renderStok();
      }
    }, () => renderStok());
  }


  async function hapusStokItem(name, qty, unit) {
    if (!requireOwnerForDelete()) return;
    showConfirm(`Hapus "${name}" sepenuhnya (nama, kode, dan sisa stok ${qty.toLocaleString('id-ID')} ${unit||''})? Item ini tidak akan muncul lagi di Stok, Pricelist, atau dropdown mana pun. Riwayat transaksi lama TIDAK dihapus (untuk jejak audit), tapi item ini bersih dari sistem ke depannya.`, async () => {
      showLoadingModal(`Menghapus "${name}"...`);
      try {
        const codeReg = getItemCodeRegistry();
        const code = codeReg.byName[name.trim().toLowerCase()] || '';
        if (qty > 0) {
          const txn = {
            id: uid(),
            type: 'penjualan',
            kodeTransaksi: generateTxnCode('penjualan'),
            items: [{ name, qty, unit: unit || 'pcs', price: 0, code }],
            total: 0,
            customerName: 'Penyesuaian Stok (Dihapus)',
            customerPhone: '',
            paid: true,
            rekening: BANK_ACCOUNTS[0].id,
            createdAt: Date.now(),
            createdBy: currentUser ? currentUser.email : null,
          };
          await saveTxn(txn);
          txns.unshift(txn);
        }
        await markStokNamesDeleted([name]);
        await logToTrash('stok', `${name} (${qty.toLocaleString('id-ID')} ${unit||''})`, { name, qty, unit });
        trashEntriesCache = null;
        _itemCodeRegistryCache = null; // paksa hitung ulang registry supaya item ini langsung hilang
        closeLoadingModal();
        renderStok();
        showToast(`"${name}" berhasil dihapus sepenuhnya dari sistem.`);
      } catch (e) {
        console.error(e);
        closeLoadingModal();
        showToast('Gagal menghapus stok, coba lagi.');
      }
    });
  }

  // Hapus massal - sama seperti hapusStokItem tapi untuk banyak item sekaligus dalam satu transaksi penyesuaian
  async function hapusStokItemsMassal(names, currentRows) {
    if (!requireOwnerForDelete()) return;
    const targets = names.map(n => currentRows.find(r => r.name === n)).filter(Boolean);
    if (!targets.length) { showToast('Tidak ada item yang bisa dihapus.'); selectedStokNames.clear(); renderStok(); return; }
    const withStock = targets.filter(r => r.qty > 0);
    const daftar = targets.map(r => `${r.name} (${r.qty.toLocaleString('id-ID')} ${r.unit||''})`).join(', ');
    showConfirm(`Hapus ${targets.length} item terpilih sepenuhnya (nama, kode, dan sisa stok): ${daftar}? Item-item ini tidak akan muncul lagi di Stok, Pricelist, atau dropdown mana pun. Riwayat transaksi lama TIDAK dihapus (untuk jejak audit).`, async () => {
      showLoadingModal(`Menghapus ${targets.length} item...`);
      try {
        const codeReg = getItemCodeRegistry();
        if (withStock.length) {
          const items = withStock.map(r => ({
            name: r.name, qty: r.qty, unit: r.unit || 'pcs', price: 0,
