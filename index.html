  function handleStokExcelUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById('bk-stok-upload-status');
    statusEl.style.color = 'var(--ink-soft)';
    statusEl.textContent = 'Membaca file...';
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        if (!window.XLSX) { statusEl.textContent = 'Modul Excel belum siap, coba lagi sebentar.'; statusEl.style.color = 'var(--money-out)'; return; }
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        let headerIdx = raw.findIndex(row => row.some(c => String(c).trim().toLowerCase().includes('nama barang')));
        if (headerIdx === -1) headerIdx = 0;
        const dataRows = raw.slice(headerIdx + 1);
        const validItems = [];
        const pricelistJobs = []; // {itemKey, hargaBeli, hargaJual} - diproses setelah kode barang final ditentukan
        const errors = [];
        const nextLocalCode = makeLocalItemCodeCounter();
        dataRows.forEach((row, idx) => {
          const [kode, nama, kategori, jumlah, satuan, harga, hargaJualRaw, spesifikasiRaw] = row;
          if (!nama || String(nama).trim() === '') return; // baris kosong dilewati diam-diam
          const qty = Number(jumlah);
          const price = Number(harga);
          const rowNum = headerIdx + idx + 2;
          if (!qty || qty <= 0) { errors.push(`Baris ${rowNum}: jumlah tidak valid`); return; }
          if (!(price >= 0)) { errors.push(`Baris ${rowNum}: harga tidak valid`); return; }
          let code = String(kode || '').trim();
          // Tentukan kategori: kolom Kategori dulu, lalu prefix kode kalau ada, baru kata kunci nama
          const katText = String(kategori || '').trim().toLowerCase();
          let isLaptop;
          if (katText.startsWith('laptop')) isLaptop = true;
          else if (katText.startsWith('onderdil') || katText.startsWith('sparepart')) isLaptop = false;
          else if (code) isLaptop = /^LPSTK/i.test(code);
          else isLaptop = detectKategoriFromName(String(nama)) === 'LPSTK';
          if (!code) code = nextLocalCode(isLaptop ? 'LPSTK' : 'LPSRV');
          const spec = String(spesifikasiRaw || '').trim();
          const hargaJual = Number(hargaJualRaw) || 0;
          validItems.push({ code, name: String(nama).trim(), qty, unit: (String(satuan || '').trim() || 'pcs'), price, spec, _isLaptop: isLaptop });
          if (hargaJual > 0) {
            const itemKey = pricelistKeyFor(code, String(nama).trim());
            const markup = price > 0 ? Math.round(((hargaJual / price) - 1) * 10000) / 100 : 0;
            pricelistJobs.push({ itemKey, markup, hargaJual });
          }
        });
        if (!validItems.length) {
          statusEl.textContent = 'Tidak ada baris valid ditemukan. Pastikan format file sesuai template (unduh template dulu kalau belum).';
          statusEl.style.color = 'var(--money-out)';
          return;
        }
        // Pisahkan berdasarkan kategori yang sudah ditentukan tiap baris (kolom Kategori > prefix kode > kata kunci nama)
        const stripFlag = (i) => { const { _isLaptop, ...rest } = i; return rest; };
        const laptopItems = validItems.filter(i => i._isLaptop).map(stripFlag);
        const sparepartItems = validItems.filter(i => !i._isLaptop).map(stripFlag);

        statusEl.textContent = `${validItems.length} baris siap diupload. Menunggu konfirmasi...`;
        const errLines = errors.slice(0, 5).map(x => escapeAttr(x)).join('<br/>') + (errors.length > 5 ? `<br/>...dan ${errors.length - 5} lainnya` : '');
        const errPreview = errors.length ? `<br/><br/><span style="font-size:12px; color:var(--money-out); text-align:left; display:block;">${errors.length} baris akan dilewati (format tidak valid):<br/>${errLines}</span>` : '';
        const partsPreview = [];
        if (laptopItems.length) partsPreview.push(`${laptopItems.length} barang Laptop`);
        if (sparepartItems.length) partsPreview.push(`${sparepartItems.length} barang Sparepart/Logistik`);
        showConfirm(
          `Ditemukan <strong>${validItems.length}</strong> barang valid (${partsPreview.join(' &amp; ')}).${errPreview}<br/><br/>Semua akan langsung masuk ke Stok sebagai transaksi pembelian.<br/><br/>Lanjutkan upload?`,
          async () => {
            showLoadingModal(`Menyimpan ${validItems.length} barang ke Stok...`);
            try {
              const createdTxns = [];
              if (laptopItems.length) {
                const totalLaptop = laptopItems.reduce((s,i) => s + i.qty * i.price, 0);
                createdTxns.push({
                  id: uid(), type: 'pembelian', kodeTransaksi: generateTxnCode('pembelian'),
                  items: laptopItems, total: totalLaptop, supplierName: 'Import Excel - Stock Laptop',
                  createdAt: Date.now(), createdBy: currentUser ? currentUser.email : null,
                });
              }
              if (sparepartItems.length) {
                const totalSparepart = sparepartItems.reduce((s,i) => s + i.qty * i.price, 0);
                createdTxns.push({
                  id: uid(), type: 'pembelian', kodeTransaksi: generateTxnCode('pembelian'),
                  items: sparepartItems, total: totalSparepart, supplierName: 'Import Excel - Stock Sparepart/Logistik',
                  createdAt: Date.now() + 1, createdBy: currentUser ? currentUser.email : null,
                });
              }
              await Promise.all(createdTxns.map(t => saveTxn(t)));
              createdTxns.forEach(t => txns.unshift(t));
              updateLoadingModal('Menyelaraskan data stok...');
              await autoReviveStokNames(validItems.map(i => i.name));
              if (pricelistJobs.length) {
                updateLoadingModal(`Menyimpan harga jual (${pricelistJobs.length} item)...`);
                const priceResults = await runJobsInChunks(pricelistJobs.map(j => () => savePricelistEntry(j.itemKey, j.hargaJual, j.markup)), (done, total) => {
                  updateLoadingModal(`Menyimpan harga jual... (${done}/${total})`);
                });
                priceResults.forEach(r => { if (r.status === 'rejected') console.error('Gagal menyimpan harga jual:', r.reason); });
              }
              closeLoadingModal();
              renderStok();
              const errNote = errors.length ? `\n${errors.length} baris dilewati karena data tidak valid.` : '';
              const priceNote = pricelistJobs.length ? `\nHarga jual untuk ${pricelistJobs.length} barang otomatis masuk ke Pricelist.` : '';
              const resultMsg = `Berhasil diimpor ke Stok: ${partsPreview.join(' & ')}.${errNote}${priceNote}`;
              statusEl.textContent = resultMsg.replace(/\n/g, ' ');
              statusEl.style.color = 'var(--money-in)';
              showResultModal('Upload stok berhasil', resultMsg);
            } catch (err) {
              closeLoadingModal();
              console.error(err);
              statusEl.textContent = 'Gagal menyimpan ke Stok. Coba lagi.';
              statusEl.style.color = 'var(--money-out)';
              showResultModal('Upload gagal', 'Terjadi kesalahan saat menyimpan data. Coba upload ulang file yang sama.');
            }
          },
          () => { statusEl.textContent = 'Upload dibatalkan.'; statusEl.style.color = 'var(--ink-soft)'; }
        );
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Gagal membaca file. Pastikan file berformat .xlsx sesuai template.';
        statusEl.style.color = 'var(--money-out)';
      } finally {
        e.target.value = '';
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // Perbaikan data lama: kalau beberapa barang BERBEDA ternyata punya kode barang yang SAMA persis
  // (bisa terjadi dari upload sebelum ada perbaikan penghitung kode), fungsi ini otomatis memberi
  // kode baru yang unik ke barang-barang yang bentrok. Transaksi pembelian lama TIDAK dihapus,
  // hanya field "code" pada item yang bentrok yang diperbarui lalu disimpan ulang.
  async function perbaikiKodeDuplikat() {
    if (!requireOwnerForDelete()) return;
    const statusEl = document.getElementById('bk-stok-fix-status');
    if (statusEl) { statusEl.style.color = 'var(--ink-soft)'; statusEl.textContent = 'Memindai kode barang...'; }
    try {
      const relevant = [...txns].filter(t => t.type === 'pembelian' || t.type === 'produksi').sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
      const seenCodeToName = {}; // kode (huruf kecil) -> nama barang pertama yang memakainya
      const touchedTxnIds = new Set();
      const nextLocalCode = makeLocalItemCodeCounter();
      let fixedCount = 0;
      relevant.forEach(t => {
        const list = t.type === 'pembelian' ? (t.items || []) : (t.hasil || []);
        list.forEach(item => {
          if (!item.code || !item.code.trim()) return;
          const codeLower = item.code.trim().toLowerCase();
          const nameLower = (item.name || '').trim().toLowerCase();
          if (!(codeLower in seenCodeToName)) {
            seenCodeToName[codeLower] = nameLower;
          } else if (seenCodeToName[codeLower] !== nameLower) {
            // Kode ini sudah lebih dulu dipakai barang LAIN -> beri kode baru yang unik
            const prefix = (item.code.trim().split('-')[0] || 'LPSTK').toUpperCase();
            let newCode = nextLocalCode(prefix);
            while (newCode.toLowerCase() in seenCodeToName) newCode = nextLocalCode(prefix);
            item.code = newCode;
            seenCodeToName[newCode.toLowerCase()] = nameLower;
            touchedTxnIds.add(t.id);
            fixedCount++;
          }
        });
      });
      if (!fixedCount) {
        if (statusEl) { statusEl.style.color = 'var(--money-in)'; statusEl.textContent = 'Tidak ditemukan kode duplikat. Semua kode barang sudah unik.'; }
        showToast('Tidak ada kode duplikat ditemukan.');
        return;
      }
      const txnsToSave = relevant.filter(t => touchedTxnIds.has(t.id));
      await Promise.all(txnsToSave.map(t => saveTxn(t)));
      _itemCodeRegistryCache = null; // paksa hitung ulang registry supaya kode baru langsung terlihat
      renderStok();
      if (statusEl) { statusEl.style.color = 'var(--money-in)'; statusEl.textContent = `${fixedCount} kode duplikat berhasil diperbaiki di ${txnsToSave.length} transaksi.`; }
      showToast(`${fixedCount} kode duplikat berhasil diperbaiki.`);
    } catch (err) {
      console.error(err);
      if (statusEl) { statusEl.style.color = 'var(--money-out)'; statusEl.textContent = 'Gagal memperbaiki kode, coba lagi.'; }
    }
  }

  function parseTanggalDDMMYYYY(val) {
    if (val instanceof Date) return val.getTime();
    const s = String(val || '').trim();
    const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) {
      const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), 12, 0, 0);
      if (!isNaN(d.getTime())) return d.getTime();
    }
    // fallback: kalau Excel menyimpan sebagai serial number tanggal
    const num = Number(val);
    if (num && num > 20000) {
      const excelEpoch = new Date(1899, 11, 30).getTime();
      return excelEpoch + num * 86400000 + 12 * 3600000;
    }
    return null;
  }

      ['Petunjuk: JANGAN ubah urutan/nama kolom di baris ke-5. Tanggal Selesai format DD/MM/YYYY. Kolom Kode Service boleh dikosongkan (dibuat otomatis). Status isi persis "Lunas" atau "Belum". Kolom Rekening isi persis salah satu: ' + BANK_ACCOUNTS.map(a=>a.label).join(' / ') + ' (boleh dikosongkan, default rekening pertama). Setiap baris otomatis membuat catatan Service berstatus "Sudah diambil" + transaksi pemasukan yang langsung masuk ke laporan keuangan. Baris contoh boleh dihapus/ditimpa.'],
      [],
      [],
      ['Tanggal Selesai', 'Kode Service', 'Nama Pelanggan', 'No. HP', 'Merk/Tipe Laptop', 'Keluhan', 'Biaya Service', 'Status', 'Rekening'],
      ['15/02/2026', '', 'Budi Santoso', '081234567890', 'Asus A455L', 'Mati total tidak bisa cas', 250000, 'Lunas', BANK_ACCOUNTS[0].label],
      ['20/02/2026', '', 'Rahmi', '081280572167', 'Lenovo Thinkpad X390', 'Ganti baterai', 350000, 'Lunas', BANK_ACCOUNTS[0].label],
    ];
    XLSX.utils.book_append_sheet(wb, sheetFromAOA(aoa), 'Template Riwayat Service');
    XLSX.writeFile(wb, 'template-riwayat-service-lama.xlsx');
  }

  function handleServiceMigrasiUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById('bk-svc-migrasi-status');
    statusEl.style.color = 'var(--ink-soft)';
    statusEl.textContent = 'Membaca file...';
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        if (!window.XLSX) { statusEl.textContent = 'Modul Excel belum siap, coba lagi sebentar.'; statusEl.style.color = 'var(--money-out)'; return; }
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        let headerIdx = raw.findIndex(row => row.some(c => String(c).trim().toLowerCase().includes('nama pelanggan')));
        if (headerIdx === -1) headerIdx = 0;
        const dataRows = raw.slice(headerIdx + 1);
        await loadServices(); // muat ulang dulu supaya kode service tidak bentrok dengan data terbaru di server
        const usedCodes = new Set(services.map(x => (x.kodeService || '').trim().toUpperCase()));
        const jobs = [];
        const errors = [];
        let successCount = 0;
        const nextLocalServiceCode = makeLocalServiceCodeCounter();
        dataRows.forEach((row, idx) => {
          const [tglRaw, kodeRaw, nama, hp, device, keluhan, biayaRaw, status, rekeningLabel] = row;
          if (!nama || String(nama).trim() === '') return; // baris kosong dilewati diam-diam
          const rowNum = headerIdx + idx + 2;
          const selesaiTime = parseTanggalDDMMYYYY(tglRaw);
          if (!selesaiTime) { errors.push(`Baris ${rowNum}: tanggal selesai tidak valid (pakai format DD/MM/YYYY)`); return; }
          const biaya = Number(biayaRaw);
          if (!(biaya >= 0)) { errors.push(`Baris ${rowNum}: biaya service tidak valid`); return; }
          if (!device || String(device).trim() === '') { errors.push(`Baris ${rowNum}: merk/tipe laptop wajib diisi`); return; }
          let kode = String(kodeRaw || '').trim();
          while (!kode || usedCodes.has(kode.toUpperCase())) { kode = nextLocalServiceCode(); }
          usedCodes.add(kode.toUpperCase());
          const isLunas = String(status || 'Lunas').trim().toLowerCase() !== 'belum';
          const accMatch = BANK_ACCOUNTS.find(a => a.label.toLowerCase() === String(rekeningLabel || '').trim().toLowerCase());
          const rekening = accMatch ? accMatch.id : BANK_ACCOUNTS[0].id;
          const deviceTrim = String(device).trim();
          const txn = {
            id: uid(),
            type: 'penjualan',
            kodeTransaksi: generateTxnCode('penjualan'),
            items: [{ name: `Jasa Service Laptop - ${deviceTrim}`, qty: 1, unit: 'jasa', price: biaya }],
            total: biaya,
            customerName: String(nama).trim(),
            customerPhone: String(hp || '').trim(),
            paid: isLunas,
            rekening,
            createdAt: selesaiTime,
            createdBy: currentUser ? currentUser.email : null,
          };
          const svc = {
            id: uid(),
            kodeService: kode,
            customerName: String(nama).trim(),
            customerPhone: String(hp || '').trim(),
            device: deviceTrim,
            complaint: String(keluhan || '').trim(),
            accessories: '',
            estimasiBiaya: biaya,
            rekening,
            catatanDiagnosa: '',
            biayaFinal: biaya,
            dpAmount: 0,
            dpTxnId: null,
            paid: isLunas,
            status: 'diambil',
            linkedTxnId: txn.id,
            createdAt: selesaiTime - 2000,
            createdBy: currentUser ? currentUser.email : null,
            updatedAt: selesaiTime,
            history: [
              { status: 'diterima', at: selesaiTime - 2000 },
              { status: 'selesai', at: selesaiTime - 1000 },
              { status: 'diambil', at: selesaiTime },
            ],
          };
          jobs.push(async () => {
            await saveTxn(txn);
            await saveService(svc);
            txns.push(txn);
            services.push(svc);
          });
        });
        if (!jobs.length) {
          statusEl.textContent = 'Tidak ada baris valid ditemukan. Pastikan format file sesuai template (unduh template dulu kalau belum).';
          statusEl.style.color = 'var(--money-out)';
          return;
        }
        statusEl.textContent = `${jobs.length} baris siap dimigrasi. Menunggu konfirmasi...`;
        const errLines = errors.slice(0, 5).map(x => escapeAttr(x)).join('<br/>') + (errors.length > 5 ? `<br/>...dan ${errors.length - 5} lainnya` : '');
        const errPreview = errors.length ? `<br/><br/><span style="font-size:12px; color:var(--money-out); text-align:left; display:block;">${errors.length} baris akan dilewati (format tidak valid):<br/>${errLines}</span>` : '';
        showConfirm(
          `Ditemukan <strong>${jobs.length}</strong> riwayat service lama yang valid di file ini.${errPreview}<br/><br/>Setiap baris akan dicatat sebagai data Service "Sudah diambil" sekaligus transaksi pemasukan, langsung masuk ke laporan keuangan.<br/><br/>Lanjutkan migrasi?`,
          async () => {
            showLoadingModal(`Memproses 0/${jobs.length} baris...`);
            statusEl.textContent = `Memproses ${jobs.length} baris...`;
            try {
              const results = await runJobsInChunks(jobs, (done, total) => {
                updateLoadingModal(`Memproses ${done}/${total} baris...`);
                statusEl.textContent = `Memproses baris... (${done}/${total})`;
              });
              const failedCount = results.filter(r => r.status === 'rejected').length;
              results.forEach(r => { if (r.status === 'rejected') console.error('Gagal menyimpan baris service:', r.reason); });
              const actualSuccess = jobs.length - failedCount;
              txns.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
              services.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
              closeLoadingModal();
              const errNote = errors.length ? `\n${errors.length} baris dilewati (format tidak valid).` : '';
              const failNote = failedCount ? `\n${failedCount} baris GAGAL tersimpan (masalah koneksi) - coba upload ulang file yang sama, baris yang sudah berhasil tidak akan dobel.` : '';
              statusEl.textContent = `${actualSuccess} baris berhasil dimigrasi.${errNote}${failNote}`;
              statusEl.style.color = failedCount ? 'var(--money-out)' : 'var(--money-in)';
              showResultModal(
                failedCount ? 'Migrasi selesai (sebagian gagal)' : 'Migrasi berhasil',
                `${actualSuccess} riwayat service lama berhasil dimigrasi.${errNote}${failNote}\nLangsung masuk ke laporan keuangan.`,
                () => { svcView = 'riwayat'; activeTab = 'service'; renderTabs(); renderBody(); }
              );
            } catch (err) {
              closeLoadingModal();
              console.error(err);
              statusEl.textContent = 'Gagal memproses migrasi. Coba lagi.';
              statusEl.style.color = 'var(--money-out)';
              showResultModal('Migrasi gagal', 'Terjadi kesalahan saat menyimpan data. Coba upload ulang file yang sama - baris yang sudah berhasil tidak akan dobel.');
            }
          },
          () => { statusEl.textContent = 'Migrasi dibatalkan.'; statusEl.style.color = 'var(--ink-soft)'; }
        );
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Gagal membaca file. Pastikan file berformat .xlsx sesuai template.';
        statusEl.style.color = 'var(--money-out)';
      } finally {
        e.target.value = '';
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ---------- PRICELIST (harga jual dari HPP + markup, siap ekspor Excel) ----------
  let pricelistView = 'barang'; // barang | onderdil
  function pricelistCategoryOf(code) {
    return /^LPSRV/i.test(code || '') ? 'onderdil' : 'barang'; // LPSTK & LPPRD & tanpa kode masuk "barang"
  }
  function updatePricelistUntungCell(tr, hargaJual, unitCost) {
    const cell = tr.querySelector('.pricelist-untung-cell');
    if (!cell) return;
    const untung = hargaJual - unitCost;
    const persen = unitCost > 0 ? ((untung / unitCost) * 100).toFixed(1) : '0';
    cell.style.color = untung >= 0 ? 'var(--money-in)' : 'var(--money-out)';
    cell.innerHTML = `${rupiah(untung)}<div style="font-size:10px; font-weight:500; color:var(--ink-soft);">${persen}%</div>`;
  }

  function renderPricelist() {
    const stockMap = computeStock();
    const codeReg = getItemCodeRegistry();
    const hpp = computeHPP();
    const allRows = Object.values(stockMap).filter(r => !/^Jasa Service Laptop/i.test(r.name) && !deletedStokNames.has(r.name.trim().toLowerCase())).sort((a,b) => a.name.localeCompare(b.name));
    const rowsWithMeta = allRows.map(r => {
      const code = codeReg.byName[r.name.trim().toLowerCase()] || '';
      return { r, code, kategori: pricelistCategoryOf(code) };
    });
    const countBarang = rowsWithMeta.filter(x => x.kategori === 'barang').length;
    const countOnderdil = rowsWithMeta.filter(x => x.kategori === 'onderdil').length;
    const rows = rowsWithMeta.filter(x => x.kategori === pricelistView);

    // Proyeksi keuntungan kalau SEMUA sisa stok berhasil terjual di Harga Jual yang tercatat sekarang
    function hitungProyeksi(list) {
      let jual = 0, hppTotal = 0;
      list.forEach(({ r, code }) => {
        if (r.qty <= 0) return;
        const itemKey = pricelistKeyFor(code, r.name);
        const unitCost = hpp.getCurrentUnitCost(r.name);
        const entry = pricelistData[itemKey];
        const markup = entry ? (Number(entry.markup) || 0) : 0;
        const hargaJual = (entry && entry.hargaJual != null) ? Number(entry.hargaJual) : Math.round(unitCost * (1 + markup / 100) / 100) * 100;
        jual += hargaJual * r.qty;
        hppTotal += unitCost * r.qty;
      });
      return { jual, hppTotal, untung: jual - hppTotal };
    }
    const proyeksiSemua = hitungProyeksi(rowsWithMeta);
    const proyeksiView = hitungProyeksi(rows);

    bodyEl.innerHTML = `
      ${isOwner() ? `
      <div class="bk-section-title">Proyeksi Kalau Semua Stok Terjual</div>
      <div class="bk-stats" style="margin-bottom:18px;">
        <div class="bk-stat"><div class="lbl">Total Nilai Jual (semua kategori)</div><div class="val">${rupiah(proyeksiSemua.jual)}</div></div>
        <div class="bk-stat out"><div class="lbl">Total HPP (semua kategori)</div><div class="val">${rupiah(proyeksiSemua.hppTotal)}</div></div>
        <div class="bk-stat in"><div class="lbl">Proyeksi Untung (semua kategori)</div><div class="val" style="color:${proyeksiSemua.untung>=0?'var(--money-in)':'var(--money-out)'}">${rupiah(proyeksiSemua.untung)}</div></div>
        <div class="bk-stat in"><div class="lbl">Proyeksi Untung (${pricelistView === 'barang' ? 'Stock Laptop' : 'Stock Onderdil'} saja)</div><div class="val" style="color:${proyeksiView.untung>=0?'var(--money-in)':'var(--money-out)'}">${rupiah(proyeksiView.untung)}</div></div>
      </div>
      <div class="bk-stok-note" style="margin-bottom:16px;">Dihitung dari <strong>(Harga Jual &minus; HPP) &times; Sisa Stok</strong> untuk semua barang yang stoknya masih ada (belum termasuk barang habis). Angka ini proyeksi kalau SEMUA terjual persis di harga yang tercatat sekarang &mdash; belum tentu sama dengan hasil nyata kalau ada diskon, barang rusak, atau harga jual berubah nanti.</div>
      ` : ''}
      <div class="bk-stok-note">Ter-link langsung dengan tab Stok &mdash; kalau Harga Jual sudah diisi saat upload Excel di Stok, angka itu yang ditampilkan persis di sini (bukan dihitung ulang). Bisa isi salah satu saja: ketik "Markup (%)" (harga jual ikut menyesuaikan dari HPP saat ini), ATAU ketik langsung "Harga Jual" (markup-nya ikut dihitung ulang otomatis untuk referensi). File Excel yang diunduh hanya berisi Kode, Nama, Satuan &amp; Harga Jual (bersih, siap dibagikan ke pelanggan tanpa membocorkan HPP/margin).</div>
      <div class="bk-filter" style="margin-bottom:14px;">
        <div class="bk-chip ${pricelistView==='barang'?'active':''}" data-pv="barang">Stock Laptop (${countBarang})</div>
        <div class="bk-chip ${pricelistView==='onderdil'?'active':''}" data-pv="onderdil">Stock Onderdil (${countOnderdil})</div>
      </div>
      <div class="bk-two-col" style="margin-bottom:10px; max-width:460px;">
        <input id="bk-pricelist-default-markup" type="number" min="0" step="any" placeholder="Markup default % (mis: 20)" />
        <button class="bk-btn ghost" id="bk-pricelist-apply-default">Terapkan ke yang masih 0%</button>
      </div>
      <button class="bk-btn primary" id="bk-pricelist-download" style="margin-bottom:18px;">Unduh Pricelist ${pricelistView === 'barang' ? 'Stock Laptop' : 'Stock Onderdil'} (Excel)</button>
      ${rows.length ? `
      <div class="bk-stok-note" style="margin-bottom:8px; font-weight:600; color:var(--ink);">Total: ${rows.length.toLocaleString('id-ID')} jenis barang di kategori ${pricelistView === 'barang' ? 'Stock Laptop' : 'Stock Onderdil'}.</div>
      <div style="overflow-x:auto; -webkit-overflow-scrolling:touch;">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px; white-space:nowrap;">
          <thead>
            <tr>
              <th style="text-align:right; padding:8px 6px 8px 0; width:26px; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; font-weight:700; border-bottom:1px solid var(--line);">No</th>
              <th style="text-align:left; padding:8px 10px 8px 0; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; font-weight:700; border-bottom:1px solid var(--line);">Nama item</th>
              <th style="text-align:right; padding:8px 10px; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; font-weight:700; border-bottom:1px solid var(--line);">Satuan</th>
              <th style="text-align:right; padding:8px 10px; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; font-weight:700; border-bottom:1px solid var(--line);">Stok</th>
              <th style="text-align:right; padding:8px 10px; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; font-weight:700; border-bottom:1px solid var(--line);">HPP/unit</th>
              <th style="text-align:right; padding:8px 10px; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; font-weight:700; border-bottom:1px solid var(--line);">Markup (%)</th>
              <th style="text-align:right; padding:8px 0 8px 10px; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; font-weight:700; border-bottom:1px solid var(--line);">Harga Jual (dari Stok / bisa ketik manual)</th>
              <th style="text-align:right; padding:8px 0 8px 10px; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; font-weight:700; border-bottom:1px solid var(--line);">Untung/unit</th>
            </tr>
          </thead>
          <tbody id="bk-pricelist-tbody">
            ${rows.map(({ r, code }, idx) => {
              const itemKey = pricelistKeyFor(code, r.name);
              const specRec = codeReg.byNameFull[r.name.trim().toLowerCase()];
              const spec = specRec ? specRec.spec : '';
              const unitCost = hpp.getCurrentUnitCost(r.name);
              const entry = pricelistData[itemKey];
              // hargaJual: pakai yang sudah tersimpan persis (mis. dari upload Stok) kalau ada,
              // fallback hitung dari markup% cuma untuk data lama yang belum punya hargaJual tersimpan.
              const markup = entry ? (Number(entry.markup) || 0) : 0;
              const hargaJual = (entry && entry.hargaJual != null) ? Number(entry.hargaJual) : Math.round(unitCost * (1 + markup / 100) / 100) * 100;
              return `<tr data-key="${itemKey}" data-cost="${unitCost}">
                <td style="padding:9px 6px 9px 0; border-bottom:1px solid var(--line); text-align:right; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700;">${idx + 1}</td>
                <td style="padding:9px 10px 9px 0; border-bottom:1px solid var(--line); white-space:normal;">
                  ${escapeAttr(r.name)}${code ? ` <span class="mono" style="font-size:10.5px; color:var(--accent3-ink); background:var(--accent3-bg); padding:2px 7px; border-radius:6px;">${escapeAttr(code)}</span>` : ''}
                  ${spec ? `<div style="font-size:11px; color:var(--ink-soft); margin-top:2px;">${escapeAttr(spec)}</div>` : ''}
                </td>
                <td style="padding:9px 10px; border-bottom:1px solid var(--line); text-align:right; color:var(--ink-soft);">${r.unit || '-'}</td>
                <td style="padding:9px 10px; border-bottom:1px solid var(--line); text-align:right; font-family:'IBM Plex Mono',monospace;">${r.qty.toLocaleString('id-ID')}</td>
                <td style="padding:9px 10px; border-bottom:1px solid var(--line); text-align:right; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft);">${rupiah(unitCost)}</td>
                <td style="padding:6px 10px; border-bottom:1px solid var(--line); text-align:right;">
                  <input class="pricelist-markup-input" type="number" min="0" step="any" value="${markup}" style="width:72px; text-align:right; border:1.5px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12.5px; font-family:'IBM Plex Mono',monospace;" />
                </td>
                <td style="padding:6px 0 6px 10px; border-bottom:1px solid var(--line); text-align:right;">
                  <input class="pricelist-hargajual-input" type="number" min="0" step="any" value="${hargaJual}" style="width:100px; text-align:right; border:1.5px solid var(--accent); border-radius:8px; padding:6px 8px; font-size:12.5px; font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--accent-ink);" />
                </td>
                <td class="pricelist-untung-cell" style="padding:9px 0 9px 10px; border-bottom:1px solid var(--line); text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:700; color:${(hargaJual-unitCost)>=0?'var(--money-in)':'var(--money-out)'};">
                  ${rupiah(hargaJual - unitCost)}
                  <div style="font-size:10px; font-weight:500; color:var(--ink-soft);">${unitCost > 0 ? (((hargaJual-unitCost)/unitCost)*100).toFixed(1) : '0'}%</div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      ` : `<div class="bk-empty">Belum ada barang di kategori ${pricelistView === 'barang' ? 'Stock Laptop' : 'Stock Onderdil'}.</div>`}
    `;

    bodyEl.querySelectorAll('.bk-filter [data-pv]').forEach(c => c.addEventListener('click', () => { pricelistView = c.dataset.pv; renderPricelist(); }));

    bodyEl.querySelectorAll('.pricelist-markup-input').forEach(input => {
      input.addEventListener('input', async (e) => {
        const tr = e.target.closest('tr');
        const itemKey = tr.dataset.key;
        const unitCost = Number(tr.dataset.cost) || 0;
        const markup = Number(e.target.value) || 0;
        const hargaJual = Math.round(unitCost * (1 + markup / 100) / 100) * 100;
        tr.querySelector('.pricelist-hargajual-input').value = hargaJual;
        updatePricelistUntungCell(tr, hargaJual, unitCost);
        await savePricelistEntry(itemKey, hargaJual, markup);
      });
    });

    bodyEl.querySelectorAll('.pricelist-hargajual-input').forEach(input => {
      input.addEventListener('input', async (e) => {
        const tr = e.target.closest('tr');
        const itemKey = tr.dataset.key;
        const unitCost = Number(tr.dataset.cost) || 0;
        const hargaJual = Number(e.target.value) || 0;
        const markup = unitCost > 0 ? ((hargaJual / unitCost) - 1) * 100 : 0;
        const markupRounded = Math.round(markup * 100) / 100;
        tr.querySelector('.pricelist-markup-input').value = markupRounded;
        updatePricelistUntungCell(tr, hargaJual, unitCost);
        // hargaJual disimpan PERSIS seperti yang diketik, tidak dibulatkan/dihitung ulang
        await savePricelistEntry(itemKey, hargaJual, markupRounded);
      });
    });

    document.getElementById('bk-pricelist-apply-default').addEventListener('click', async () => {
      const defVal = Number(document.getElementById('bk-pricelist-default-markup').value) || 0;
      if (defVal <= 0) { showToast('Isi dulu markup default-nya.'); return; }
      const trsToUpdate = Array.from(bodyEl.querySelectorAll('#bk-pricelist-tbody tr')).filter(tr => {
        const input = tr.querySelector('.pricelist-markup-input');
        return Number(input.value) === 0;
      });
      for (const tr of trsToUpdate) {
        const markupInput = tr.querySelector('.pricelist-markup-input');
        const unitCost = Number(tr.dataset.cost) || 0;
        markupInput.value = defVal;
        const hargaJual = Math.round(unitCost * (1 + defVal / 100) / 100) * 100;
        tr.querySelector('.pricelist-hargajual-input').value = hargaJual;
        updatePricelistUntungCell(tr, hargaJual, unitCost);
        await savePricelistEntry(tr.dataset.key, hargaJual, defVal);
      }
      showToast(`Markup ${defVal}% diterapkan ke ${trsToUpdate.length} barang.`);
    });

    document.getElementById('bk-pricelist-download').addEventListener('click', downloadPricelistExcel);
  }

  function downloadPricelistExcel() {
    if (!window.XLSX) { showToast('Modul Excel belum siap, coba lagi sebentar.'); return; }
    const storeName = document.getElementById('bk-storename').value || 'Toko Saya';
    const stockMap = computeStock();
    const codeReg = getItemCodeRegistry();
    const hpp = computeHPP();
    const kategoriLabel = pricelistView === 'barang' ? 'Stock Laptop' : 'Stock Onderdil';
    const rows = Object.values(stockMap)
      .filter(r => !/^Jasa Service Laptop/i.test(r.name) && !deletedStokNames.has(r.name.trim().toLowerCase()))
      .map(r => ({ r, code: codeReg.byName[r.name.trim().toLowerCase()] || '' }))
      .filter(x => pricelistCategoryOf(x.code) === pricelistView)
      .sort((a,b) => a.r.name.localeCompare(b.r.name));
    const wb = XLSX.utils.book_new();
    const aoa = [
      [storeName],
      [`DAFTAR HARGA (PRICELIST) - ${kategoriLabel.toUpperCase()}`],
      ['Berlaku per', new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' })],
      [],
      ['Kode', 'Nama Barang', 'Satuan', 'Harga Jual'],
    ];
    rows.forEach(({ r, code }) => {
      const itemKey = pricelistKeyFor(code, r.name);
      const unitCost = hpp.getCurrentUnitCost(r.name);
      const entry = pricelistData[itemKey];
      const markup = entry ? (Number(entry.markup) || 0) : 0;
      const hargaJual = (entry && entry.hargaJual != null) ? Number(entry.hargaJual) : Math.round(unitCost * (1 + markup / 100) / 100) * 100;
      aoa.push([code || '-', r.name, r.unit || '-', hargaJual]);
    });
    XLSX.utils.book_append_sheet(wb, sheetFromAOA(aoa), kategoriLabel);
    XLSX.writeFile(wb, `pricelist-${pricelistView}-${storeName.replace(/\s+/g,'_')}-${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  function renderProdEstimateHtml() {
    const hppNow = computeHPP();
    const validBahan = produksiFormState.bahan.filter(i => i.name && Number(i.qty) > 0);
    const validHasil = produksiFormState.hasil.filter(i => i.name && Number(i.qty) > 0);
    const estBatchCost = validBahan.reduce((s,i) => s + Number(i.qty) * hppNow.getCurrentUnitCost(i.name), 0);
    const totalHasilQty = validHasil.reduce((s,i) => s + Number(i.qty), 0) || 1;
    if (!validBahan.length) {
      return '<div class="bk-stok-note" style="margin:0;">Isi bahan baku untuk melihat estimasi HPP.</div>';
    }
    const bahanLines = validBahan.map(i => {
      const uc = hppNow.getCurrentUnitCost(i.name);
      return `${i.name}: ${rupiah(Number(i.qty) * uc)} <span style="color:var(--ink-soft);">(${rupiah(uc)}/${i.unit || 'satuan'})</span>`;
    }).join('<br/>');
    const hasilLines = validHasil.length ? validHasil.map(i => {
      const allocCost = estBatchCost * (Number(i.qty) / totalHasilQty);
      const uc = Number(i.qty) > 0 ? allocCost / Number(i.qty) : 0;
      return `${i.name}: <strong>${rupiah(uc)}</strong> / ${i.unit || 'satuan'}`;
    }).join('<br/>') : '<span style="color:var(--ink-soft);">Isi hasil produksi untuk lihat HPP per satuan.</span>';
    return `
      <div style="font-size:12.5px; line-height:1.7;">
        <div style="color:var(--ink-soft); margin-bottom:2px;">Estimasi biaya bahan baku:</div>
        ${bahanLines}
        <div style="font-weight:600; margin-top:6px; border-top:1px dashed var(--line); padding-top:6px;">Total biaya batch: ${rupiah(estBatchCost)}</div>
        <div style="color:var(--ink-soft); margin-top:8px; margin-bottom:2px;">Estimasi HPP produk jadi:</div>
        ${hasilLines}
      </div>`;
  }

  async function saveProduksiForm() {
    const errEl = document.getElementById('bk-prod-err');
    const validBahan = produksiFormState.bahan.filter(i => i.name && Number(i.qty) > 0);
    const validHasil = produksiFormState.hasil.filter(i => i.name && Number(i.qty) > 0);
    if (validBahan.length === 0 || validHasil.length === 0) {
      errEl.style.display = 'block';
      errEl.textContent = 'Isi minimal satu bahan baku yang dipakai dan satu hasil produksi, masing-masing dengan jumlah valid.';
      return;
    }
    errEl.style.display = 'none';
    const isEdit = !!editingTxnId;

    const stockMapProd = isEdit ? computeStockExcluding(editingTxnId) : computeStock();
    const kurangBahan = [];
    validBahan.forEach(i => {
      const avail = getAvailableQty(stockMapProd, i.name);
      if (Number(i.qty) > avail) {
        kurangBahan.push(`${i.name} (stok tersisa ${avail}${i.unit ? ' '+i.unit : ''}, diminta ${i.qty})`);
      }
    });
    if (kurangBahan.length) {
      errEl.style.display = 'block';
      errEl.textContent = `Stok bahan baku tidak cukup untuk: ${kurangBahan.join('; ')}. Cek tab Stok atau catat pembelian dulu.`;
      return;
    }

    const existing = isEdit ? txns.find(x => x.id === editingTxnId) : null;
    const txn = {
      id: isEdit ? editingTxnId : uid(),
      type: 'produksi',
      kodeTransaksi: isEdit && existing ? existing.kodeTransaksi : generateTxnCode('produksi'),
      bahan: validBahan.map(i => ({ name: i.name.trim(), qty: Number(i.qty), unit: i.unit.trim(), code: (i.code||'').trim() })),
      hasil: validHasil.map(i => ({ name: i.name.trim(), qty: Number(i.qty), unit: i.unit.trim(), code: (i.code||'').trim() })),
      total: 0,
      createdAt: isEdit && existing ? existing.createdAt : Date.now(),
      createdBy: isEdit && existing ? existing.createdBy : (currentUser ? currentUser.email : null),
    };
    const btn = document.getElementById('bk-prod-save-btn');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    try {
      await saveTxn(txn);
      if (isEdit) {
        const idx = txns.findIndex(x => x.id === editingTxnId);
        if (idx >= 0) txns[idx] = txn; else txns.unshift(txn);
      } else {
        txns.unshift(txn);
      }
      const wasEdit = isEdit;
      editingTxnId = null;
      produksiFormState = { bahan: [blankProdItem()], hasil: [blankProdItem()] };
      if (wasEdit) {
        activeTab = 'riwayat';
        renderTabs(); renderBody();
      } else {
        renderProduksi();
        showToast('Produksi tercatat, stok diperbarui.');
      }
    } catch (e) {
      console.error(e);
      errEl.style.display = 'block';
      errEl.textContent = 'Gagal menyimpan produksi, coba lagi.';
      btn.disabled = false; btn.textContent = isEdit ? 'Simpan perubahan produksi' : 'Catat produksi';
    }
  }

  function svcCompletedAt(s) {
    const h = (s.history || []).slice().reverse().find(x => x.status === 'diambil');
    return (h && h.at) || s.updatedAt || s.createdAt;
  }
  function svcMonthKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function svcAvailableMonths() {
    const done = services.filter(s => s.status === 'diambil');
    const set = new Set(done.map(s => svcMonthKey(svcCompletedAt(s))));
    return Array.from(set).sort().reverse();
  }

    const hppData = computeHPP();
    const totalPendapatan = byMonth.reduce((sum,s) => sum + (Number(s.biayaFinal)||0), 0);
    const totalHppSvc = byMonth.reduce((sum,s) => sum + svcTotalHpp(s, hppData), 0);
    const totalUntungSvc = totalPendapatan - totalHppSvc;

      <div class="bk-two-col" style="margin-bottom:16px;">
        <div class="bk-field" style="margin-bottom:0;">
          <label>Bulan selesai</label>
          <select id="bk-svc-month-select" style="width:100%; border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; font-size:13.5px; font-family:'Inter',sans-serif; background:#fff;">
            <option value="semua" ${svcRiwayatMonth==='semua'?'selected':''}>Semua bulan</option>
            ${months.map(m => `<option value="${m}" ${svcRiwayatMonth===m?'selected':''}>${monthLabel(m)}</option>`).join('')}
          </select>
        </div>
        <div class="bk-field" style="margin-bottom:0;">
          <label>Cari kode service / nama pelanggan / device</label>
          <input id="bk-svc-search" value="${escapeAttr(svcSearchQuery)}" placeholder="Contoh: SVC-ABC123 / Budi / Asus A455L" />
        </div>
      </div>
      <div class="bk-stats" style="margin-bottom:16px;">
        <div class="bk-stat"><div class="lbl">Service selesai ${svcRiwayatMonth==='semua'?'(semua waktu)':('&middot; '+monthLabel(svcRiwayatMonth))}</div><div class="val" id="bk-svc-riwayat-count">${byMonth.length}</div></div>
        <div class="bk-stat in"><div class="lbl">Total Jasa Service ke Konsumen</div><div class="val" id="bk-svc-riwayat-total">${rupiah(totalPendapatan)}</div></div>
        <div class="bk-stat out"><div class="lbl">Total HPP (Sparepart + Vendor)</div><div class="val">${rupiah(totalHppSvc)}</div></div>
        <div class="bk-stat in" style="border-width:2px; border-color:${totalUntungSvc>=0?'var(--money-in)':'var(--money-out)'};"><div class="lbl">Total Keuntungan Service</div><div class="val" style="color:${totalUntungSvc>=0?'var(--money-in)':'var(--money-out)'};">${rupiah(totalUntungSvc)}</div></div>
      </div>
      <div id="bk-svc-select-bar-wrap">${filtered.length ? `<div class="bk-select-bar">
        <label class="bk-select-all">
          <input type="checkbox" id="bk-svc-select-all" ${filtered.every(s=>selectedSvcIds.has(s.id)) ? 'checked' : ''} />
          Pilih semua (${filtered.length})
        </label>
        <button class="bk-btn bk-bulk-del ${selectedSvcIds.size ? 'show' : ''}" id="bk-svc-bulk-del-btn">Hapus terpilih (${selectedSvcIds.size})</button>
      </div>` : ''}</div>
      <div id="bk-svc-list">${filtered.length ? filtered.map((s, idx) => serviceCardHtml(s, idx, hppData)).join('') : '<div class="bk-empty">Belum ada riwayat service pada filter ini.</div>'}</div>
    `;
  }

    const done = services.filter(s => s.status === 'diambil').sort((a,b) => svcCompletedAt(b) - svcCompletedAt(a));
    const byMonth = done.filter(s => svcRiwayatMonth === 'semua' ? true : svcMonthKey(svcCompletedAt(s)) === svcRiwayatMonth);

  async function runQuickAiService() {
    const input = document.getElementById('bk-svc-quick-input');
    const btn = document.getElementById('bk-svc-quick-btn');
    const text = input.value.trim();
    if (!text) { input.placeholder = 'Tulis dulu deskripsi service-nya...'; input.focus(); return; }
    btn.disabled = true; btn.textContent = 'Memproses...';
    try {
      const prompt = `Ubah teks berikut menjadi data service laptop terstruktur.\nTeks: "${text}"\nFormat JSON object: {"customerName":"nama pelanggan atau string kosong jika tidak disebut","customerPhone":"nomor whatsapp atau string kosong jika tidak disebut","device":"merk/tipe laptop atau string kosong jika tidak disebut","complaint":"keluhan/kerusakan yang disebutkan","accessories":"kelengkapan yang dititipkan atau string kosong jika tidak disebut","estimasiBiaya": angka perkiraan biaya dalam rupiah, 0 jika tidak disebut}\nBalas HANYA dengan JSON object valid, tanpa teks lain, tanpa markdown code fence.`;
      const raw = await callClaudeAI(prompt);
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      if (parsed.customerName) serviceFormState.customerName = parsed.customerName;
      if (parsed.customerPhone) serviceFormState.customerPhone = parsed.customerPhone;
      if (parsed.device) serviceFormState.device = parsed.device;
      if (parsed.complaint) serviceFormState.complaint = parsed.complaint;
      if (parsed.accessories) serviceFormState.accessories = parsed.accessories;
      if (parsed.estimasiBiaya) serviceFormState.estimasiBiaya = parsed.estimasiBiaya;
      input.value = '';
      renderService();
    } catch (e) {
      console.error(e);
      const err = document.getElementById('bk-svc-form-err');
      if (err) { err.style.display = 'block'; err.textContent = e.friendly || 'AI tidak bisa membaca teks itu, coba tulis ulang atau isi manual.'; }
      btn.disabled = false; btn.textContent = 'Isi otomatis (AI)';
    }
  }

        <div class="bk-field" style="margin-bottom:8px;">
          <input id="bk-tagihan-ket" value="${escapeAttr(manualTagihanFormState.keterangan)}" placeholder="Keterangan tagihan (mis: biaya tambahan sparepart, titipan barang, dll)" style="width:100%; border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13.5px;" />
        </div>

          <select id="bk-tagihan-rekening" style="width:100%; border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13.5px; font-family:'Inter',sans-serif; background:#fff;">

  function wireServiceTagihanEvents() {
    document.getElementById('bk-tagihan-link-svc').addEventListener('change', e => {
      const svcId = e.target.value;
      manualTagihanFormState.linkedServiceId = svcId;
      if (svcId) {
        const s = services.find(x => x.id === svcId);
        if (s) {
          manualTagihanFormState.customerName = s.customerName || '';
          manualTagihanFormState.customerPhone = s.customerPhone || '';
        }
      }
      renderService();
    });
    document.getElementById('bk-tagihan-nama').addEventListener('input', e => manualTagihanFormState.customerName = e.target.value);
    document.getElementById('bk-tagihan-hp').addEventListener('input', e => manualTagihanFormState.customerPhone = e.target.value);
    document.getElementById('bk-tagihan-ket').addEventListener('input', e => manualTagihanFormState.keterangan = e.target.value);
    document.getElementById('bk-tagihan-nominal').addEventListener('input', e => manualTagihanFormState.nominal = e.target.value);
    document.getElementById('bk-tagihan-rekening').addEventListener('change', e => manualTagihanFormState.rekening = e.target.value);
    document.getElementById('bk-tagihan-save').addEventListener('click', async () => {
      const errEl = document.getElementById('bk-tagihan-err');
      const nama = manualTagihanFormState.customerName.trim();
      const nominal = Number(manualTagihanFormState.nominal) || 0;
      if (!nama || nominal <= 0) {
        errEl.style.display = 'block';
        errEl.textContent = 'Isi nama pelanggan dan nominal tagihan yang valid.';
        return;
      }
      errEl.style.display = 'none';
      const linkedSvc = manualTagihanFormState.linkedServiceId ? services.find(x => x.id === manualTagihanFormState.linkedServiceId) : null;
      const m = {
        id: uid(),
        kodeTagihan: generateTagihanCode(),
        customerName: nama,
        customerPhone: manualTagihanFormState.customerPhone.trim(),
        keterangan: manualTagihanFormState.keterangan.trim(),
        nominal,
        rekening: manualTagihanFormState.rekening,
        paid: false,
        linkedServiceId: linkedSvc ? linkedSvc.id : null,
        linkedServiceKode: linkedSvc ? (linkedSvc.kodeService || null) : null,
        createdAt: Date.now(),
        createdBy: currentUser ? currentUser.email : null,
      };
      try {
        await saveManualTagihanItem(m);
        manualTagihan.unshift(m);
        manualTagihanFormState = blankManualTagihanForm();
        renderService();
        showToast('Tagihan manual dibuat.');
      } catch (e) {
        console.error(e);
        errEl.style.display = 'block';
        errEl.textContent = 'Gagal menyimpan tagihan, coba lagi.';
      }
    });
    bodyEl.querySelectorAll('.svc-tagihan-lunas').forEach(b => b.addEventListener('click', () => markServiceLunas(b.dataset.id)));
    bodyEl.querySelectorAll('.svc-tagihan-invoice').forEach(b => b.addEventListener('click', () => {
      const s = services.find(x => x.id === b.dataset.id);
      if (s) downloadInvoicePdf(serviceToInvoiceData(s));
    }));
    bodyEl.querySelectorAll('.svc-tagihan-wa').forEach(b => b.addEventListener('click', () => remindServiceTagihanWhatsapp(b.dataset.id)));
    wireManualTagihanActions(bodyEl, renderService);
  }

  function wireManualTagihanActions(scopeEl, refreshFn) {
    scopeEl.querySelectorAll('.manual-tagihan-lunas').forEach(b => b.addEventListener('click', () => markManualTagihanLunas(b.dataset.id, refreshFn)));
    scopeEl.querySelectorAll('.manual-tagihan-invoice').forEach(b => b.addEventListener('click', () => {
      const m = manualTagihan.find(x => x.id === b.dataset.id);
      if (m) downloadInvoicePdf(manualToInvoiceData(m));
    }));
    scopeEl.querySelectorAll('.manual-tagihan-wa').forEach(b => b.addEventListener('click', () => remindManualTagihanWhatsapp(b.dataset.id)));
    scopeEl.querySelectorAll('.manual-tagihan-hapus').forEach(b => b.addEventListener('click', () => {
      if (!requireOwnerForDelete()) return;
      const id = b.dataset.id;
      showConfirm('Hapus tagihan manual ini?', async () => {
        showLoadingModal('Menghapus tagihan...');
        try {
          const m = manualTagihan.find(x => x.id === id);
          if (m) await logToTrash('tagihan', `${m.namaPelanggan || m.customerName || 'Tanpa nama'} - ${rupiah(m.nominal||0)}`, m);
          trashEntriesCache = null;
          await deleteManualTagihanFromStore(id);
          manualTagihan = manualTagihan.filter(x => x.id !== id);
          closeLoadingModal();
          refreshFn();
          showToast('Tagihan manual dihapus.');
        } catch (e) { console.error(e); closeLoadingModal(); showToast('Gagal menghapus, coba lagi.'); }
      });
    }));
  }

  async function markServiceLunas(serviceId) {
    const s = services.find(x => x.id === serviceId);
    if (!s || !s.linkedTxnId) return;
    const t = txns.find(x => x.id === s.linkedTxnId);
    try {
      if (t) { t.paid = true; await saveTxn(t); }
      s.paid = true;
      await saveService(s);
      renderService();
      showToast('Tagihan service ditandai lunas.');
    } catch (e) {
      console.error(e);
      showToast('Gagal memperbarui status, coba lagi.');
    }
  }

  async function markManualTagihanLunas(id, refreshFn) {
    const m = manualTagihan.find(x => x.id === id);
    if (!m) return;
    try {
      m.paid = true;
      await saveManualTagihanItem(m);
      (refreshFn || renderService)();
      showToast('Tagihan manual ditandai lunas.');
    } catch (e) {
      console.error(e);
      showToast('Gagal memperbarui status, coba lagi.');
    }
  }

  function remindServiceTagihanWhatsapp(serviceId) {
    const s = services.find(x => x.id === serviceId);
    if (!s) return;
    const sisa = Math.max(0, (Number(s.biayaFinal)||0) - (Number(s.dpAmount)||0));
    const phoneRaw = (s.customerPhone || '').replace(/[^0-9]/g, '');
    const phone = phoneRaw.startsWith('0') ? '62' + phoneRaw.slice(1) : phoneRaw;
    const storeName = document.getElementById('bk-storename').value || 'Toko Saya';
    const acc = BANK_ACCOUNTS.find(a => a.id === s.rekening) || BANK_ACCOUNTS[0];
    const kodeRef = s.kodeService ? ` (Kode: ${s.kodeService})` : '';
    const msg = `Halo ${s.customerName}, mengingatkan tagihan service laptop ${s.device}${kodeRef} di ${storeName} sebesar ${rupiah(sisa)} masih belum lunas. Transfer ke ${acc.label} ${acc.nomor} ya, terima kasih! (Invoice PDF terlampir, mohon dicek folder Download / File Manager, lalu lampirkan manual di sini).`;
    const url = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
    downloadInvoicePdf(serviceToInvoiceData(s));
    showToast('Invoice PDF terunduh. Lampirkan manual di chat WhatsApp yang baru dibuka (tekan ikon klip 📎).');
    window.open(url, '_blank');
  }

  function remindManualTagihanWhatsapp(id) {
    const m = manualTagihan.find(x => x.id === id);
    if (!m) return;
    const phoneRaw = (m.customerPhone || '').replace(/[^0-9]/g, '');
    const phone = phoneRaw.startsWith('0') ? '62' + phoneRaw.slice(1) : phoneRaw;
    const storeName = document.getElementById('bk-storename').value || 'Toko Saya';
    const acc = BANK_ACCOUNTS.find(a => a.id === m.rekening) || BANK_ACCOUNTS[0];
    const msg = `Halo ${m.customerName}, mengingatkan tagihan (${m.kodeTagihan}) di ${storeName}${m.keterangan ? ' untuk ' + m.keterangan : ''} sebesar ${rupiah(m.nominal)} masih belum lunas. Transfer ke ${acc.label} ${acc.nomor} ya, terima kasih! (Invoice PDF terlampir, mohon dicek folder Download / File Manager, lalu lampirkan manual di sini).`;
    const url = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
    downloadInvoicePdf(manualToInvoiceData(m));
    showToast('Invoice PDF terunduh. Lampirkan manual di chat WhatsApp yang baru dibuka (tekan ikon klip 📎).');
    window.open(url, '_blank');
  }

  function downloadInvoicePdf(inv) {
    if (!window.jspdf) { showToast('Modul PDF belum siap, coba lagi sebentar.'); return; }
    const { jsPDF } = window.jspdf;
    // Ukuran kertas kontinu dot matrix: 9.5 x 5.5 inch - lebar 9.5" standar baku, panjang 5.5" umum untuk nota/invoice.
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [139.7, 241.3] });
    const pageW = 241.3;
    const storeName = document.getElementById('bk-storename').value || 'Toko Saya';
    const acc = BANK_ACCOUNTS.find(a => a.id === inv.rekening) || BANK_ACCOUNTS[0];
    const sisa = Math.max(0, inv.biaya - inv.dp);
    const marginL = 12, marginR = pageW - 12;
    let y = 12;

    doc.setFont('courier', 'normal'); doc.setFontSize(7); doc.setTextColor(140);
    doc.text('Invoice Tagihan - ' + storeName, marginL, 7);
    doc.text(new Date().toLocaleString('id-ID'), marginR, 7, { align: 'right' });
    doc.setTextColor(20);

    doc.setFont('courier', 'bold'); doc.setFontSize(14);
    doc.text(storeName, pageW/2, y, { align: 'center' }); y += 6;
    doc.setFontSize(10); doc.setTextColor(160, 60, 50);
    doc.text('INVOICE TAGIHAN', pageW/2, y, { align: 'center' }); y += 4.5;
    doc.setTextColor(20);
    doc.setFont('courier', 'normal'); doc.setFontSize(8.5);
    doc.text('Belum Lunas', pageW/2, y, { align: 'center' }); y += 6;

    doc.setDrawColor(120); doc.line(marginL, y, marginR, y); y += 5;

    doc.setFont('courier', 'normal'); doc.setFontSize(8.5);
    const infoRows = [
      ['Kode', inv.kode || '-'],
      ['Tanggal invoice', new Date().toLocaleDateString('id-ID')],
      ['Pelanggan', inv.customerName || '-'],
      ['No. HP', inv.customerPhone || '-'],
      [inv.subjectLabel, inv.subjectValue],
    ];
    if (inv.extraLabel) infoRows.push([inv.extraLabel, inv.extraValue]);
    infoRows.forEach(([label, val]) => {
      doc.setFont('courier', 'bold'); doc.text(label + ':', marginL, y);
      doc.setFont('courier', 'normal');
      const wrapped = doc.splitTextToSize(String(val), marginR - marginL - 50);
      doc.text(wrapped, marginL + 50, y);
      y += 4.0 * Math.max(1, wrapped.length);
    });
    y += 2.5;
    doc.line(marginL, y, marginR, y); y += 5;

    doc.setFont('courier', 'bold'); doc.setFontSize(9.5);
    doc.text('Rincian Biaya', marginL, y); y += 5;
    doc.setFont('courier', 'normal'); doc.setFontSize(8.5);
    doc.text('Biaya', marginL, y); doc.text(rupiah(inv.biaya), marginR, y, { align: 'right' }); y += 4.2;
    if (inv.dp > 0) {
      doc.text('Uang muka (DP) sudah dibayar', marginL, y); doc.text('- ' + rupiah(inv.dp), marginR, y, { align: 'right' }); y += 4.2;
    }
    doc.line(marginL + 70, y, marginR, y); y += 4;

    doc.setFillColor(245, 233, 231);
    doc.rect(marginL, y - 4.5, marginR - marginL, 9, 'F');
    doc.setFont('courier', 'bold'); doc.setFontSize(10); doc.setTextColor(160, 60, 50);
    doc.text('SISA TAGIHAN', marginL + 3, y + 1);
    doc.text(rupiah(sisa), marginR - 3, y + 1, { align: 'right' });
    doc.setTextColor(20);
    y += 11;

    doc.setFont('courier', 'bold'); doc.setFontSize(8.5);
    doc.text('Pembayaran transfer ke:', marginL, y); y += 4.5;
    doc.setFont('courier', 'normal');
    doc.text(`${acc.label} - ${acc.nomor}`, marginL, y); y += 5.5;

    doc.setFont('courier', 'normal'); doc.setFontSize(7.5); doc.setTextColor(120);
    doc.text('Mohon segera melunasi tagihan di atas. Terima kasih atas kepercayaan Anda.', marginL, y, { maxWidth: marginR - marginL }); y += 6;
    doc.setTextColor(20);

    const sigY = y;
    doc.setFont('courier', 'normal'); doc.setFontSize(8.5);
    doc.text(storeName, marginL + 20, sigY, { align: 'center' });
    doc.line(marginL, sigY + 10, marginL + 40, sigY + 10);
    doc.text('Kasir', marginL + 20, sigY + 13.5, { align: 'center' });

    doc.setFont('courier', 'normal'); doc.setFontSize(6); doc.setTextColor(150);
    doc.text(`Dicetak otomatis oleh sistem ${storeName}`, pageW / 2, sigY + 18, { align: 'center' });

    doc.save(`invoice-tagihan-${(inv.kode || uid().slice(0,8)).replace(/\s+/g,'_')}.pdf`);
  }

  async function saveNewService() {
    const errEl = document.getElementById('bk-svc-form-err');
    const name = serviceFormState.customerName.trim();
    const device = serviceFormState.device.trim();
    const complaint = serviceFormState.complaint.trim();
    if (!name || !device || !complaint) {
      errEl.style.display = 'block';
      errEl.textContent = 'Isi minimal nama pelanggan, merk/tipe laptop, dan keluhan.';
      return;
    }
    errEl.style.display = 'none';
    const chosenKode = (serviceFormState.kodeService || '').trim();
    const btn = document.getElementById('bk-svc-save-btn');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    try {
      // Muat ulang data service dari server dulu (bukan cache lokal) supaya kode yang dipilih
      // tidak bentrok kalau ada admin/perangkat lain yang barusan membuat service dengan kode yang sama.
      await loadServices();
      const usedCodes = new Set(services.map(x => (x.kodeService || '').trim().toUpperCase()));
      let kodeFinal = chosenKode;
      if (!kodeFinal || usedCodes.has(kodeFinal.toUpperCase())) {
        kodeFinal = generateServiceCode(); // otomatis dihitung ulang dari data server yang sudah terbaru
      }
      const s = {
        id: uid(),
        kodeService: kodeFinal,
        customerName: name,
        customerPhone: serviceFormState.customerPhone.trim(),
        device,
        complaint,
        accessories: serviceFormState.accessories.trim(),
        estimasiBiaya: Number(serviceFormState.estimasiBiaya) || 0,
        rekening: serviceFormState.rekening || BANK_ACCOUNTS[0].id,
        catatanDiagnosa: '',
        biayaFinal: 0,
        dpAmount: 0,
        dpTxnId: null,
        paid: true,
        status: 'diterima',
        linkedTxnId: null,
        createdAt: Date.now(),
        createdBy: currentUser ? currentUser.email : null,
        updatedAt: Date.now(),
        history: [{ status: 'diterima', at: Date.now() }],
      };
      await saveService(s);
      services.unshift(s);
      serviceFormState = blankServiceForm();
      clearDraft('service');
      renderService();
      showServiceReceivedPrompt(s);
    } catch (e) {
      console.error(e);
      errEl.style.display = 'block';
      errEl.textContent = 'Gagal menyimpan data service, coba lagi.';
      btn.disabled = false; btn.textContent = 'Terima service masuk';
    }
  }

  // Total HPP untuk satu order service = biaya sparepart yang dipakai (dari produksi txn, dihitung
  // otomatis via HPP rata-rata bergerak) + biaya jasa vendor/pihak ke-3 (kalau ada).
  function svcTotalHpp(s, hppData) {
    const sparepartCost = (s.prodTxnId && hppData.prodCostByTxn[s.prodTxnId]) ? hppData.prodCostByTxn[s.prodTxnId].batchCost : 0;
    const vendorCost = Number(s.vendorBiaya) || 0;
    return sparepartCost + vendorCost;
  }

  // Kotak ringkasan untung per order service: Jasa ke konsumen, HPP (sparepart+vendor), Keuntungan.
  // Hanya ditampilkan untuk service yang sudah ada biaya final-nya (status selesai/diambil).
  function svcProfitBreakdownHtml(s, hppData) {
    if (!hppData || !(Number(s.biayaFinal) > 0)) return '';
    const sparepartCost = (s.prodTxnId && hppData.prodCostByTxn[s.prodTxnId]) ? hppData.prodCostByTxn[s.prodTxnId].batchCost : 0;
    const vendorCost = Number(s.vendorBiaya) || 0;
    const hppTotalSvc = sparepartCost + vendorCost;
    const untung = (Number(s.biayaFinal) || 0) - hppTotalSvc;
    return `<div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin:10px 0; padding:8px 10px; background:var(--paper); border:1px solid var(--line); border-radius:8px;">
      <div><div style="font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;">Jasa ke Konsumen</div><div style="font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px;">${rupiah(s.biayaFinal)}</div></div>
      <div><div style="font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;">HPP (Sparepart+Vendor)</div><div style="font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; color:var(--ink-soft);">${rupiah(hppTotalSvc)}</div></div>
      <div><div style="font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;">Keuntungan</div><div style="font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; color:${untung>=0?'var(--money-in)':'var(--money-out)'};">${rupiah(untung)}</div></div>
    </div>`;
  }
