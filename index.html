<script>
// ====== KONFIGURASI SUPABASE (WAJIB DIISI SEBELUM DEPLOY) ======
// Ambil dari Supabase Dashboard > Project Settings > API
const SUPABASE_URL = 'https://gdhtrwisuiaqpekieqvx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkaHRyd2lzdWlhcXBla2llcXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTAxNjQsImV4cCI6MjEwMjg2NjE2NH0.VGTFpLmcfwbegGCIooYnQ1SWVKfVooXbMXTTbWIS8-c';

// ====== KONFIGURASI FITUR AI (OPSIONAL) ======
// Kosongkan jika tidak memakai fitur AI (Isi otomatis & Analisis AI).
// Isi dengan URL Supabase Edge Function proxy (lihat README.md), JANGAN pernah
// menaruh API key Anthropic langsung di sini karena file ini bersifat publik.
const AI_PROXY_URL = '';

const SUPABASE_CONFIGURED = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith('GANTI_');

let sbClient = null;
if (SUPABASE_CONFIGURED) {
  sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

// Shim agar seluruh kode aplikasi (yang aslinya ditulis untuk window.storage milik Claude)
// tetap jalan tanpa perlu diubah, cukup dialihkan ke tabel kv_store di Supabase.
window.storage = {
  async get(key) {
    const { data, error } = await sbClient.from('kv_store').select('value').eq('key', key).maybeSingle();
    if (error) throw error;
    if (!data) throw new Error('key not found: ' + key);
    return { key, value: data.value, shared: true };
  },
  async set(key, value) {
    const { error } = await sbClient.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
    if (error) throw error;
    return { key, value, shared: true };
  },
  async delete(key) {
    const { error } = await sbClient.from('kv_store').delete().eq('key', key);
    if (error) throw error;
    return { key, deleted: true, shared: true };
  },
  async list(prefix) {
    let q = sbClient.from('kv_store').select('key');
    if (prefix) q = q.like('key', `${prefix}%`);
    const { data, error } = await q;
    if (error) throw error;
    return { keys: (data || []).map(r => r.key), prefix, shared: true };
  },
};
</script>

    { id: 'riwayat', label: 'Riwayat' },
  ];

  function monthKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function monthLabel(key) {
    if (key === 'semua') return 'Semua bulan';
    const [y,m] = key.split('-').map(Number);
    return new Date(y, m-1, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  }
  function availableMonths() {
    const set = new Set(txns.map(t => monthKey(t.createdAt)));
    return Array.from(set).sort().reverse();
  }

  function rupiah(n) {
    n = Number(n) || 0;
    return 'Rp' + n.toLocaleString('id-ID');
  }
  function uid() {
    return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
  }

  async function loadStoreName() {
    try {
      const r = await window.storage.get('profil-toko', true);
      if (r && r.value) document.getElementById('bk-storename').value = r.value;
    } catch (e) { /* no profile saved yet */ }
  }
  document.getElementById('bk-storename').addEventListener('change', async (e) => {
    try { await window.storage.set('profil-toko', e.target.value, true); } catch (err) { console.error(err); }
  });

  async function loadTxns() {
    txns = [];
    try {
      const listRes = await window.storage.list('txn:', true);
      const keys = (listRes && listRes.keys) || [];
      for (const k of keys) {
        try {
          const r = await window.storage.get(k, true);
          if (r && r.value) txns.push(JSON.parse(r.value));
        } catch (e) { /* skip unreadable entry */ }
      }
      txns.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    } catch (e) { console.error('Gagal memuat transaksi', e); }
  }
  async function saveTxn(t) {
    await window.storage.set('txn:' + t.id, JSON.stringify(t), true);
  }
  async function deleteTxnFromStore(id) {
    await window.storage.delete('txn:' + id, true);
  }

  function renderTabs() {
    tabsEl.innerHTML = TABS.map(t =>
      `<div class="bk-tab ${activeTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</div>`
    ).join('');
    tabsEl.querySelectorAll('.bk-tab').forEach(el => {
      el.addEventListener('click', () => {
        activeTab = el.dataset.tab;
        if (activeTab !== 'riwayat') selectedTxnIds.clear();
        renderBody(); renderTabs();
      });
    });
  }

  function totals() {
    let masuk = 0, keluar = 0;
    txns.forEach(t => {
      if (t.type === 'penjualan') masuk += t.total;
      else if (t.type === 'pembelian') keluar += t.total;
      // transaksi produksi tidak memengaruhi saldo, hanya memindahkan stok
    });
    return { masuk, keluar, saldo: masuk - keluar };
  }

  function renderBody() {
    if (activeTab === 'dashboard') return renderDashboard();
    if (activeTab === 'pembelian') return renderForm('pembelian');
    if (activeTab === 'penjualan') return renderForm('penjualan');
    if (activeTab === 'stok') return renderStok();
    if (activeTab === 'produksi') return renderProduksi();
    if (activeTab === 'piutang') return renderPiutang();
    if (activeTab === 'riwayat') return renderRiwayat();
  }

  async function callClaudeAI(prompt) {
    if (!AI_PROXY_URL) {
      const err = new Error('AI_PROXY_NOT_CONFIGURED');
      err.friendly = 'Fitur AI belum diatur. Lihat README.md bagian "Mengaktifkan fitur AI" untuk memasang proxy amannya.';
      throw err;
    }
    const res = await fetch(AI_PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) throw new Error('AI proxy error: ' + res.status);
    const data = await res.json();
    return (data.content || []).map(c => c.text || '').join('\n').trim();
  }

  async function runAiInsight() {
    const btn = document.getElementById('bk-ai-btn');
    const out = document.getElementById('bk-ai-out');
    btn.disabled = true; btn.textContent = 'Menganalisis...';
    out.textContent = 'Sedang menganalisis transaksi...';
    try {
      const t = totals();
      const last = txns.slice(0, 15).map(x => {
        if (x.type === 'produksi') return `produksi | ${summarizeProduksi(x).replace(/&rarr;/, '->')}`;
        return `${x.type} | ${x.items.map(i=>i.name+' x'+i.qty).join(', ')} | total ${x.total}`;
      }).join('\n');
      const prompt = `Data keuangan UMKM:\nTotal pemasukan: ${t.masuk}\nTotal pengeluaran: ${t.keluar}\nSaldo: ${t.saldo}\n15 transaksi terakhir:\n${last || '(belum ada transaksi)'}\n\nBerikan maksimal 3 poin analisis singkat dan actionable dalam Bahasa Indonesia (bahan baku yang sering dibeli, produk yang laku, atau saran arus kas). Setiap poin maksimal 1 kalimat. Jangan pakai markdown, cukup teks biasa dengan baris baru per poin, awali tiap poin dengan tanda "-".`;
      const text = await callClaudeAI(prompt);
      out.textContent = text || 'Belum cukup data untuk dianalisis.';
    } catch (e) {
      out.textContent = e.friendly || 'Gagal memuat analisis. Coba lagi.';
      console.error(e);
    } finally {
      btn.disabled = false; btn.textContent = 'Buat analisis';
    }
  }

  let formState = {

  function renderForm(type) {
    const st = formState[type];
    const isJual = type === 'penjualan';
    const isEdit = !!editingTxnId;
    const total = st.items.reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);

    bodyEl.innerHTML = `
      ${itemNamesDatalistHtml()}
      ${isEdit ? `<div class="bk-cancel-edit" id="bk-cancel-edit">&larr; Batal edit, kembali ke riwayat</div>` : ''}
      ${!isEdit ? `<div class="bk-quickai">

        <button class="bk-btn accent" id="bk-quick-btn">Isi otomatis (AI)</button>
      </div>` : ''}
      <div class="bk-field">
        <label>${isJual ? 'Nama pembeli (opsional)' : 'Nama supplier (opsional)'}</label>

      </div>

        <label>No. WhatsApp pembeli (untuk kirim resi)</label>
        <input id="bk-phone" value="${escapeAttr(st.phone)}" placeholder="Contoh: 081234567890" />
      </div>` : ''}
      <div class="bk-item-head"><div>Nama item</div><div>Jumlah</div><div>Satuan</div><div>Harga satuan</div><div></div></div>
      <div id="bk-items">${st.items.map(itemRowHtml).join('')}</div>
      <button class="bk-btn ghost" id="bk-add-item" style="margin-bottom:8px;">+ Tambah item</button>
      <div class="bk-total-line">
        <div class="t-lbl">Total ${isJual ? 'penjualan' : 'pembelian'}</div>
        <div class="t-val">${rupiah(total)}</div>
      </div>
      ${isJual ? `<div class="bk-checkbox-row">
        <input type="checkbox" id="bk-paid" ${st.paid !== false ? 'checked' : ''} />

      </div>` : ''}
      <div id="bk-form-err" class="bk-err" style="display:none;"></div>
      ${isEdit ? `
        <button class="bk-btn primary" id="bk-save-btn">Simpan perubahan</button>
      ` : isJual ? `
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="bk-btn primary" id="bk-save-btn" style="flex:1; min-width:180px;">Simpan &amp; buat resi</button>
          <button class="bk-btn ghost" id="bk-save-noresi-btn" style="flex:1; min-width:180px;">Simpan tanpa resi (pencatatan saja)</button>
        </div>
      ` : `
        <button class="bk-btn primary" id="bk-save-btn">Simpan pembelian</button>
      `}
    `;

    if (isEdit) document.getElementById('bk-cancel-edit').addEventListener('click', () => {
      editingTxnId = null;
      formState[type] = type === 'penjualan'
        ? { items: [blankItem()], party: '', phone: '', paid: true, note: '' }
        : { items: [blankItem()], party: '', note: '' };
      activeTab = 'riwayat';
      renderTabs(); renderBody();
    });

    document.getElementById('bk-party').addEventListener('input', e => st.party = e.target.value);
    if (isJual) {
      document.getElementById('bk-phone').addEventListener('input', e => st.phone = e.target.value);
      document.getElementById('bk-paid').addEventListener('change', e => st.paid = e.target.checked);
    }

      st.items.push(blankItem());
      renderForm(type);
    });

    document.getElementById('bk-items').querySelectorAll('.bk-item-row').forEach(row => {
      const id = row.dataset.id;
      const item = st.items.find(i => i.id === id);
      row.querySelector('.f-name').addEventListener('input', e => item.name = e.target.value);
      row.querySelector('.f-qty').addEventListener('input', e => { item.qty = e.target.value; refreshTotal(type); });

  function getKnownItemNames() {
    const set = new Set();
    txns.forEach(t => {
      if (t.type === 'pembelian' || t.type === 'penjualan') {
        (t.items || []).forEach(i => { if (i.name) set.add(i.name.trim()); });
      } else if (t.type === 'produksi') {
        (t.bahan || []).forEach(i => { if (i.name) set.add(i.name.trim()); });
        (t.hasil || []).forEach(i => { if (i.name) set.add(i.name.trim()); });
      }
    });
    return Array.from(set).sort();
  }
  function itemNamesDatalistHtml() {
    return `<datalist id="bk-item-names">${getKnownItemNames().map(n => `<option value="${escapeAttr(n)}"></option>`).join('')}</datalist>`;
  }

  function itemRowHtml(item) {
    return `<div class="bk-item-row" data-id="${item.id}">
      <input class="f-name" value="${escapeAttr(item.name)}" placeholder="Nama item" list="bk-item-names" />
      <input class="f-qty" type="number" min="0" value="${escapeAttr(item.qty)}" placeholder="0" />
      <input class="f-unit" value="${escapeAttr(item.unit||'')}" placeholder="pcs/kg" />

  function refreshTotal(type) {
    const st = formState[type];
    const total = st.items.reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);
    const tv = bodyEl.querySelector('.t-val');
    if (tv) tv.textContent = rupiah(total);

  function escapeAttr(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  async function runQuickAi(type) {
    const input = document.getElementById('bk-quick-input');
    const btn = document.getElementById('bk-quick-btn');
    const text = input.value.trim();
    if (!text) { input.placeholder = 'Tulis dulu deskripsi transaksinya...'; input.focus(); return; }
    btn.disabled = true; btn.textContent = 'Memproses...';
    try {
      const schemaNote = type === 'penjualan'
        ? 'Format JSON: [{"name":"nama produk","qty":angka,"price":harga satuan dalam rupiah}]'
        : 'Format JSON: [{"name":"nama bahan","qty":angka,"unit":"satuan seperti kg/pcs/liter","price":harga satuan dalam rupiah}]';
      const prompt = `Ubah teks transaksi berikut menjadi data terstruktur.\nTeks: "${text}"\n${schemaNote}\nBalas HANYA dengan JSON array yang valid, tanpa teks lain, tanpa markdown code fence.`;
      const raw = await callClaudeAI(prompt);
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      if (Array.isArray(parsed) && parsed.length) {
        formState[type].items = parsed.map(p => ({ id: uid(), name: p.name || '', qty: p.qty ?? '', unit: p.unit || '', price: p.price ?? '' }));
        input.value = '';
      }
      renderForm(type);
    } catch (e) {
      console.error(e);
      const err = document.getElementById('bk-form-err');
      if (err) { err.style.display = 'block'; err.textContent = e.friendly || 'AI tidak bisa membaca teks itu, coba tulis ulang atau isi manual.'; }
      btn.disabled = false; btn.textContent = 'Isi otomatis (AI)';
    }
  }

  async function saveTransaction(type, withReceipt) {
    const st = formState[type];
    const errEl = document.getElementById('bk-form-err');
    const validItems = st.items.filter(i => i.name && Number(i.qty) > 0 && Number(i.price) >= 0);
    if (validItems.length === 0) {
      errEl.style.display = 'block';
      errEl.textContent = 'Isi minimal satu item dengan nama, jumlah, dan harga yang valid.';
      return;
    }
    errEl.style.display = 'none';
    const total = validItems.reduce((s,i) => s + Number(i.qty) * Number(i.price), 0);
    const isEdit = !!editingTxnId;
    const existing = isEdit ? txns.find(x => x.id === editingTxnId) : null;
    const txn = {
      id: isEdit ? editingTxnId : uid(),
      type,
      items: validItems.map(i => ({ name: i.name, qty: Number(i.qty), unit: i.unit || '', price: Number(i.price) })),
      total,
      customerName: type === 'penjualan' ? st.party : '',
      customerPhone: type === 'penjualan' ? st.phone : '',
      supplierName: type === 'pembelian' ? st.party : '',
      paid: type === 'penjualan' ? (st.paid !== false) : undefined,
      createdAt: isEdit && existing ? existing.createdAt : Date.now(),
    };
    const clickedBtnId = withReceipt === false ? 'bk-save-noresi-btn' : 'bk-save-btn';
    const saveBtn = document.getElementById(clickedBtnId) || document.getElementById('bk-save-btn');
    const otherBtn = document.getElementById(withReceipt === false ? 'bk-save-btn' : 'bk-save-noresi-btn');
    const originalLabel = saveBtn.textContent;
    saveBtn.disabled = true; saveBtn.textContent = 'Menyimpan...';
    if (otherBtn) otherBtn.disabled = true;
    try {
      await saveTxn(txn);
      if (isEdit) {
        const idx = txns.findIndex(x => x.id === editingTxnId);
        if (idx >= 0) txns[idx] = txn; else txns.unshift(txn);
      } else {
        txns.unshift(txn);
      }
      const wasEdit = isEdit;
      editingTxnId = null;
      formState[type] = type === 'penjualan'
        ? { items: [blankItem()], party: '', phone: '', paid: true, note: '' }
        : { items: [blankItem()], party: '', note: '' };
      if (wasEdit) {
        activeTab = 'riwayat';
        renderTabs(); renderBody();
      } else if (type === 'penjualan' && withReceipt !== false) {
        showReceipt(txn);
      } else if (type === 'penjualan') {

      } else {
        activeTab = 'dashboard';
        renderTabs(); renderBody();
      }
    } catch (e) {
      errEl.style.display = 'block';
      errEl.textContent = 'Gagal menyimpan transaksi. Coba lagi.';

  // ---------- STOK ----------
  function computeStock() {
    const stockMap = {};
    function addQty(name, unit, delta) {
      const key = (name || '').trim().toLowerCase();
      if (!key) return;
      if (!stockMap[key]) stockMap[key] = { name: name.trim(), unit: unit || '', qty: 0 };
      stockMap[key].qty += delta;
      if (unit) stockMap[key].unit = unit;
    }
    txns.forEach(t => {
      if (t.type === 'pembelian') {
        t.items.forEach(i => addQty(i.name, i.unit, Number(i.qty) || 0));
      } else if (t.type === 'penjualan') {
        t.items.forEach(i => addQty(i.name, i.unit, -(Number(i.qty) || 0)));
      } else if (t.type === 'produksi') {
        (t.bahan || []).forEach(i => addQty(i.name, i.unit, -(Number(i.qty) || 0)));
        (t.hasil || []).forEach(i => addQty(i.name, i.unit, Number(i.qty) || 0));
      }
    });
    return stockMap;
  }

  // ---------- HPP (Harga Pokok Penjualan) via metode rata-rata bergerak ----------
  function computeHPP() {
    const sorted = [...txns].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const avg = {}; // key -> { qty, cost } biaya kumulatif per item
    const keyOf = n => (n || '').trim().toLowerCase();

    function addStock(name, qty, cost) {
      const k = keyOf(name);
      if (!k || qty <= 0) return;
      if (!avg[k]) avg[k] = { name: (name || '').trim(), qty: 0, cost: 0 };
      avg[k].qty += qty;
      avg[k].cost += cost;
    }
    function unitCostOf(name) {
      const k = keyOf(name);
      const r = avg[k];
      return (r && r.qty > 0) ? r.cost / r.qty : 0;
    }
    function removeStock(name, qty) {
      const k = keyOf(name);
      const r = avg[k];
      const uc = unitCostOf(name);
      if (r) {
        r.qty -= qty;
        r.cost -= qty * uc;
        if (r.qty < 0.0000001) { r.qty = 0; r.cost = 0; }
      }
      return uc;
    }

    const hppByTxn = {};
    const prodCostByTxn = {};
    let totalRevenue = 0, totalHPP = 0;

    sorted.forEach(t => {
      if (t.type === 'pembelian') {
        t.items.forEach(i => addStock(i.name, Number(i.qty) || 0, (Number(i.qty) || 0) * (Number(i.price) || 0)));
      } else if (t.type === 'produksi') {
        let batchCost = 0;
        (t.bahan || []).forEach(i => {
          const qty = Number(i.qty) || 0;
          batchCost += qty * removeStock(i.name, qty);
        });
        const totalHasilQty = (t.hasil || []).reduce((s, i) => s + (Number(i.qty) || 0), 0) || 1;
        const hasilDetail = [];
        (t.hasil || []).forEach(i => {
          const qty = Number(i.qty) || 0;
          const allocCost = batchCost * (qty / totalHasilQty);
          addStock(i.name, qty, allocCost);
          hasilDetail.push({ name: i.name, qty, unit: i.unit || '', allocCost, unitCost: qty > 0 ? allocCost / qty : 0 });
        });
        prodCostByTxn[t.id] = { batchCost, hasil: hasilDetail };
      } else if (t.type === 'penjualan') {
        let txnHpp = 0;
        t.items.forEach(i => {
          const qty = Number(i.qty) || 0;
          txnHpp += qty * removeStock(i.name, qty);
        });
        hppByTxn[t.id] = txnHpp;
        totalHPP += txnHpp;
        totalRevenue += t.total;
      }
    });

    return { hppByTxn, prodCostByTxn, totalHPP, totalRevenue, labaKotor: totalRevenue - totalHPP, getCurrentUnitCost: unitCostOf };
  }

  function blankProdItem() { return { id: uid(), name: '', qty: '', unit: '' }; }
  let produksiFormState = { bahan: [blankProdItem()], hasil: [blankProdItem()] };

  function renderProdEstimateHtml() {
    const hppNow = computeHPP();
    const validBahan = produksiFormState.bahan.filter(i => i.name && Number(i.qty) > 0);
    const validHasil = produksiFormState.hasil.filter(i => i.name && Number(i.qty) > 0);
    const estBatchCost = validBahan.reduce((s,i) => s + Number(i.qty) * hppNow.getCurrentUnitCost(i.name), 0);
    const totalHasilQty = validHasil.reduce((s,i) => s + Number(i.qty), 0) || 1;
    if (!validBahan.length) {
      return '<div class="bk-stok-note" style="margin:0;">Isi bahan baku untuk melihat estimasi HPP.</div>';
    }
    const bahanLines = validBahan.map(i => {
      const uc = hppNow.getCurrentUnitCost(i.name);
      return `${i.name}: ${rupiah(Number(i.qty) * uc)} <span style="color:var(--ink-soft);">(${rupiah(uc)}/${i.unit || 'satuan'})</span>`;
    }).join('<br/>');
    const hasilLines = validHasil.length ? validHasil.map(i => {
      const allocCost = estBatchCost * (Number(i.qty) / totalHasilQty);
      const uc = Number(i.qty) > 0 ? allocCost / Number(i.qty) : 0;
      return `${i.name}: <strong>${rupiah(uc)}</strong> / ${i.unit || 'satuan'}`;
    }).join('<br/>') : '<span style="color:var(--ink-soft);">Isi hasil produksi untuk lihat HPP per satuan.</span>';
    return `
      <div style="font-size:12.5px; line-height:1.7;">
        <div style="color:var(--ink-soft); margin-bottom:2px;">Estimasi biaya bahan baku:</div>
        ${bahanLines}

        <div style="color:var(--ink-soft); margin-top:8px; margin-bottom:2px;">Estimasi HPP produk jadi:</div>
        ${hasilLines}
      </div>`;
  }

      <button class="bk-btn ghost" id="bk-prod-add-bahan" style="margin-bottom:18px;">+ Tambah bahan baku</button>

      <div class="bk-section-title">Hasil produksi (produk jadi)</div>
      <div class="bk-prod-item-head"><div>Nama produk jadi</div><div>Jumlah</div><div>Satuan</div><div></div></div>
      <div id="bk-prod-hasil">${produksiFormState.hasil.map(i => prodItemRowHtml(i, 'hasil')).join('')}</div>
      <button class="bk-btn ghost" id="bk-prod-add-hasil" style="margin-bottom:18px;">+ Tambah hasil produksi</button>

      <div class="bk-ai-box" style="margin-bottom:18px;">
        <div class="ai-head"><div class="ai-title">Estimasi HPP (dihitung otomatis)</div></div>
        <div id="bk-prod-estimate-body">${renderProdEstimateHtml()}</div>
      </div>

      <div id="bk-prod-err" class="bk-err" style="display:none;"></div>
      <button class="bk-btn primary" id="bk-prod-save-btn" style="margin-bottom:26px;">${isEdit ? 'Simpan perubahan produksi' : 'Catat produksi'}</button>

      <div class="bk-section-title">Riwayat produksi</div>
      <div id="bk-prod-list">${prodList.length ? prodList.map(t => produksiListRowHtml(t, hppData)).join('') : '<div class="bk-empty">Belum ada catatan produksi.</div>'}</div>
    `;

    if (isEdit) document.getElementById('bk-cancel-prod-edit').addEventListener('click', () => {
      editingTxnId = null;
      produksiFormState = { bahan: [blankProdItem()], hasil: [blankProdItem()] };
      activeTab = 'riwayat';
      renderTabs(); renderBody();
    });

    wireProdItems('bahan');
    wireProdItems('hasil');

    document.getElementById('bk-prod-add-bahan').addEventListener('click', () => {
      produksiFormState.bahan.push(blankProdItem());
      renderProduksi();
    });
    document.getElementById('bk-prod-add-hasil').addEventListener('click', () => {
      produksiFormState.hasil.push(blankProdItem());
      renderProduksi();
    });
    document.getElementById('bk-prod-save-btn').addEventListener('click', saveProduksiForm);

    const list = document.getElementById('bk-prod-list');
    list.querySelectorAll('.bk-list-row-wrap').forEach(w => {
      const id = w.dataset.txn;
      const editBtn = w.querySelector('.edit-btn');
      const delBtn = w.querySelector('.del-btn');
      if (editBtn) editBtn.addEventListener('click', () => startEdit(id));
      if (delBtn) delBtn.addEventListener('click', () => removeTxn(id));
    });
  }

  function produksiListRowHtml(t, hppData) {
    const info = hppData.prodCostByTxn[t.id];
    const checked = selectedTxnIds.has(t.id) ? 'checked' : '';
    const costLine = info
      ? `<div class="sub" style="color:var(--accent-ink); margin-top:2px;">HPP batch: ${rupiah(info.batchCost)} &middot; ${info.hasil.map(h => `${h.name} ${rupiah(h.unitCost)}/${h.unit || 'satuan'}`).join(', ')}</div>`
      : '';
    return `<div class="bk-list-row-wrap" data-txn="${t.id}">
      <div class="bk-list-row">
        <div class="bk-list-left">
          <div class="nm">Produksi <span class="bk-badge lunas" style="background:var(--accent-bg); color:var(--accent-ink);">Konversi stok</span></div>
          <div class="sub">${summarizeProduksi(t)} &middot; ${new Date(t.createdAt).toLocaleDateString('id-ID')}</div>
          ${costLine}
        </div>
        <div class="bk-list-amt" style="color:var(--ink-soft);">&mdash;</div>
      </div>
      <div class="bk-row-actions">
        <div class="bk-icon-btn edit-btn" title="Edit produksi">&#9998;</div>
        <div class="bk-icon-btn danger del-btn" title="Hapus produksi">&times;</div>
      </div>
    </div>`;
  }


  function wireProdItems(key) {
    document.getElementById('bk-prod-' + key).querySelectorAll('.bk-prod-item-row').forEach(row => {
      const id = row.dataset.id;
      const item = produksiFormState[key].find(x => x.id === id);
      row.querySelector('.f-name').addEventListener('input', e => { item.name = e.target.value; updateProdEstimate(); });
      row.querySelector('.f-qty').addEventListener('input', e => { item.qty = e.target.value; updateProdEstimate(); });
      row.querySelector('.f-unit').addEventListener('input', e => { item.unit = e.target.value; updateProdEstimate(); });
      const rm = row.querySelector('.rm');
      if (rm) rm.addEventListener('click', () => {
        produksiFormState[key] = produksiFormState[key].filter(x => x.id !== id);
        if (produksiFormState[key].length === 0) produksiFormState[key].push(blankProdItem());
        renderProduksi();
      });
    });
  }

  function prodItemRowHtml(item, key) {
    return `<div class="bk-prod-item-row" data-id="${item.id}">
      <input class="f-name" value="${escapeAttr(item.name)}" placeholder="${key === 'bahan' ? 'Nama bahan baku' : 'Nama produk jadi'}" list="bk-item-names" />
      <input class="f-qty" type="number" min="0" step="any" value="${escapeAttr(item.qty)}" placeholder="0" />
      <input class="f-unit" value="${escapeAttr(item.unit)}" placeholder="kg/pcs" />
      <div class="rm" title="Hapus baris">&times;</div>
    </div>`;
  }

  async function saveProduksiForm() {
    const errEl = document.getElementById('bk-prod-err');
    const validBahan = produksiFormState.bahan.filter(i => i.name && Number(i.qty) > 0);
    const validHasil = produksiFormState.hasil.filter(i => i.name && Number(i.qty) > 0);
    if (validBahan.length === 0 || validHasil.length === 0) {
      errEl.style.display = 'block';
      errEl.textContent = 'Isi minimal satu bahan baku yang dipakai dan satu hasil produksi, masing-masing dengan jumlah valid.';
      return;
    }
    errEl.style.display = 'none';
    const isEdit = !!editingTxnId;
    const existing = isEdit ? txns.find(x => x.id === editingTxnId) : null;
    const txn = {
      id: isEdit ? editingTxnId : uid(),
      type: 'produksi',
      bahan: validBahan.map(i => ({ name: i.name.trim(), qty: Number(i.qty), unit: i.unit.trim() })),
      hasil: validHasil.map(i => ({ name: i.name.trim(), qty: Number(i.qty), unit: i.unit.trim() })),
      total: 0,
      createdAt: isEdit && existing ? existing.createdAt : Date.now(),
    };
    const btn = document.getElementById('bk-prod-save-btn');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    try {
      await saveTxn(txn);
      if (isEdit) {
        const idx = txns.findIndex(x => x.id === editingTxnId);
        if (idx >= 0) txns[idx] = txn; else txns.unshift(txn);
      } else {
        txns.unshift(txn);
      }
      const wasEdit = isEdit;
      editingTxnId = null;
      produksiFormState = { bahan: [blankProdItem()], hasil: [blankProdItem()] };
      if (wasEdit) {
        activeTab = 'riwayat';
        renderTabs(); renderBody();
      } else {
        renderProduksi();
        showToast('Produksi tercatat, stok diperbarui.');
      }
    } catch (e) {
      console.error(e);
      errEl.style.display = 'block';
      errEl.textContent = 'Gagal menyimpan produksi, coba lagi.';
      btn.disabled = false; btn.textContent = isEdit ? 'Simpan perubahan produksi' : 'Catat produksi';
    }
  }

  // ---------- PIUTANG ----------
  function renderPiutang() {
    const unpaid = txns.filter(t => t.type === 'penjualan' && t.paid === false).sort((a,b) => b.createdAt - a.createdAt);
    const total = unpaid.reduce((s,t) => s + t.total, 0);
    bodyEl.innerHTML = `
      <div class="bk-stats" style="grid-template-columns: 1fr;">
        <div class="bk-stat out"><div class="lbl">Total piutang belum lunas</div><div class="val">${rupiah(total)}</div></div>
      </div>
      <div id="bk-piutang-list">${unpaid.length ? unpaid.map(piutangRowHtml).join('') : '<div class="bk-empty">Tidak ada piutang. Semua penjualan sudah lunas.</div>'}</div>
    `;
    bodyEl.querySelectorAll('[data-lunas]').forEach(btn => {
      btn.addEventListener('click', () => markLunas(btn.dataset.lunas));
    });
    bodyEl.querySelectorAll('[data-remind]').forEach(btn => {
      btn.addEventListener('click', () => remindWhatsapp(btn.dataset.remind));
    });
  }

  function piutangRowHtml(t) {
    const names = t.items.map(i => i.name).join(', ');
    return `<div class="bk-piutang-row">
      <div class="bk-piutang-top">
        <div>
          <div style="font-weight:500;">${t.customerName || 'Tanpa nama'}</div>
          <div class="sub" style="font-size:11.5px; color:var(--ink-soft);">${names} &middot; ${new Date(t.createdAt).toLocaleDateString('id-ID')}</div>
        </div>
        <div class="bk-list-amt out">${rupiah(t.total)}</div>
      </div>
      <div class="bk-piutang-actions">
        <button class="bk-btn primary" data-lunas="${t.id}">Tandai lunas</button>
        ${t.customerPhone ? `<button class="bk-btn ghost" data-remind="${t.id}">Ingatkan via WhatsApp</button>` : ''}
      </div>
    </div>`;
  }

  async function markLunas(id) {
    const t = txns.find(x => x.id === id);
    if (!t) return;
    t.paid = true;
    try {
      await saveTxn(t);
      renderPiutang();
      showToast('Ditandai lunas.');
    } catch (e) {
      console.error(e);
      showToast('Gagal memperbarui status, coba lagi.');
    }
  }

  function remindWhatsapp(id) {
    const t = txns.find(x => x.id === id);
    if (!t) return;
    const storeName = document.getElementById('bk-storename').value || 'Toko Saya';
    const phoneRaw = (t.customerPhone || '').replace(/[^0-9]/g, '');
    const phone = phoneRaw.startsWith('0') ? '62' + phoneRaw.slice(1) : phoneRaw;
    const msg = `Halo${t.customerName ? ' ' + t.customerName : ''}, mengingatkan pembayaran belanja di ${storeName} sebesar ${rupiah(t.total)} pada ${new Date(t.createdAt).toLocaleDateString('id-ID')} masih belum lunas. Transfer ke BCA 6760677301 a.n. Rodiyati ya, terima kasih!`;
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  // ---------- LAPORAN LABA RUGI (PDF) ----------
  function downloadLabaRugi(scopeMonth, scopedTxns, masuk, keluar, hppTotal, labaKotor) {
    if (!window.jspdf) { showToast('Modul PDF belum siap, coba lagi sebentar.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const storeName = document.getElementById('bk-storename').value || 'Toko Saya';
    const periodLabel = monthLabel(scopeMonth);
    let y = 20;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
    doc.text(storeName, 105, y, { align: 'center' }); y += 8;
    doc.setFontSize(12);
    doc.text('Laporan Laba Rugi', 105, y, { align: 'center' }); y += 6;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(`Periode: ${periodLabel}`, 105, y, { align: 'center' }); y += 5;
    doc.text(`Dicetak: ${new Date().toLocaleDateString('id-ID')}`, 105, y, { align: 'center' }); y += 12;

    doc.setDrawColor(180); doc.line(20, y, 190, y); y += 10;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text('Ringkasan arus kas', 20, y); y += 8;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
    doc.text('Pendapatan (Penjualan)', 20, y); doc.text(rupiah(masuk), 190, y, { align: 'right' }); y += 7;
    doc.text('Beban (Pembelian bahan baku)', 20, y); doc.text('- ' + rupiah(keluar), 190, y, { align: 'right' }); y += 4;
    doc.line(140, y, 190, y); y += 6;
    doc.setFont('helvetica', 'bold');
    doc.text('Laba / Rugi bersih (arus kas)', 20, y); doc.text(rupiah(masuk - keluar), 190, y, { align: 'right' }); y += 14;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text('Estimasi HPP & laba kotor', 20, y); y += 8;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
    doc.text('Pendapatan (Penjualan)', 20, y); doc.text(rupiah(masuk), 190, y, { align: 'right' }); y += 7;
    doc.text('HPP (Harga Pokok Penjualan)', 20, y); doc.text('- ' + rupiah(hppTotal || 0), 190, y, { align: 'right' }); y += 4;
    doc.line(140, y, 190, y); y += 6;
    doc.setFont('helvetica', 'bold');
    doc.text('Laba kotor', 20, y); doc.text(rupiah(labaKotor || 0), 190, y, { align: 'right' }); y += 6;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text('HPP dihitung otomatis dengan metode rata-rata bergerak dari harga beli & biaya produksi.', 20, y); y += 4;
    doc.text('Margin belum termasuk biaya operasional lain (sewa, listrik, gaji, dll).', 20, y); y += 12;
    doc.setTextColor(30);

    function itemBreakdown(title, type) {
      const map = {};
      scopedTxns.filter(t => t.type === type).forEach(t => {
        t.items.forEach(i => {
          const key = i.name.trim();
          if (!map[key]) map[key] = { qty: 0, total: 0, unit: i.unit || '' };
          map[key].qty += Number(i.qty) || 0;
          map[key].total += (Number(i.qty)||0) * (Number(i.price)||0);
        });
      });
      const rows = Object.entries(map).sort((a,b) => b[1].total - a[1].total);
      if (!rows.length) return;
      if (y > 260) { doc.addPage(); y = 20; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
      doc.text(title, 20, y); y += 7;
      doc.setFontSize(9.5); doc.setFont('helvetica', 'normal');
      doc.setTextColor(120); doc.text('Item', 20, y); doc.text('Jumlah', 130, y, { align: 'right' }); doc.text('Total', 190, y, { align: 'right' }); y += 2;
      doc.setDrawColor(210); doc.line(20, y, 190, y); y += 6;
      doc.setTextColor(30);
      rows.forEach(([name, r]) => {
        if (y > 275) { doc.addPage(); y = 20; }
        doc.text(name, 20, y);
        doc.text(`${r.qty}${r.unit ? ' '+r.unit : ''}`, 130, y, { align: 'right' });
        doc.text(rupiah(r.total), 190, y, { align: 'right' });
        y += 6.5;
      });
      y += 8;
    }

    itemBreakdown('Rincian penjualan per produk', 'penjualan');
    itemBreakdown('Rincian pembelian per bahan baku', 'pembelian');

    const fname = `laporan-laba-rugi-${scopeMonth === 'semua' ? 'semua' : scopeMonth}.pdf`;
    doc.save(fname);
  }

  // ---------- REFRESH DATA (agar transaksi dari user lain ikut muncul) ----------
  let isRefreshing = false;
  async function refreshData(manual) {
    if (isRefreshing) return;
    isRefreshing = true;
    const btn = document.getElementById('bk-refresh-btn');
    if (btn && manual) btn.style.transform = 'rotate(180deg)';
    try {
      const before = txns.length;
      await loadTxns();
      const safeToRerender = activeTab !== 'pembelian' && activeTab !== 'penjualan' && activeTab !== 'produksi' && !editingTxnId && modalSlot.innerHTML.trim() === '';
      if (safeToRerender) renderBody();
      if (manual) showToast(txns.length !== before ? 'Data diperbarui.' : 'Data sudah yang terbaru.');
    } catch (e) {
      console.error(e);
      if (manual) showToast('Gagal memuat data terbaru, coba lagi.');
    } finally {
      isRefreshing = false;
      if (btn && manual) setTimeout(() => { btn.style.transform = ''; }, 400);
    }
  }
  document.getElementById('bk-refresh-btn').addEventListener('click', () => refreshData(true));

  async function init() {
    bodyEl.innerHTML = '<div class="bk-empty">Memuat data...</div>';
    await loadStoreName();
    await loadTxns();
    renderTabs();
    renderBody();
    setInterval(() => refreshData(false), 20000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshData(false);
    });
  }
  init();
})();
</script>
