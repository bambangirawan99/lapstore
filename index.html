      </div>` : ''}
      ${payments.length ? `<div class="bk-svc-timeline">${payments.map(p => `Bayar ${rupiah(p.nominal)} &middot; ${new Date(p.createdAt).toLocaleDateString('id-ID')}`).join(' | ')}</div>` : ''}
    </div>`;
  }

  function wireUtangEvents() {
    document.getElementById('bk-utang-kreditur').addEventListener('input', e => utangFormState.kreditur = e.target.value);
    document.getElementById('bk-utang-jenis').addEventListener('change', e => utangFormState.jenis = e.target.value);
    document.getElementById('bk-utang-nominal').addEventListener('input', e => utangFormState.nominal = e.target.value);
    document.getElementById('bk-utang-ket').addEventListener('input', e => utangFormState.keterangan = e.target.value);
    document.getElementById('bk-utang-excel').addEventListener('click', downloadUtangExcel);
    document.getElementById('bk-utang-save').addEventListener('click', async () => {
      const errEl = document.getElementById('bk-utang-err');
      const kreditur = utangFormState.kreditur.trim();
      const nominal = Number(utangFormState.nominal) || 0;
      if (!kreditur || nominal <= 0) { errEl.style.display = 'block'; errEl.textContent = 'Isi nama kreditur dan nominal pinjaman yang valid.'; return; }
      errEl.style.display = 'none';
      const u = { id: uid(), kreditur, jenis: utangFormState.jenis, keterangan: utangFormState.keterangan.trim(), nominalAwal: nominal, sisaUtang: nominal, createdAt: Date.now(), createdBy: currentUser ? currentUser.email : null };
      try {
        await saveUtangItem(u);
        utangList.unshift(u);
        utangFormState = blankUtangForm();
        renderLaporan();
        showToast('Utang tercatat, kas otomatis bertambah sesuai nominal pinjaman.');
      } catch (e) { console.error(e); errEl.style.display = 'block'; errEl.textContent = 'Gagal menyimpan utang, coba lagi.'; }
    });
    document.querySelectorAll('#bk-utang-list [data-utang]').forEach(card => {
      const id = card.dataset.utang;
      const delBtn = card.querySelector('.utang-del-btn');
      if (delBtn) delBtn.addEventListener('click', () => {
        showConfirm('Hapus catatan utang ini beserta seluruh riwayat pembayarannya? Ini akan mempengaruhi perhitungan Kas.', async () => {
          try {
            await deleteUtangFromStore(id);
            utangList = utangList.filter(u => u.id !== id);
            const related = utangPayments.filter(p => p.utangId === id);
            for (const p of related) { await deleteUtangPaymentFromStore(p.id); }
            utangPayments = utangPayments.filter(p => p.utangId !== id);
            renderLaporan();
            showToast('Utang dihapus.');
          } catch (e) { console.error(e); showToast('Gagal menghapus, coba lagi.'); }
        });
      });
      const bayarBtn = card.querySelector('.utang-bayar-btn');
      if (bayarBtn) bayarBtn.addEventListener('click', async () => {
        const input = card.querySelector(`.utang-bayar-input[data-id="${id}"]`);
        const nominal = Number(input.value) || 0;
        if (nominal <= 0) { showToast('Isi jumlah pembayaran terlebih dahulu.'); return; }
        const u = utangList.find(x => x.id === id);
        if (!u) return;
        try {
          const p = { id: uid(), utangId: id, nominal, createdAt: Date.now(), createdBy: currentUser ? currentUser.email : null };
          await saveUtangPayment(p);
          utangPayments.unshift(p);
          u.sisaUtang = Math.max(0, (Number(u.sisaUtang)||0) - nominal);
          await saveUtangItem(u);
          renderLaporan();
          showToast('Pembayaran utang tercatat.');
        } catch (e) { console.error(e); showToast('Gagal mencatat pembayaran, coba lagi.'); }
      });
    });
  }

        <label>Bulan</label>
        <select id="bk-lap-month" style="width:100%; border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; font-size:13.5px; font-family:'Inter',sans-serif; background:#fff;">
          <option value="semua" ${mKey==='semua'?'selected':''}>Semua bulan</option>
          ${months.map(m => `<option value="${m}" ${mKey===m?'selected':''}>${monthLabel(m)}</option>`).join('')}
        </select>
      </div>
      <div class="bk-stats" style="margin-bottom:16px;">
        <div class="bk-stat out"><div class="lbl">Total beban ${mKey==='semua'?'(semua waktu)':('&middot; '+monthLabel(mKey))}</div><div class="val">${rupiah(total)}</div></div>
      </div>
      <button class="bk-btn ghost" id="bk-beban-excel" style="margin-bottom:14px;">Unduh Excel</button>
      <div id="bk-beban-list">${filtered.length ? filtered.map(bebanRowHtml).join('') : '<div class="bk-empty">Belum ada catatan beban pada periode ini.</div>'}</div>
    `;
  }
  function bebanRowHtml(b) {
    const label = b.kategori === 'Lainnya' && b.kategoriCustom ? b.kategoriCustom : b.kategori;
    return `<div class="bk-list-row-wrap" data-beban="${b.id}">
      <div class="bk-list-row">
        <div class="bk-list-left">
          <div class="nm">${label}</div>
          <div class="sub">${b.keterangan || '-'} &middot; ${new Date(b.createdAt).toLocaleDateString('id-ID')}${auditNoteHtml(b)}</div>
        </div>
        <div class="bk-list-amt out">-${rupiah(b.nominal)}</div>
      </div>
      <div class="bk-row-actions">
        <div class="bk-icon-btn beban-print-btn" title="Cetak bukti pengeluaran">&#9099;</div>
        <div class="bk-icon-btn danger beban-del-btn" title="Hapus beban">&times;</div>
      </div>
    </div>`;
  }
  function wireBebanEvents() {
    document.getElementById('bk-beban-excel').addEventListener('click', () => downloadBebanExcel(laporanBulan));
    const katSel = document.getElementById('bk-beban-kategori');
    katSel.addEventListener('change', e => { bebanFormState.kategori = e.target.value; renderLaporan(); });
    if (bebanFormState.kategori === 'Lainnya') {
      const customEl = document.getElementById('bk-beban-custom');
      if (customEl) customEl.addEventListener('input', e => bebanFormState.kategoriCustom = e.target.value);
    }
    document.getElementById('bk-beban-nominal').addEventListener('input', e => bebanFormState.nominal = e.target.value);
    document.getElementById('bk-beban-ket').addEventListener('input', e => bebanFormState.keterangan = e.target.value);
    document.getElementById('bk-beban-save').addEventListener('click', async () => {
      const errEl = document.getElementById('bk-beban-err');
      const nominal = Number(bebanFormState.nominal) || 0;
      if (nominal <= 0) { errEl.style.display = 'block'; errEl.textContent = 'Isi nominal beban yang valid.'; return; }
      if (bebanFormState.kategori === 'Lainnya' && !bebanFormState.kategoriCustom.trim()) { errEl.style.display = 'block'; errEl.textContent = 'Isi nama akun custom untuk kategori Lainnya.'; return; }
      errEl.style.display = 'none';
      const b = { id: uid(), kategori: bebanFormState.kategori, kategoriCustom: bebanFormState.kategoriCustom.trim(), nominal, keterangan: bebanFormState.keterangan.trim(), createdAt: Date.now(), createdBy: currentUser ? currentUser.email : null };
      try {
        await saveBebanItem(b);
        bebanList.unshift(b);
        bebanFormState = blankBebanForm();
        renderLaporan();
        showBebanVoucher(b);
      } catch (e) { console.error(e); errEl.style.display='block'; errEl.textContent = 'Gagal menyimpan beban, coba lagi.'; }
    });
    const monthSel = document.getElementById('bk-lap-month');
    if (monthSel) monthSel.addEventListener('change', e => { laporanBulan = e.target.value; renderLaporan(); });
    document.querySelectorAll('#bk-beban-list .bk-list-row-wrap').forEach(w => {
      const id = w.dataset.beban;
      const printBtn = w.querySelector('.beban-print-btn');
      if (printBtn) printBtn.addEventListener('click', () => {
        const b = bebanList.find(x => x.id === id);
        if (b) showBebanVoucher(b);
      });
      w.querySelector('.beban-del-btn').addEventListener('click', () => {
        showConfirm('Hapus catatan beban ini?', async () => {
          try {
            await deleteBebanFromStore(id);
            bebanList = bebanList.filter(b => b.id !== id);
            renderLaporan();
            showToast('Beban dihapus.');
          } catch (e) { console.error(e); showToast('Gagal menghapus, coba lagi.'); }
        });
      });
    });
  }

  function renderStokBulananHtml() {
    const months = laporanAvailableMonths();
    const mKey = laporanBulan === 'semua' ? (months[0] || monthKey(Date.now())) : laporanBulan;
    const { rows, totalValue } = computeStokValueForMonth(mKey);
    return `
      <div class="bk-field" style="max-width:260px;">
        <label>Bulan</label>
        <select id="bk-lap-month" style="width:100%; border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; font-size:13.5px; font-family:'Inter',sans-serif; background:#fff;">
          ${months.map(m => `<option value="${m}" ${mKey===m?'selected':''}>${monthLabel(m)}</option>`).join('')}
        </select>
      </div>
      <button class="bk-btn ghost" id="bk-stokbulanan-excel" data-month="${mKey}" style="margin-bottom:14px;">Unduh Excel</button>
      <div class="bk-stats" style="margin-bottom:16px; grid-template-columns: 1fr;">
        <div class="bk-stat"><div class="lbl">Nilai stok akhir bulan (HPP saat itu)</div><div class="val">${rupiah(totalValue)}</div></div>
      </div>
      <div class="bk-stok-note">Stok awal bulan dihitung dari seluruh riwayat transaksi sebelum bulan ini. Kolom Masuk (pembelian &amp; hasil produksi) dan Keluar (penjualan &amp; bahan produksi) khusus bulan yang dipilih. Nilai (Rp) dihitung pakai HPP rata-rata bergerak per akhir bulan tersebut, bukan harga hari ini.</div>
      <div class="bk-stok-row" style="grid-template-columns: 1fr 60px 60px 60px 60px 110px; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; font-weight:700;">
        <div>Nama item</div><div style="text-align:right;">Awal</div><div style="text-align:right;">Masuk</div><div style="text-align:right;">Keluar</div><div style="text-align:right;">Akhir</div><div style="text-align:right;">Nilai (Rp)</div>
      </div>
      ${rows.length ? rows.map(r => `
        <div class="bk-stok-row" style="grid-template-columns: 1fr 60px 60px 60px 60px 110px;">
          <div>${r.name}<span style="color:var(--ink-soft); font-size:11px;"> ${r.unit||''}</span></div>
          <div class="qty">${r.awal.toLocaleString('id-ID')}</div>
          <div class="qty" style="color:var(--money-in);">+${r.masuk.toLocaleString('id-ID')}</div>
          <div class="qty" style="color:var(--money-out);">-${r.keluar.toLocaleString('id-ID')}</div>
          <div class="qty" style="font-weight:700;">${r.akhir.toLocaleString('id-ID')}</div>
          <div class="qty">${rupiah(r.value)}</div>
        </div>
      `).join('') : '<div class="bk-empty">Belum ada data stok untuk bulan ini.</div>'}
    `;
  }
  function wireStokBulananEvents() {
    const sel = document.getElementById('bk-lap-month');
    if (sel) sel.addEventListener('change', e => { laporanBulan = e.target.value; renderLaporan(); });
    const excelBtn = document.getElementById('bk-stokbulanan-excel');
    if (excelBtn) excelBtn.addEventListener('click', () => downloadStokBulananExcel(excelBtn.dataset.month));
  }

  function renderRekeningHtml() {
    const byAccount = computeRekeningReport();
    return `
      <div class="bk-stok-note">Total uang masuk dihitung dari penjualan/service yang sudah lunas dan tercatat dibayar ke rekening terkait.</div>
      <button class="bk-btn ghost" id="bk-rekening-excel" style="margin-bottom:16px;">Unduh Excel</button>
      ${BANK_ACCOUNTS.map(acc => {
        const data = byAccount[acc.id];
        return `
          <div class="bk-section-title">${acc.label} <span style="color:var(--ink-soft); font-weight:500; font-size:13px;">(${acc.nomor})</span></div>
          <div class="bk-stats" style="margin-bottom:14px; grid-template-columns: 1fr;">
            <div class="bk-stat in"><div class="lbl">Total uang masuk</div><div class="val">${rupiah(data.total)}</div></div>
          </div>
          ${data.transactions.length ? data.transactions.slice(0, 100).map(t => `
            <div class="bk-list-row"><div class="bk-list-left"><div class="nm">${t.customerName || 'Tanpa nama'}</div><div class="sub">${new Date(t.createdAt).toLocaleDateString('id-ID')}</div></div><div class="bk-list-amt in">+${rupiah(t.total)}</div></div>
          `).join('') : '<div class="bk-empty">Belum ada pemasukan lewat rekening ini.</div>'}
          <div style="margin-bottom:20px;"></div>
        `;
      }).join('')}
    `;
  }
  function wireRekeningEvents() {
    document.getElementById('bk-rekening-excel').addEventListener('click', downloadRekeningExcel);
  }

  // ---------- CARI (pencarian lintas modul) ----------
  function renderCari() {
    bodyEl.innerHTML = `
      <div class="bk-section-title">Cari transaksi, pelanggan, atau catatan lain</div>
      <div class="bk-field">
        <input id="bk-cari-input" value="${escapeAttr(cariQuery)}" placeholder="Ketik nama pelanggan/supplier, nama barang, kreditur, dll..." style="width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 14px; font-size:14px; font-family:'Inter',sans-serif;" />
      </div>
      <div id="bk-cari-results">${renderCariResultsHtml()}</div>
    `;
    wireCariEvents();
  }

  function renderCariResultsHtml() {
    const q = cariQuery.trim().toLowerCase();
    if (!q) {
      return '<div class="bk-empty">Ketik kata kunci di atas untuk mulai mencari. Bisa cari nama pelanggan, nama supplier, nama barang, kreditur utang, atau keterangan beban.</div>';
    }

    const matchedTxns = txns.filter(t => {
      const nameField = t.type === 'penjualan' ? t.customerName : t.supplierName;
      const itemNames = (t.items||[]).map(i=>i.name).join(' ');
      const bahanNames = (t.bahan||[]).map(i=>i.name).join(' ');
      const hasilNames = (t.hasil||[]).map(i=>i.name).join(' ');
      const haystack = `${nameField||''} ${itemNames} ${bahanNames} ${hasilNames}`.toLowerCase();
      return haystack.includes(q);
    }).sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 30);

    const matchedServices = services.filter(s => `${s.customerName||''} ${s.device||''} ${s.complaint||''}`.toLowerCase().includes(q))
      .sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 30);

    const matchedBeban = bebanList.filter(b => {
      const label = (b.kategori === 'Lainnya' && b.kategoriCustom) ? b.kategoriCustom : b.kategori;
      return `${label||''} ${b.keterangan||''}`.toLowerCase().includes(q);
    }).sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 30);

    const matchedUtang = utangList.filter(u => `${u.kreditur||''} ${u.jenis||''} ${u.keterangan||''}`.toLowerCase().includes(q))
      .sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 30);

    const total = matchedTxns.length + matchedServices.length + matchedBeban.length + matchedUtang.length;
    if (total === 0) {
      return `<div class="bk-empty">Tidak ada hasil untuk "${escapeAttr(cariQuery)}".</div>`;
    }

    let html = `<div class="bk-stok-note">Ditemukan ${total} hasil untuk "${escapeAttr(cariQuery)}".</div>`;
    if (matchedTxns.length) {
      html += `<div class="bk-section-title" style="margin-top:16px; font-size:15px;">Transaksi (${matchedTxns.length})</div>`;
      html += matchedTxns.map(cariTxnRowHtml).join('');
    }
    if (matchedServices.length) {
      html += `<div class="bk-section-title" style="margin-top:16px; font-size:15px;">Service Laptop (${matchedServices.length})</div>`;
      html += matchedServices.map(cariServiceRowHtml).join('');
    }
    if (matchedBeban.length) {
      html += `<div class="bk-section-title" style="margin-top:16px; font-size:15px;">Beban Operasional (${matchedBeban.length})</div>`;
      html += matchedBeban.map(cariBebanRowHtml).join('');
    }
    if (matchedUtang.length) {
      html += `<div class="bk-section-title" style="margin-top:16px; font-size:15px;">Utang/Kewajiban (${matchedUtang.length})</div>`;
      html += matchedUtang.map(cariUtangRowHtml).join('');
    }
    return html;
  }

  function cariTxnRowHtml(t) {
    const isProd = t.type === 'produksi';
    const isIn = t.type === 'penjualan';
    const label = isProd ? 'Produksi' : (isIn ? (t.customerName || 'Penjualan') : (t.supplierName || 'Pembelian'));
    const names = isProd ? summarizeProduksi(t) : (t.items||[]).map(i=>i.name).join(', ');
    const amt = isProd ? '<div class="bk-list-amt" style="color:var(--ink-soft);">&mdash;</div>' : `<div class="bk-list-amt ${isIn?'in':'out'}">${isIn?'+':'-'}${rupiah(t.total)}</div>`;
    return `<div class="bk-list-row-wrap">
      <div class="bk-list-row">
        <div class="bk-list-left"><div class="nm">${label}</div><div class="sub">${names} &middot; ${new Date(t.createdAt).toLocaleDateString('id-ID')}</div></div>
        ${amt}
      </div>
      <div class="bk-row-actions"><button class="bk-btn ghost cari-open-txn" data-id="${t.id}" style="padding:6px 12px; font-size:12px;">Buka</button></div>
    </div>`;
  }
  function cariServiceRowHtml(s) {
    return `<div class="bk-list-row-wrap">
      <div class="bk-list-row">
        <div class="bk-list-left"><div class="nm">${s.customerName || 'Tanpa nama'} &middot; ${s.device || '-'}</div><div class="sub">${s.complaint || ''} &middot; ${serviceStatusLabel(s.status)}</div></div>
      </div>
      <div class="bk-row-actions"><button class="bk-btn ghost cari-open-service" data-id="${s.id}" data-status="${s.status}" style="padding:6px 12px; font-size:12px;">Buka</button></div>
    </div>`;
  }
  function cariBebanRowHtml(b) {
    const label = (b.kategori === 'Lainnya' && b.kategoriCustom) ? b.kategoriCustom : b.kategori;
    return `<div class="bk-list-row-wrap">
      <div class="bk-list-row">
        <div class="bk-list-left"><div class="nm">${label}</div><div class="sub">${b.keterangan || ''} &middot; ${new Date(b.createdAt).toLocaleDateString('id-ID')}</div></div>
        <div class="bk-list-amt out">-${rupiah(b.nominal)}</div>
      </div>
      <div class="bk-row-actions"><button class="bk-btn ghost cari-open-beban" style="padding:6px 12px; font-size:12px;">Buka</button></div>
    </div>`;
  }
  function cariUtangRowHtml(u) {
    return `<div class="bk-list-row-wrap">
      <div class="bk-list-row">
        <div class="bk-list-left"><div class="nm">${u.kreditur}</div><div class="sub">${u.jenis} &middot; Sisa ${rupiah(u.sisaUtang)}</div></div>
      </div>
      <div class="bk-row-actions"><button class="bk-btn ghost cari-open-utang" style="padding:6px 12px; font-size:12px;">Buka</button></div>
    </div>`;
  }

  function wireCariEvents() {
    const input = document.getElementById('bk-cari-input');
    input.addEventListener('input', e => {
      cariQuery = e.target.value;
      const resultsEl = document.getElementById('bk-cari-results');
      if (resultsEl) resultsEl.innerHTML = renderCariResultsHtml();
      wireCariResultButtons();
    });
    wireCariResultButtons();
  }
  function wireCariResultButtons() {
    document.querySelectorAll('.cari-open-txn').forEach(b => b.addEventListener('click', () => startEdit(b.dataset.id)));
    document.querySelectorAll('.cari-open-service').forEach(b => b.addEventListener('click', () => {
      const s = services.find(x => x.id === b.dataset.id);
      activeTab = 'service';
      if (s && s.status === 'diambil') {
        svcView = 'riwayat';
        svcSearchQuery = s.customerName || '';
      } else {
        svcView = 'aktif';
        svcFilter = 'semua';
      }
      renderTabs(); renderBody();
    }));
    document.querySelectorAll('.cari-open-beban').forEach(b => b.addEventListener('click', () => {
      activeTab = 'laporan';
      laporanView = 'beban';
      laporanBulan = 'semua';
      renderTabs(); renderBody();
    }));
    document.querySelectorAll('.cari-open-utang').forEach(b => b.addEventListener('click', () => {
      activeTab = 'laporan';
      laporanView = 'utang';
      renderTabs(); renderBody();
    }));
  }

  // ---------- REFRESH DATA (agar transaksi dari user lain ikut muncul) ----------
  let isRefreshing = false;
  async function refreshData(manual) {
    if (isRefreshing) return;
    isRefreshing = true;
    const btn = document.getElementById('bk-refresh-btn');
    if (btn && manual) btn.style.transform = 'rotate(180deg)';
    try {
      const before = txns.length;
      await loadTxns();
      await loadServices();
      await loadBeban();
      await loadClosings();
      await loadUtang();
      await loadUtangPayments();
      await loadModalEntries();
      const safeToRerender = activeTab !== 'pembelian' && activeTab !== 'penjualan' && activeTab !== 'produksi' && activeTab !== 'service' && activeTab !== 'laporan' && activeTab !== 'cari' && !editingTxnId && modalSlot.innerHTML.trim() === '';
      if (safeToRerender) renderBody();
      if (manual) showToast(txns.length !== before ? 'Data diperbarui.' : 'Data sudah yang terbaru.');
    } catch (e) {
      console.error(e);
      if (manual) showToast('Gagal memuat data terbaru, coba lagi.');
    } finally {
      isRefreshing = false;
      if (btn && manual) setTimeout(() => { btn.style.transform = ''; }, 400);
    }
  }
  document.getElementById('bk-refresh-btn').addEventListener('click', () => refreshData(true));
  document.getElementById('bk-logout-btn').addEventListener('click', handleLogout);

  // ---------- LOGIN / AUTH GATE ----------
  let currentUser = null;

  function renderLoginScreen(errorMsg) {
    document.getElementById('bk-header-actions').style.display = 'none';
    tabsEl.innerHTML = '';
    bodyEl.innerHTML = `
      <div style="max-width:340px; margin:16px auto 8px;">
        <div style="text-align:center; margin-bottom:22px;">
          <div style="font-family:'Playfair Display',serif; font-weight:600; font-size:22px; color:var(--accent); margin-bottom:6px;">Masuk</div>
          <div style="color:var(--ink-soft); font-size:13px;">Gunakan akun yang sudah didaftarkan admin untuk toko ini.</div>
        </div>
        <div class="bk-field"><label>Email</label><input id="bk-login-email" type="email" placeholder="nama@email.com" /></div>
        <div class="bk-field"><label>Kata sandi</label><input id="bk-login-password" type="password" placeholder="Kata sandi" /></div>
        <div id="bk-login-err" class="bk-err" style="display:${errorMsg ? 'block' : 'none'};">${errorMsg ? escapeAttr(errorMsg) : ''}</div>
        <button class="bk-btn primary" id="bk-login-btn" style="width:100%;">Masuk</button>
      </div>
    `;
    document.getElementById('bk-login-btn').addEventListener('click', handleLoginSubmit);
    document.getElementById('bk-login-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleLoginSubmit(); });
    document.getElementById('bk-login-email').focus();
  }

  async function handleLoginSubmit() {
    const email = document.getElementById('bk-login-email').value.trim();
    const password = document.getElementById('bk-login-password').value;
    const errEl = document.getElementById('bk-login-err');
    const btn = document.getElementById('bk-login-btn');
    if (!email || !password) {
      errEl.style.display = 'block'; errEl.textContent = 'Isi email dan kata sandi.';
      return;
    }
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Memproses...';
    try {
      const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      currentUser = data.user;
      document.getElementById('bk-header-actions').style.display = 'flex';
      init();
    } catch (e) {
      console.error(e);
      errEl.style.display = 'block';
      errEl.textContent = 'Email atau kata sandi salah, coba lagi.';
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  }

  function handleLogout() {
    if (!currentUser) return;
    showConfirm('Keluar dari akun ini?', async () => {
      try { await sbClient.auth.signOut(); } catch (e) { console.error(e); }
    });
  }

  async function bootstrapAuth() {
    try {
      const { data } = await sbClient.auth.getSession();
      if (data && data.session) {
        currentUser = data.session.user;
        document.getElementById('bk-header-actions').style.display = 'flex';
        init();
      } else {
        renderLoginScreen();
      }
    } catch (e) {
      console.error(e);
      renderLoginScreen('Gagal memeriksa sesi login, coba refresh halaman.');
    }
    sbClient.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_OUT') {
        currentUser = null;
        renderLoginScreen();
      }
    });
  }

  async function init() {
    bodyEl.innerHTML = '<div class="bk-empty">Memuat data...</div>';
    await loadStoreName();
    await loadTxns();
    await loadServices();
    await loadBeban();
    await loadModalAwal();
    await loadClosings();
    await loadUtang();
    await loadUtangPayments();
    await loadModalEntries();
    renderTabs();
    renderBody();
    setInterval(() => refreshData(false), 20000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshData(false);
    });
  }
  bootstrapAuth();
})();
</script>
