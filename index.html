  function wireUtangEvents() {
    document.getElementById('bk-utang-kreditur').addEventListener('input', e => utangFormState.kreditur = e.target.value);
    document.getElementById('bk-utang-jenis').addEventListener('change', e => utangFormState.jenis = e.target.value);
    document.getElementById('bk-utang-nominal').addEventListener('input', e => utangFormState.nominal = e.target.value);
    document.getElementById('bk-utang-ket').addEventListener('input', e => utangFormState.keterangan = e.target.value);
    document.getElementById('bk-utang-excel').addEventListener('click', downloadUtangExcel);
    document.getElementById('bk-utang-save').addEventListener('click', async () => {
      const errEl = document.getElementById('bk-utang-err');
      const kreditur = utangFormState.kreditur.trim();
      const nominal = Number(utangFormState.nominal) || 0;
      if (!kreditur || nominal <= 0) { errEl.style.display = 'block'; errEl.textContent = 'Isi nama kreditur dan nominal pinjaman yang valid.'; return; }
      errEl.style.display = 'none';
      const u = { id: uid(), kreditur, jenis: utangFormState.jenis, keterangan: utangFormState.keterangan.trim(), nominalAwal: nominal, sisaUtang: nominal, createdAt: Date.now(), createdBy: currentUser ? currentUser.email : null };
      try {
        await saveUtangItem(u);
        utangList.unshift(u);
        utangFormState = blankUtangForm();
        renderLaporan();
        showToast('Utang tercatat, kas otomatis bertambah sesuai nominal pinjaman.');
      } catch (e) { console.error(e); errEl.style.display = 'block'; errEl.textContent = 'Gagal menyimpan utang, coba lagi.'; }
    });
    document.querySelectorAll('#bk-utang-list [data-utang]').forEach(card => {
      const id = card.dataset.utang;
      const delBtn = card.querySelector('.utang-del-btn');
      if (delBtn) delBtn.addEventListener('click', () => {
        showConfirm('Hapus catatan utang ini beserta seluruh riwayat pembayarannya? Ini akan mempengaruhi perhitungan Kas.', async () => {
          showLoadingModal('Menghapus catatan utang...');
          try {
            const u = utangList.find(x => x.id === id);
            if (u) await logToTrash('utang', `${u.kreditur || 'Tanpa nama'} - ${rupiah(u.nominalAwal||0)}`, u);
            trashEntriesCache = null;
            await deleteUtangFromStore(id);
            utangList = utangList.filter(u => u.id !== id);
            const related = utangPayments.filter(p => p.utangId === id);
            for (const p of related) { await deleteUtangPaymentFromStore(p.id); }
            utangPayments = utangPayments.filter(p => p.utangId !== id);
            closeLoadingModal();
            renderLaporan();
            showToast('Utang dihapus.');
          } catch (e) { console.error(e); closeLoadingModal(); showToast('Gagal menghapus, coba lagi.'); }
        });
      });
      const bayarBtn = card.querySelector('.utang-bayar-btn');
      if (bayarBtn) bayarBtn.addEventListener('click', async () => {
        const input = card.querySelector(`.utang-bayar-input[data-id="${id}"]`);
        const nominal = Number(input.value) || 0;
        if (nominal <= 0) { showToast('Isi jumlah pembayaran terlebih dahulu.'); return; }
        const u = utangList.find(x => x.id === id);
        if (!u) return;
        try {
          const p = { id: uid(), utangId: id, nominal, createdAt: Date.now(), createdBy: currentUser ? currentUser.email : null };
          await saveUtangPayment(p);
          utangPayments.unshift(p);
          u.sisaUtang = Math.max(0, (Number(u.sisaUtang)||0) - nominal);
          await saveUtangItem(u);
          renderLaporan();
          showToast('Pembayaran utang tercatat.');
        } catch (e) { console.error(e); showToast('Gagal mencatat pembayaran, coba lagi.'); }
      });
    });
  }

  function wireRekeningEvents() {
    document.getElementById('bk-rekening-excel').addEventListener('click', downloadRekeningExcel);
    document.getElementById('bk-transfer-save').addEventListener('click', async () => {
      const dari = document.getElementById('bk-transfer-dari').value;
      const ke = document.getElementById('bk-transfer-ke').value;
      const jumlah = Number(document.getElementById('bk-transfer-jumlah').value) || 0;
      const keterangan = document.getElementById('bk-transfer-ket').value.trim();
      const errEl = document.getElementById('bk-transfer-err');
      if (dari === ke) { errEl.style.display = 'block'; errEl.textContent = 'Rekening asal dan tujuan tidak boleh sama.'; return; }
      if (jumlah <= 0) { errEl.style.display = 'block'; errEl.textContent = 'Isi jumlah yang valid.'; return; }
      errEl.style.display = 'none';
      const item = {
        id: uid(),
        dariRekening: dari,
        keRekening: ke,
        jumlah,
        keterangan,
        createdAt: Date.now(),
        createdBy: currentUser ? currentUser.email : null,
      };
      try {
        await saveTransferItem(item);
        transferRekening.unshift(item);
        renderLaporan();
        showToast(`Pemindahan dana ${rupiah(jumlah)} dari ${bankAccountLabel(dari)} ke ${bankAccountLabel(ke)} tercatat.`);
      } catch (e) {
        console.error(e);
        errEl.style.display = 'block';
        errEl.textContent = 'Gagal menyimpan, coba lagi.';
      }
    });
    bodyEl.querySelectorAll('.transfer-del-btn').forEach(btn => btn.addEventListener('click', () => {
      if (!requireOwnerForDelete()) return;
      const wrap = btn.closest('[data-id]');
      const id = wrap.dataset.id;
      showConfirm('Hapus catatan pemindahan dana ini? Saldo per rekening akan dihitung ulang tanpa pemindahan ini.', async () => {
        showLoadingModal('Menghapus catatan...');
        try {
          const tr = transferRekening.find(x => x.id === id);
          if (tr) await logToTrash('transfer', `Pemindahan dana - ${rupiah(tr.nominal||0)}`, tr);
          trashEntriesCache = null;
          await deleteTransferFromStore(id);
          transferRekening = transferRekening.filter(x => x.id !== id);
          closeLoadingModal();
          renderLaporan();
          showToast('Catatan pemindahan dana dihapus.');
        } catch (e) {
          console.error(e);
          closeLoadingModal();
          showToast('Gagal menghapus, coba lagi.');
        }
      });
    }));
  }

  function downloadBebanMigrasiTemplate() {
    if (!window.XLSX) { showToast('Modul Excel belum siap, coba lagi sebentar.'); return; }
    const wb = XLSX.utils.book_new();
    const aoa = [
      ['FORMAT UPLOAD BEBAN OPERASIONAL LAMA - LAPSTORE'],
      ['Petunjuk: JANGAN ubah urutan/nama kolom di baris ke-5. Tanggal format DD/MM/YYYY. Kolom Kategori isi persis salah satu: ' + BEBAN_KATEGORI.join(' / ') + '. Kalau Kategori = "Lainnya", isi juga Kategori Custom (nama beban bebas, misal "Iuran RT"); kalau kategori bukan Lainnya, kolom ini boleh dikosongkan. Setiap baris otomatis masuk ke Laporan > Beban Operasional dan mengurangi Laba Bersih pada bulan tanggal tersebut. Baris contoh boleh dihapus/ditimpa.'],
      [],
      [],
      ['Tanggal', 'Kategori', 'Kategori Custom (kalau Lainnya)', 'Nominal', 'Keterangan'],
      ['05/01/2026', 'Sewa Tempat', '', 3000000, 'Sewa toko bulan Januari'],
      ['10/01/2026', 'Gaji', '', 2500000, 'Gaji karyawan bulan Januari'],
      ['15/01/2026', 'Lainnya', 'Iuran RT', 100000, 'Iuran keamanan lingkungan'],
    ];
    XLSX.utils.book_append_sheet(wb, sheetFromAOA(aoa), 'Template Beban Operasional');
    XLSX.writeFile(wb, 'template-beban-operasional-lama.xlsx');
  }

  function handleBebanMigrasiUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById('bk-beban-migrasi-status');
    statusEl.style.color = 'var(--ink-soft)';
    statusEl.textContent = 'Membaca file...';
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        if (!window.XLSX) { statusEl.textContent = 'Modul Excel belum siap, coba lagi sebentar.'; statusEl.style.color = 'var(--money-out)'; return; }
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        let headerIdx = raw.findIndex(row => row.some(c => String(c).trim().toLowerCase().includes('kategori')));
        if (headerIdx === -1) headerIdx = 0;
        const dataRows = raw.slice(headerIdx + 1);
        const jobs = [];
        const errors = [];
        dataRows.forEach((row, idx) => {
          const [tglRaw, kategoriRaw, kategoriCustomRaw, nominalRaw, keteranganRaw] = row;
          if (!kategoriRaw && !nominalRaw) return; // baris kosong dilewati diam-diam
          const rowNum = headerIdx + idx + 2;
          const tglMs = parseTanggalDDMMYYYY(tglRaw);
          if (!tglMs) { errors.push(`Baris ${rowNum}: tanggal tidak valid (pakai format DD/MM/YYYY)`); return; }
          const kategori = String(kategoriRaw || '').trim();
          if (!BEBAN_KATEGORI.includes(kategori)) { errors.push(`Baris ${rowNum}: kategori "${kategori}" tidak dikenali (harus persis: ${BEBAN_KATEGORI.join(', ')})`); return; }
          const nominal = Number(nominalRaw);
          if (!nominal || nominal <= 0) { errors.push(`Baris ${rowNum}: nominal tidak valid`); return; }
          const kategoriCustom = kategori === 'Lainnya' ? String(kategoriCustomRaw || '').trim() : '';
          if (kategori === 'Lainnya' && !kategoriCustom) { errors.push(`Baris ${rowNum}: kategori "Lainnya" wajib isi Kategori Custom`); return; }
          const b = {
            id: uid(),
            kategori,
            kategoriCustom,
            nominal,
            keterangan: String(keteranganRaw || '').trim(),
            createdAt: tglMs,
            createdBy: currentUser ? currentUser.email : null,
          };
          jobs.push(async () => {
            await saveBebanItem(b);
            bebanList.push(b);
          });
        });
        if (!jobs.length) {
          statusEl.textContent = 'Tidak ada baris valid ditemukan. Pastikan format file sesuai template (unduh template dulu kalau belum).';
          statusEl.style.color = 'var(--money-out)';
          if (errors.length) console.error('Baris beban ditolak:', errors);
          return;
        }
        statusEl.textContent = `${jobs.length} baris siap dimigrasi. Menunggu konfirmasi...`;
        const errLines = errors.slice(0, 5).map(x => escapeAttr(x)).join('<br/>') + (errors.length > 5 ? `<br/>...dan ${errors.length - 5} lainnya` : '');
        const errPreview = errors.length ? `<br/><br/><span style="font-size:12px; color:var(--money-out); text-align:left; display:block;">${errors.length} baris akan dilewati (format tidak valid):<br/>${errLines}</span>` : '';
        const totalNilai = dataRows.reduce((s, row) => { const n = Number(row[3]); return s + (n>0?n:0); }, 0);
        showConfirm(
          `Ditemukan <strong>${jobs.length}</strong> catatan beban operasional yang valid di file ini, total senilai <strong>${rupiah(totalNilai)}</strong>.${errPreview}<br/><br/>Setiap baris akan langsung masuk ke Laporan &gt; Beban Operasional dan mengurangi Laba Bersih pada bulan tanggal masing-masing.<br/><br/>Lanjutkan migrasi?`,
          async () => {
            showLoadingModal(`Memproses 0/${jobs.length} baris...`);
            statusEl.textContent = `Memproses ${jobs.length} baris...`;
            try {
              const results = await runJobsInChunks(jobs, (done, total) => {
                updateLoadingModal(`Memproses ${done}/${total} baris...`);
                statusEl.textContent = `Memproses baris... (${done}/${total})`;
              });
              const failedCount = results.filter(r => r.status === 'rejected').length;
              results.forEach(r => { if (r.status === 'rejected') console.error('Gagal menyimpan baris beban migrasi:', r.reason); });
              const actualSuccess = jobs.length - failedCount;
              bebanList.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
              closeLoadingModal();
              const errNote = errors.length ? `\n${errors.length} baris dilewati (format tidak valid).` : '';
              const failNote = failedCount ? `\n${failedCount} baris GAGAL tersimpan (masalah koneksi) - coba upload ulang file yang sama, baris yang sudah berhasil tidak akan dobel.` : '';
              statusEl.textContent = `${actualSuccess} baris berhasil dimigrasi.${errNote}${failNote}`;
              statusEl.style.color = failedCount ? 'var(--money-out)' : 'var(--money-in)';
              showResultModal(
                failedCount ? 'Migrasi selesai (sebagian gagal)' : 'Migrasi berhasil',
                `${actualSuccess} catatan beban operasional lama berhasil dimigrasi, total ${rupiah(totalNilai)}.${errNote}${failNote}`,
                () => { activeTab = 'laporan'; laporanView = 'beban'; renderTabs(); renderBody(); }
              );
            } catch (err) {
              closeLoadingModal();
              console.error(err);
              statusEl.textContent = 'Gagal memproses migrasi. Coba lagi.';
              statusEl.style.color = 'var(--money-out)';
              showResultModal('Migrasi gagal', 'Terjadi kesalahan saat menyimpan data. Coba upload ulang file yang sama - baris yang sudah berhasil tidak akan dobel.');
            }
          },
          () => { statusEl.textContent = 'Migrasi dibatalkan.'; statusEl.style.color = 'var(--ink-soft)'; }
        );
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Gagal membaca file. Pastikan file berformat .xlsx sesuai template.';
        statusEl.style.color = 'var(--money-out)';
      } finally {
        e.target.value = '';
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function renderCariResultsHtml() {
    const q = cariQuery.trim().toLowerCase();
    if (!q) {
      return '<div class="bk-empty">Ketik kata kunci di atas untuk mulai mencari. Bisa cari kode barang, kode service, kode transaksi, nama pelanggan, nama barang, kreditur utang, atau keterangan beban.</div>';
    }

    const codeReg = getItemCodeRegistry();
    const hppData = computeHPP();
    const matchedStok = Object.values(computeStock()).filter(r => {
      if (/^Jasa Service Laptop/i.test(r.name)) return false;
      const code = codeReg.byName[r.name.trim().toLowerCase()] || '';
      return `${r.name} ${code}`.toLowerCase().includes(q);
    }).sort((a,b) => a.name.localeCompare(b.name)).slice(0, 30);

    const matchedTxns = txns.filter(t => {
      const nameField = t.type === 'penjualan' ? t.customerName : t.supplierName;
      const itemNames = (t.items||[]).map(i=>i.name).join(' ');
      const itemCodes = (t.items||[]).map(i=>i.code||'').join(' ');
      const bahanNames = (t.bahan||[]).map(i=>i.name).join(' ');
      const hasilNames = (t.hasil||[]).map(i=>i.name).join(' ');
      const haystack = `${t.kodeTransaksi||''} ${nameField||''} ${itemNames} ${itemCodes} ${bahanNames} ${hasilNames}`.toLowerCase();
      return haystack.includes(q);
    }).sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 30);

    const matchedServices = services.filter(s => `${s.kodeService||''} ${s.customerName||''} ${s.device||''} ${s.complaint||''}`.toLowerCase().includes(q))
      .sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 30);

    const matchedBeban = isOwner() ? bebanList.filter(b => {
      const label = (b.kategori === 'Lainnya' && b.kategoriCustom) ? b.kategoriCustom : b.kategori;
      return `${label||''} ${b.keterangan||''}`.toLowerCase().includes(q);
    }).sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 30) : [];

    const matchedUtang = isOwner() ? utangList.filter(u => `${u.kreditur||''} ${u.jenis||''} ${u.keterangan||''}`.toLowerCase().includes(q))
      .sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 30) : [];

    const total = matchedStok.length + matchedTxns.length + matchedServices.length + matchedBeban.length + matchedUtang.length;
    if (total === 0) {
      return `<div class="bk-empty">Tidak ada hasil untuk "${escapeAttr(cariQuery)}".</div>`;
    }

    let html = `<div class="bk-stok-note">Ditemukan ${total} hasil untuk "${escapeAttr(cariQuery)}".</div>`;
    if (matchedStok.length) {
      html += `<div class="bk-section-title" style="margin-top:16px; font-size:15px;">Stok Barang (${matchedStok.length})</div>`;
      html += matchedStok.map(r => cariStokRowHtml(r, codeReg, hppData)).join('');
    }
    if (matchedTxns.length) {
      html += `<div class="bk-section-title" style="margin-top:16px; font-size:15px;">Transaksi (${matchedTxns.length})</div>`;
      html += matchedTxns.map(cariTxnRowHtml).join('');
    }
    if (matchedServices.length) {
      html += `<div class="bk-section-title" style="margin-top:16px; font-size:15px;">Service Laptop (${matchedServices.length})</div>`;
      html += matchedServices.map(cariServiceRowHtml).join('');
    }
    if (matchedBeban.length) {
      html += `<div class="bk-section-title" style="margin-top:16px; font-size:15px;">Beban Operasional (${matchedBeban.length})</div>`;
      html += matchedBeban.map(cariBebanRowHtml).join('');
    }
    if (matchedUtang.length) {
      html += `<div class="bk-section-title" style="margin-top:16px; font-size:15px;">Utang/Kewajiban (${matchedUtang.length})</div>`;
      html += matchedUtang.map(cariUtangRowHtml).join('');
    }
    return html;
  }

  function cariStokRowHtml(r, codeReg, hppData) {
    const code = codeReg.byName[r.name.trim().toLowerCase()];
    const unitCost = hppData.getCurrentUnitCost(r.name);
    const totalNilai = r.qty > 0 ? r.qty * unitCost : 0;
    const statusBadge = r.qty <= 0 ? ' <span class="bk-badge belum">Sold Out</span>' : (r.qty < STOK_AMBANG_DEFAULT ? ' <span class="bk-badge belum">Stok menipis</span>' : '');
    return `<div class="bk-list-row-wrap">
      <div class="bk-list-row">
        <div class="bk-list-left">
          <div class="nm">${r.name}${code ? ` <span class="mono" style="font-size:10px; font-weight:700; color:var(--accent3-ink); background:var(--accent3-bg); padding:2px 7px; border-radius:6px;">${escapeAttr(code)}</span>` : ''}${statusBadge}</div>
          <div class="sub">Sisa ${r.qty.toLocaleString('id-ID')} ${r.unit||''} &middot; HPP ${rupiah(unitCost)}/unit &middot; Nilai ${rupiah(totalNilai)}</div>
        </div>
      </div>
      <div class="bk-row-actions"><button class="bk-btn ghost cari-open-stok" style="padding:6px 12px; font-size:12px;">Buka</button></div>
    </div>`;
  }

  function cariTxnRowHtml(t) {
    const isProd = t.type === 'produksi';
    const isIn = t.type === 'penjualan';
    const label = isProd ? 'Produksi' : (isIn ? (t.customerName || 'Penjualan') : (t.supplierName || 'Pembelian'));
    const names = isProd ? summarizeProduksi(t) : (t.items||[]).map(i=>i.name).join(', ');
    const amt = isProd ? '<div class="bk-list-amt" style="color:var(--ink-soft);">&mdash;</div>' : `<div class="bk-list-amt ${isIn?'in':'out'}">${isIn?'+':'-'}${rupiah(t.total)}</div>`;
    const kodeBadge = t.kodeTransaksi ? `<span class="mono" style="font-size:10px; font-weight:700; color:var(--accent3-ink); background:var(--accent3-bg); padding:2px 7px; border-radius:6px; margin-left:6px;">${escapeAttr(t.kodeTransaksi)}</span>` : '';
    return `<div class="bk-list-row-wrap">
      <div class="bk-list-row">
        <div class="bk-list-left"><div class="nm">${label}${kodeBadge}</div><div class="sub">${names} &middot; ${new Date(t.createdAt).toLocaleDateString('id-ID')}</div></div>
        ${amt}
      </div>
      <div class="bk-row-actions"><button class="bk-btn ghost cari-open-txn" data-id="${t.id}" style="padding:6px 12px; font-size:12px;">Buka</button></div>
    </div>`;
  }
  function cariServiceRowHtml(s) {
    return `<div class="bk-list-row-wrap">
      <div class="bk-list-row">
        <div class="bk-list-left"><div class="nm">${s.kodeService ? `<span class="mono" style="font-size:10.5px; color:var(--accent3-ink); background:var(--accent3-bg); padding:2px 7px; border-radius:6px; margin-right:6px;">${escapeAttr(s.kodeService)}</span>` : ''}${s.customerName || 'Tanpa nama'} &middot; ${s.device || '-'}</div><div class="sub">${s.complaint || ''} &middot; ${serviceStatusLabel(s.status)}</div></div>
      </div>
      <div class="bk-row-actions"><button class="bk-btn ghost cari-open-service" data-id="${s.id}" data-status="${s.status}" style="padding:6px 12px; font-size:12px;">Buka</button></div>
    </div>`;
  }
  function cariBebanRowHtml(b) {
    const label = (b.kategori === 'Lainnya' && b.kategoriCustom) ? b.kategoriCustom : b.kategori;
    return `<div class="bk-list-row-wrap">
      <div class="bk-list-row">
        <div class="bk-list-left"><div class="nm">${label}</div><div class="sub">${b.keterangan || ''} &middot; ${new Date(b.createdAt).toLocaleDateString('id-ID')}</div></div>
        <div class="bk-list-amt out">-${rupiah(b.nominal)}</div>
      </div>
      <div class="bk-row-actions"><button class="bk-btn ghost cari-open-beban" style="padding:6px 12px; font-size:12px;">Buka</button></div>
    </div>`;
  }
  function cariUtangRowHtml(u) {
    return `<div class="bk-list-row-wrap">
      <div class="bk-list-row">
        <div class="bk-list-left"><div class="nm">${u.kreditur}</div><div class="sub">${u.jenis} &middot; Sisa ${rupiah(u.sisaUtang)}</div></div>
      </div>
      <div class="bk-row-actions"><button class="bk-btn ghost cari-open-utang" style="padding:6px 12px; font-size:12px;">Buka</button></div>
    </div>`;
  }

  function wireCariEvents() {
    const input = document.getElementById('bk-cari-input');
    input.addEventListener('input', e => {
      cariQuery = e.target.value;
      const resultsEl = document.getElementById('bk-cari-results');
      if (resultsEl) resultsEl.innerHTML = renderCariResultsHtml();
      wireCariResultButtons();
    });
    wireCariResultButtons();
  }
  function wireCariResultButtons() {
    document.querySelectorAll('.cari-open-txn').forEach(b => b.addEventListener('click', () => startEdit(b.dataset.id)));
    document.querySelectorAll('.cari-open-service').forEach(b => b.addEventListener('click', () => {
      const s = services.find(x => x.id === b.dataset.id);
      activeTab = 'service';
      if (s && s.status === 'diambil') {
        svcView = 'riwayat';
        svcSearchQuery = s.customerName || '';
      } else {
        svcView = 'aktif';
        svcFilter = 'semua';
      }
      renderTabs(); renderBody();
    }));
    document.querySelectorAll('.cari-open-beban').forEach(b => b.addEventListener('click', () => {
      activeTab = 'laporan';
      laporanView = 'beban';
      laporanBulan = 'semua';
      renderTabs(); renderBody();
    }));
    document.querySelectorAll('.cari-open-utang').forEach(b => b.addEventListener('click', () => {
      activeTab = 'laporan';
      laporanView = 'utang';
      renderTabs(); renderBody();
    }));
    document.querySelectorAll('.cari-open-stok').forEach(b => b.addEventListener('click', () => {
      activeTab = 'stok';
      renderTabs(); renderBody();
    }));
  }

  // ---------- REFRESH DATA (agar transaksi dari user lain ikut muncul) ----------
  let isRefreshing = false;
  const REFRESH_UNSAFE_TABS = ['pembelian', 'penjualan', 'produksi', 'service', 'laporan', 'cari', 'pricelist', 'stok', 'migrasi'];
  async function refreshData(manual) {
    if (isRefreshing) return;
    const isUnsafe = REFRESH_UNSAFE_TABS.includes(activeTab) || !!editingTxnId || modalSlot.innerHTML.trim() !== '';
    if (isUnsafe) {
      // Jangan muat ulang data sama sekali saat sedang mengisi form -- kalau tetap dimuat ulang,
      // data yang sudah diketik tapi belum disimpan bisa hilang tertimpa data lama dari server.
      if (manual) showToast('Sedang mengisi data di tab ini -- refresh dijeda dulu supaya tidak ada yang hilang. Simpan dulu, baru refresh.');
      return;
    }
    isRefreshing = true;
    const btn = document.getElementById('bk-refresh-btn');
    if (btn && manual) btn.style.transform = 'rotate(180deg)';
    try {
      const before = txns.length;
      await loadTxns();
      await loadServices();
      await loadBeban();
      await loadClosings();
      await loadUtang();
      await loadUtangPayments();
      await loadModalEntries();
      await loadManualTagihan();
      await loadPricelistData();
      await loadDeletedStokNames();
      await loadTransferRekening();
      renderBody();
      if (manual) showToast(txns.length !== before ? 'Data diperbarui.' : 'Data sudah yang terbaru.');
    } catch (e) {
      console.error(e);
      if (manual) showToast('Gagal memuat data terbaru, coba lagi.');
    } finally {
      isRefreshing = false;
      if (btn && manual) setTimeout(() => { btn.style.transform = ''; }, 400);
    }
  }
  document.getElementById('bk-refresh-btn').addEventListener('click', () => refreshData(true));
  document.getElementById('bk-logout-btn').addEventListener('click', handleLogout);

  // ---------- LOGIN / AUTH GATE ----------
  let currentUser = null;
  let idleTimer = null;
  let idleLogoutTriggered = false;
  let bgRefreshIntervalId = null;
  let draftSaveIntervalId = null;
  const IDLE_TIMEOUT_MS = 30 * 60 * 1000; // 30 menit tanpa aktivitas

  function resetIdleTimer() {
    if (!currentUser) return;
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(handleIdleLogout, IDLE_TIMEOUT_MS);
  }
  function stopIdleTimer() {
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  }
  async function handleIdleLogout() {
    if (!currentUser) return;
    idleLogoutTriggered = true;
    try { await sbClient.auth.signOut(); } catch (e) { console.error(e); }
  }
  ['mousemove', 'mousedown', 'keydown', 'click', 'touchstart', 'scroll'].forEach(evt => {
    document.addEventListener(evt, resetIdleTimer, { passive: true });
  });

  function renderLoginScreen(errorMsg) {
    document.getElementById('bk-header-actions').style.display = 'none';
    tabsEl.innerHTML = '';
    bodyEl.innerHTML = `
      <div style="max-width:340px; margin:16px auto 8px;">
        <div style="text-align:center; margin-bottom:22px;">
          <div style="font-family:'Playfair Display',serif; font-weight:600; font-size:22px; color:var(--accent); margin-bottom:6px;">Masuk</div>
          <div style="color:var(--ink-soft); font-size:13px;">Gunakan akun yang sudah didaftarkan admin untuk toko ini.</div>
        </div>
        <div class="bk-field"><label>Email</label><input id="bk-login-email" type="email" placeholder="nama@email.com" /></div>
        <div class="bk-field"><label>Kata sandi</label><input id="bk-login-password" type="password" placeholder="Kata sandi" /></div>
        <div id="bk-login-err" class="bk-err" style="display:${errorMsg ? 'block' : 'none'};">${errorMsg ? escapeAttr(errorMsg) : ''}</div>
        <button class="bk-btn primary" id="bk-login-btn" style="width:100%;">Masuk</button>
      </div>
    `;
    document.getElementById('bk-login-btn').addEventListener('click', handleLoginSubmit);
    document.getElementById('bk-login-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleLoginSubmit(); });
    document.getElementById('bk-login-email').focus();
  }

  async function handleLoginSubmit() {
    const email = document.getElementById('bk-login-email').value.trim();
    const password = document.getElementById('bk-login-password').value;
    const errEl = document.getElementById('bk-login-err');
    const btn = document.getElementById('bk-login-btn');
    if (!email || !password) {
      errEl.style.display = 'block'; errEl.textContent = 'Isi email dan kata sandi.';
      return;
    }
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Memproses...';
    try {
      const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      currentUser = data.user;
      document.getElementById('bk-header-actions').style.display = 'flex';
      resetIdleTimer();
      init();
    } catch (e) {
      console.error(e);
      errEl.style.display = 'block';
      errEl.textContent = 'Email atau kata sandi salah, coba lagi.';
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  }

  function handleLogout() {
    if (!currentUser) return;
    showConfirm('Keluar dari akun ini?', async () => {
      try { await sbClient.auth.signOut(); } catch (e) { console.error(e); }
    });
  }

  async function bootstrapAuth() {
    try {
      const { data } = await sbClient.auth.getSession();
      if (data && data.session) {
        currentUser = data.session.user;
        document.getElementById('bk-header-actions').style.display = 'flex';
        resetIdleTimer();
        init();
      } else {
        renderLoginScreen();
      }
    } catch (e) {
      console.error(e);
      renderLoginScreen('Gagal memeriksa sesi login, coba refresh halaman.');
    }
    sbClient.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_OUT') {
        currentUser = null;
        stopIdleTimer();
        if (bgRefreshIntervalId) { clearInterval(bgRefreshIntervalId); bgRefreshIntervalId = null; }
        if (draftSaveIntervalId) { clearInterval(draftSaveIntervalId); draftSaveIntervalId = null; }
        const msg = idleLogoutTriggered ? 'Sesi berakhir otomatis karena tidak ada aktivitas selama 30 menit. Silakan masuk lagi untuk keamanan.' : undefined;
        idleLogoutTriggered = false;
        renderLoginScreen(msg);
      }
    });
  }

  async function init() {
    bodyEl.innerHTML = '<div class="bk-empty">Memuat data...</div>';
    await loadStoreName();
    await loadTxns();
    await loadServices();
    await loadBeban();
    await loadModalAwal();
    await loadClosings();
    await loadUtang();
    await loadUtangPayments();
    await loadModalEntries();
    await loadManualTagihan();
    await loadPricelistData();
    await loadDeletedStokNames();
    await loadTransferRekening();
    renderTabs();
    renderBody();
    checkAndOfferDraftRestore();
    runAutoBackupHarianJikaPerlu(); // jalan di background, tidak menunggu/blocking tampilan
    pruneOldTrash(); // bersihkan riwayat penghapusan yang sudah lewat masa retensi
    if (bgRefreshIntervalId) clearInterval(bgRefreshIntervalId);
    bgRefreshIntervalId = setInterval(() => refreshData(false), 20000);
    if (draftSaveIntervalId) clearInterval(draftSaveIntervalId);
    draftSaveIntervalId = setInterval(saveDraftsToLocal, 4000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && currentUser) refreshData(false);
    });
  }
  bootstrapAuth();
})();
</script>
