<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

#bk-root {
  --paper: #FFFFFF;
  --bg-page: #F7F5F0;
  --ink: #1F2937;
  --ink-soft: #6B7280;
  --line: #E3E0D8;
  --money-in: #2F6F4E;
  --money-in-bg: #E6F1EC;
  --money-out: #A6423A;
  --money-out-bg: #F5E9E7;
  --accent: #1B2A4A;
  --accent-ink: #0F1B33;
  --accent-bg: #E9EDF3;
  --accent2: #B08D57;
  --accent2-ink: #6B4F24;
  --accent2-bg: #F3EAD9;
  --accent3: #3F6B77;
  --accent3-ink: #1F3A40;
  --accent3-bg: #E4EEEF;
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  background: var(--bg-page);
  border-radius: 12px;
  padding: 0;
  max-width: 860px;
  margin: 0 auto;
  border: 1px solid var(--line);
  overflow: hidden;
}
#bk-root * { box-sizing: border-box; }
#bk-root .disp { font-family: 'Playfair Display', serif; }
#bk-root .mono { font-family: 'IBM Plex Mono', monospace; }

/* Header */
#bk-root .bk-header {
  background: var(--accent);
  color: #fff;
  padding: 20px 28px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: relative;
  border-bottom: 2px solid var(--accent2);
}
#bk-root .bk-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
#bk-root .bk-logo-mark {
  width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent2);
}
#bk-root .bk-header input {
  font-family: 'Playfair Display', serif;
  font-weight: 600;
  font-size: 22px;
  background: transparent;
  border: none;
  color: #fff;
  outline: none;
  padding: 2px 0;
  border-bottom: 1px dashed transparent;
  max-width: 100%;
  min-width: 0;
  flex: 1;
}
#bk-root .bk-header input:focus { border-bottom: 1px dashed rgba(255,255,255,.6); }
#bk-root .bk-header .bk-date {
  font-size: 11px; font-weight: 500; color: var(--accent2);
  font-family: 'IBM Plex Mono', monospace;
  background: transparent;
  border: 1px solid rgba(176,141,87,.55);
  padding: 5px 11px;
  border-radius: 6px;
  white-space: nowrap;
}
#bk-root #bk-refresh-btn {
  transition: transform .4s ease, background .15s ease;
  color: rgba(255,255,255,.85) !important;
  width: 30px; height: 30px; border-radius: 6px;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  display: flex; align-items: center; justify-content: center;
}
#bk-root #bk-refresh-btn:hover { background: rgba(255,255,255,.2); }
#bk-root .bk-shared-banner {
  background: var(--accent2-bg); color: var(--accent2-ink); font-size: 11.5px; font-weight: 500;
  padding: 7px 28px; border-bottom: 1px solid var(--line); line-height: 1.5;
}

/* Tabs */
#bk-root .bk-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 0 20px;
}
#bk-root .bk-tab {
  padding: 13px 15px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  user-select: none;
  transition: color .15s ease, border-color .15s ease;
}
#bk-root .bk-tab.active { color: var(--accent); border-bottom-color: var(--accent2); }
#bk-root .bk-tab:hover:not(.active) { color: var(--ink); }

#bk-root .bk-body { padding: 24px 28px 30px; background: var(--paper); min-height: 320px; }

/* Dashboard */
#bk-root .bk-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 12px; margin-bottom: 22px; }
#bk-root .bk-stat { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px; background: var(--paper); min-width: 0; }
#bk-root .bk-stat::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent2); }
#bk-root .bk-stat.in::before { background: var(--money-in); }
#bk-root .bk-stat.out::before { background: var(--money-out); }
#bk-root .bk-stat .lbl { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; font-weight: 600; overflow-wrap: break-word; }
#bk-root .bk-stat .val { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; word-break: break-word; }
#bk-root .bk-stat.in .val { color: var(--money-in); }
#bk-root .bk-stat.out .val { color: var(--money-out); }

#bk-root .bk-ai-box { border: 1px solid var(--accent3); background: var(--accent3-bg); border-radius: 10px; padding: 16px 18px; margin-bottom: 22px; }
#bk-root .bk-ai-box .ai-head { display:flex; align-items:center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
#bk-root .bk-ai-box .ai-title { font-size: 13px; font-weight: 700; color: var(--accent3-ink); }
#bk-root .bk-ai-box .ai-body { font-size: 13.5px; color: var(--ink); line-height: 1.6; white-space: pre-wrap; }
#bk-root .bk-ai-box .ai-body ul { margin: 6px 0 0 18px; padding: 0; }

#bk-root .bk-section-title { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 18px; margin: 0 0 12px; color: var(--ink); }

#bk-root .bk-list-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; gap: 10px;
}
#bk-root .bk-list-row:last-child { border-bottom: none; }
#bk-root .bk-list-left { display:flex; flex-direction:column; gap: 2px; min-width: 0; }
#bk-root .bk-list-left .nm { font-weight: 600; }
#bk-root .bk-list-left .sub { font-size: 11.5px; color: var(--ink-soft); }
#bk-root .bk-list-amt { font-family: 'IBM Plex Mono', monospace; font-weight: 600; white-space: nowrap; }
#bk-root .bk-list-amt.in { color: var(--money-in); }
#bk-root .bk-list-amt.out { color: var(--money-out); }
#bk-root .bk-empty { color: var(--ink-soft); font-size: 13px; padding: 18px 0; text-align: center; }

/* Forms */
#bk-root .bk-quickai { display: flex; gap: 8px; margin-bottom: 18px; }
#bk-root .bk-quickai input {
  flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13.5px;
  font-family: 'Inter', sans-serif; background: #fff;
}
#bk-root .bk-quickai input:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent2-bg); }
#bk-root .bk-btn {
  border: none; border-radius: 8px; padding: 10px 18px; font-size: 13.5px; font-weight: 600;
  cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap;
  transition: background .15s ease, opacity .15s ease;
}
#bk-root .bk-btn.primary { background: var(--accent); color: #fff; }
#bk-root .bk-btn.primary:hover { background: #142035; }
#bk-root .bk-btn.accent { background: var(--accent2); color: #3B2A0E; }
#bk-root .bk-btn.accent:hover { background: #9c7a48; }
#bk-root .bk-btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
#bk-root .bk-btn.ghost:hover { border-color: var(--accent); color: var(--accent-ink); }
#bk-root .bk-btn:active { opacity: .85; }
#bk-root .bk-btn:disabled { opacity: .5; cursor: default; }

#bk-root .bk-item-row { display: grid; grid-template-columns: 84px 1fr 70px 100px 110px 30px; gap: 8px; margin-bottom: 8px; align-items: center; }
#bk-root .bk-item-row input {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; font-size: 13px; font-family: 'Inter', sans-serif;
}
#bk-root .bk-item-row input:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent2-bg); }
#bk-root .bk-item-row .rm { cursor: pointer; color: var(--money-out); text-align: center; font-size: 16px; user-select: none; }
#bk-root .bk-item-head { display: grid; grid-template-columns: 84px 1fr 70px 100px 110px 30px; gap: 8px; font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; font-weight: 700; }

#bk-root .bk-prod-item-row { display: grid; grid-template-columns: 1fr 90px 90px 30px; gap: 8px; margin-bottom: 8px; align-items: center; }
#bk-root .bk-prod-item-row input {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; font-size: 13px; font-family: 'Inter', sans-serif;
}
#bk-root .bk-prod-item-row input:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent2-bg); }
#bk-root .bk-prod-item-row .rm { cursor: pointer; color: var(--money-out); text-align: center; font-size: 16px; user-select: none; }
#bk-root .bk-prod-item-head { display: grid; grid-template-columns: 1fr 90px 90px 30px; gap: 8px; font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; font-weight: 700; }

#bk-root .bk-field { margin-bottom: 14px; }
#bk-root .bk-field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 5px; font-weight: 600; }
#bk-root .bk-field input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-family: 'Inter', sans-serif; }
#bk-root .bk-field input:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent2-bg); }
#bk-root .bk-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

#bk-root .bk-total-line { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 18px; padding-top: 12px; border-top: 1px solid var(--line); }
#bk-root .bk-total-line .t-lbl { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
#bk-root .bk-total-line .t-val { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 700; color: var(--accent-ink); }
#bk-root .bk-err { color: var(--money-out); font-size: 12px; margin-top: -8px; margin-bottom: 12px; font-weight: 600; }
#bk-root .bk-msg { font-size: 12px; color: var(--ink-soft); margin-left: 4px; }

/* Riwayat filter */
#bk-root .bk-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
#bk-root .bk-chip { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink-soft); background: #fff; }
#bk-root .bk-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Row actions + badges */
#bk-root .bk-badge { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; display: inline-block; }
#bk-root .bk-badge.lunas { background: var(--money-in-bg); color: var(--money-in); }
#bk-root .bk-badge.belum { background: var(--money-out-bg); color: var(--money-out); }
#bk-root .bk-row-actions { display: flex; gap: 4px; flex-shrink: 0; }
#bk-root .bk-icon-btn {
  border: 1px solid var(--line); background: #fff; border-radius: 8px; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; color: var(--ink-soft);
  transition: border-color .15s ease, color .15s ease;
}
#bk-root .bk-icon-btn:hover { color: var(--accent-ink); border-color: var(--accent); }
#bk-root .bk-icon-btn.danger:hover { color: var(--money-out); border-color: var(--money-out); }
#bk-root .bk-list-row-wrap { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
#bk-root .bk-list-row-wrap:last-child { border-bottom: none; }
#bk-root .bk-list-row-wrap .bk-list-row { flex: 1; padding: 0; border-bottom: none; }
#bk-root .bk-row-check { width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
#bk-root .bk-select-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
#bk-root .bk-select-all { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); cursor: pointer; user-select: none; font-weight: 600; }
#bk-root .bk-select-all input { width: 16px; height: 16px; cursor: pointer; }
#bk-root .bk-bulk-del { display: none; background: var(--money-out); color: #fff; }
#bk-root .bk-bulk-del.show { display: inline-flex; }
#bk-root .bk-checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; }
#bk-root .bk-checkbox-row input { width: 16px; height: 16px; }
#bk-root .bk-cancel-edit { margin-bottom: 14px; font-size: 12px; color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: underline; }

/* Stok */
#bk-root .bk-stok-row {
  display: grid; grid-template-columns: 1fr 90px 100px; gap: 10px; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px;
}
#bk-root .bk-stok-row:last-child { border-bottom: none; }
#bk-root .bk-stok-row .qty { font-family: 'IBM Plex Mono', monospace; font-weight: 600; text-align: right; }
#bk-root .bk-stok-row.low .qty { color: var(--money-out); }
#bk-root .bk-stok-note { font-size: 12px; color: var(--ink-soft); margin-bottom: 16px; }

/* Piutang */
#bk-root .bk-piutang-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
#bk-root .bk-piutang-row:last-child { border-bottom: none; }
#bk-root .bk-piutang-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
#bk-root .bk-piutang-actions { display: flex; gap: 8px; }

/* Receipt modal */
#bk-root .bk-overlay {
  position: fixed; inset: 0; background: rgba(15,27,51,.5); display: flex; align-items: center; justify-content: center;
  z-index: 999; padding: 24px;
}
#bk-root .bk-receipt {
  width: 300px; background: var(--paper); padding: 26px 20px 4px;
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink);
  box-shadow: 0 12px 28px rgba(15,27,51,.22);
  border-radius: 10px 10px 0 0;
  position: relative;
  overflow: hidden;
}
#bk-root .bk-receipt::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--accent2);
}
#bk-root .bk-receipt .r-store { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 17px; text-align: center; color: var(--accent-ink); }
#bk-root .bk-receipt .r-sub { text-align: center; color: var(--ink-soft); font-size: 10.5px; margin-top: 2px; }
#bk-root .bk-receipt hr { border: none; border-top: 1px dashed var(--line); margin: 12px 0; }
#bk-root .bk-receipt .r-item { margin-bottom: 6px; }
#bk-root .bk-receipt .r-item-top { display: flex; justify-content: space-between; }
#bk-root .bk-receipt .r-item-sub { color: var(--ink-soft); font-size: 10.5px; margin-top: 1px; }
#bk-root .bk-receipt .r-item .qn { color: var(--ink-soft); font-size: 11px; }
#bk-root .bk-receipt .r-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; margin-top: 6px; color: var(--accent-ink); }
#bk-root .bk-receipt .r-note { text-align: center; font-size: 10.5px; color: var(--ink-soft); margin-top: 10px; }
#bk-root .zigzag {
  height: 12px;
  background:
    linear-gradient(135deg, var(--bg-page) 50%, transparent 50%) 0 0/16px 12px repeat-x,
    linear-gradient(-135deg, var(--bg-page) 50%, transparent 50%) 0 0/16px 12px repeat-x;
}
#bk-root .bk-receipt-actions { width: 300px; display: flex; gap: 8px; margin-top: 14px; }
#bk-root .bk-receipt-actions .bk-btn { flex: 1; }
#bk-root .bk-close-x { position: absolute; top: 14px; right: 14px; cursor: pointer; color: #fff; font-size: 22px; line-height: 1; }
#bk-root .bk-receipt-wrap { position: relative; display:flex; flex-direction: column; align-items: center; }

/* Service Laptop */
#bk-root .bk-service-status-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
#bk-root .bk-svc-card { border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; background:#fff; }
#bk-root .bk-svc-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
#bk-root .bk-svc-top .nm { font-weight:600; font-size:14.5px; font-family:'Playfair Display', serif; }
#bk-root .bk-svc-top .sub { font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
#bk-root .bk-svc-badge { font-size:10.5px; font-weight:700; padding:4px 11px; border-radius:999px; white-space:nowrap; display:inline-block; }
#bk-root .bk-svc-badge.diterima { background:var(--accent-bg); color:var(--accent-ink); }
#bk-root .bk-svc-badge.diagnosa { background:var(--accent2-bg); color:var(--accent2-ink); }
#bk-root .bk-svc-badge.menunggu_konfirmasi { background:var(--money-out-bg); color:var(--money-out); }
#bk-root .bk-svc-badge.dikerjakan { background:var(--accent3-bg); color:var(--accent3-ink); }
#bk-root .bk-svc-badge.selesai { background:var(--money-in-bg); color:var(--money-in); }
#bk-root .bk-svc-badge.diambil { background:#EDEBE6; color:var(--ink-soft); }
#bk-root .bk-svc-detail { font-size:12.5px; color:var(--ink); line-height:1.6; margin:8px 0; }
#bk-root .bk-svc-detail .lbl { color:var(--ink-soft); font-weight: 600; }
#bk-root .bk-svc-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
#bk-root .bk-svc-row-actions { display:flex; gap:4px; flex-shrink:0; }
#bk-root .bk-svc-timeline { font-size:10.5px; color:var(--ink-soft); margin-top:8px; border-top:1px dashed var(--line); padding-top:8px; }
#bk-root .bk-svc-dp-box { background: var(--accent2-bg); border: 1px solid var(--accent2); border-radius: 8px; padding: 12px 14px; margin: 10px 0; font-size: 13px; }

@media (max-width: 560px) {
  #bk-root { border-radius: 0; max-width: 100%; overflow: visible; }
  #bk-root .bk-header { padding: 16px 16px 16px; flex-wrap: wrap; }
  #bk-root .bk-header-left { min-width: 0; }
  #bk-root .bk-logo-mark { width: 32px; height: 32px; border-radius: 8px; }
  #bk-root .bk-header input { font-size: 18px; max-width: 100%; }
  #bk-root .bk-header .bk-date { font-size: 10px; padding: 4px 9px; }
  #bk-root .bk-tabs { padding: 0 10px; }
  #bk-root .bk-tab { padding: 10px 12px; font-size: 12px; }
  #bk-root .bk-body { padding: 16px 16px 22px; min-height: 260px; }
  #bk-root .bk-stats { grid-template-columns: 1fr 1fr; gap: 8px; }
  #bk-root .bk-stat { padding: 12px 11px 10px; }
  #bk-root .bk-stat .val { font-size: 14px; }
  #bk-root .bk-two-col { grid-template-columns: 1fr; }
  #bk-root .bk-quickai { flex-direction: column; }
  #bk-root .bk-quickai input { width: 100%; }
  #bk-root .bk-quickai .bk-btn { width: 100%; }
  #bk-root .bk-item-row {
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "code code" "name name" "qty unit" "price price" ;
    row-gap: 6px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px dashed var(--line); position: relative;
  }
  #bk-root .bk-item-row .f-code { grid-area: code; }
  #bk-root .bk-item-row .f-name { grid-area: name; }
  #bk-root .bk-item-row .f-qty { grid-area: qty; }
  #bk-root .bk-item-row .f-unit { grid-area: unit; }
  #bk-root .bk-item-row .f-price { grid-area: price; }
  #bk-root .bk-item-row .rm { position: absolute; top: 0; right: 0; }
  #bk-root .bk-item-head { display: none; }
  #bk-root .bk-prod-item-head { display: none; }
  #bk-root .bk-prod-item-row {
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "name name" "qty unit";
    row-gap: 6px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px dashed var(--line); position: relative;
  }
  #bk-root .bk-prod-item-row .f-name { grid-area: name; }
  #bk-root .bk-prod-item-row .f-qty { grid-area: qty; }
  #bk-root .bk-prod-item-row .f-unit { grid-area: unit; }
  #bk-root .bk-prod-item-row .rm { position: absolute; top: 0; right: 0; }
  #bk-root .bk-btn { padding: 10px 14px; font-size: 13px; }
  #bk-root .bk-list-row-wrap { align-items: flex-start; }
  #bk-root .bk-row-actions { flex-direction: column; }
  #bk-root .bk-piutang-actions { flex-wrap: wrap; }

// Shim agar seluruh kode aplikasi (yang aslinya ditulis untuk window.storage milik Claude)
// tetap jalan tanpa perlu diubah, cukup dialihkan ke tabel kv_store di Supabase.
window.storage = {
  async get(key) {
    const { data, error } = await sbClient.from('kv_store').select('value').eq('key', key).maybeSingle();
    if (error) throw error;
    if (!data) throw new Error('key not found: ' + key);
    return { key, value: data.value, shared: true };
  },
  async set(key, value) {
    const { error } = await sbClient.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
    if (error) throw error;
    return { key, value, shared: true };
  },
  async delete(key) {
    const { error } = await sbClient.from('kv_store').delete().eq('key', key);
    if (error) throw error;
    return { key, deleted: true, shared: true };
  },
  async list(prefix) {
    let q = sbClient.from('kv_store').select('key');
    if (prefix) q = q.like('key', `${prefix}%`);
    const { data, error } = await q;
    if (error) throw error;
    return { keys: (data || []).map(r => r.key), prefix, shared: true };
  },
};

  async function callClaudeAI(prompt) {
    if (!AI_PROXY_URL) {
      const err = new Error('AI_PROXY_NOT_CONFIGURED');
      err.friendly = 'Fitur AI belum diatur. Lihat README.md bagian "Mengaktifkan fitur AI" untuk memasang proxy amannya.';
      throw err;
    }
    const res = await fetch(AI_PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) throw new Error('AI proxy error: ' + res.status);
    const data = await res.json();
    return (data.content || []).map(c => c.text || '').join('\n').trim();
  }

  async function runAiInsight() {
    const btn = document.getElementById('bk-ai-btn');
    const out = document.getElementById('bk-ai-out');
    btn.disabled = true; btn.textContent = 'Menganalisis...';
    out.textContent = 'Sedang menganalisis transaksi...';
    try {
      const t = totals();
      const last = txns.slice(0, 15).map(x => {
        if (x.type === 'produksi') return `produksi | ${summarizeProduksi(x).replace(/&rarr;/, '->')}`;
        return `${x.type} | ${x.items.map(i=>i.name+' x'+i.qty).join(', ')} | total ${x.total}`;
      }).join('\n');
      const prompt = `Data keuangan UMKM:\nTotal pemasukan: ${t.masuk}\nTotal pengeluaran: ${t.keluar}\nSaldo: ${t.saldo}\n15 transaksi terakhir:\n${last || '(belum ada transaksi)'}\n\nBerikan maksimal 3 poin analisis singkat dan actionable dalam Bahasa Indonesia (bahan baku yang sering dibeli, produk yang laku, atau saran arus kas). Setiap poin maksimal 1 kalimat. Jangan pakai markdown, cukup teks biasa dengan baris baru per poin, awali tiap poin dengan tanda "-".`;
      const text = await callClaudeAI(prompt);
      out.textContent = text || 'Belum cukup data untuk dianalisis.';
    } catch (e) {
      out.textContent = e.friendly || 'Gagal memuat analisis. Coba lagi.';
      console.error(e);
    } finally {
      btn.disabled = false; btn.textContent = 'Buat analisis';
    }
  }

  // ---------- KODE BARANG (barcode) ----------
  function getItemCodeRegistry() {
    const byCode = {};
    const byName = {};
    const sorted = [...txns].filter(t => t.type === 'pembelian').sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    sorted.forEach(t => {
      (t.items || []).forEach(i => {
        if (i.code && i.code.trim()) {
          const code = i.code.trim();
          byCode[code.toLowerCase()] = { name: i.name, unit: i.unit || '', code };
          if (i.name) byName[i.name.trim().toLowerCase()] = code;
        }
      });
    });
    return { byCode, byName };
  }
  function itemCodesDatalistHtml() {
    const reg = getItemCodeRegistry();
    const codes = Object.values(reg.byCode).map(v => v.code);
    return `<datalist id="bk-item-codes">${codes.map(c => `<option value="${escapeAttr(c)}"></option>`).join('')}</datalist>`;
  }
  function applyItemCodeLookup(item, type) {
    const codeVal = (item.code || '').trim();
    if (!codeVal) return;
    const reg = getItemCodeRegistry();
    const match = reg.byCode[codeVal.toLowerCase()];
    if (match) {
      item.name = match.name;
      item.unit = match.unit;
      renderForm(type);
      showToast(`Kode ditemukan: ${match.name}`);
    }
  }

  function getKnownItemNames() {
    const set = new Set();
    txns.forEach(t => {
      if (t.type === 'pembelian' || t.type === 'penjualan') {
        (t.items || []).forEach(i => { if (i.name) set.add(i.name.trim()); });
      } else if (t.type === 'produksi') {
        (t.bahan || []).forEach(i => { if (i.name) set.add(i.name.trim()); });
        (t.hasil || []).forEach(i => { if (i.name) set.add(i.name.trim()); });
      }
    });
    return Array.from(set).sort();
  }
  function itemNamesDatalistHtml() {
    return `<datalist id="bk-item-names">${getKnownItemNames().map(n => `<option value="${escapeAttr(n)}"></option>`).join('')}</datalist>`;
  }

  function itemRowHtml(item) {
    return `<div class="bk-item-row" data-id="${item.id}">
      <input class="f-code" value="${escapeAttr(item.code||'')}" placeholder="Kode" list="bk-item-codes" />
      <input class="f-name" value="${escapeAttr(item.name)}" placeholder="Nama item" list="bk-item-names" />
      <input class="f-qty" type="number" min="0" value="${escapeAttr(item.qty)}" placeholder="0" />
      <input class="f-unit" value="${escapeAttr(item.unit||'')}" placeholder="pcs/kg" />
      <input class="f-price" type="number" min="0" value="${escapeAttr(item.price)}" placeholder="0" />
      <div class="rm" title="Hapus item">&times;</div>
    </div>`;
  }

  function refreshTotal(type) {
    const st = formState[type];
    const itemsTotal = st.items.reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);
    const ongkosKirim = type === 'pembelian' ? (Number(st.ongkosKirim) || 0) : 0;
    const tv = bodyEl.querySelector('.t-val');
    if (tv) tv.textContent = rupiah(itemsTotal + ongkosKirim);
  }

  function escapeAttr(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  async function runQuickAi(type) {
    const input = document.getElementById('bk-quick-input');
    const btn = document.getElementById('bk-quick-btn');
    const text = input.value.trim();
    if (!text) { input.placeholder = 'Tulis dulu deskripsi transaksinya...'; input.focus(); return; }
    btn.disabled = true; btn.textContent = 'Memproses...';
    try {
      const schemaNote = type === 'penjualan'
        ? 'Format JSON: [{"name":"nama produk","qty":angka,"price":harga satuan dalam rupiah}]'
        : 'Format JSON: [{"name":"nama bahan","qty":angka,"unit":"satuan seperti kg/pcs/liter","price":harga satuan dalam rupiah}]';
      const prompt = `Ubah teks transaksi berikut menjadi data terstruktur.\nTeks: "${text}"\n${schemaNote}\nBalas HANYA dengan JSON array yang valid, tanpa teks lain, tanpa markdown code fence.`;
      const raw = await callClaudeAI(prompt);
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      if (Array.isArray(parsed) && parsed.length) {
        formState[type].items = parsed.map(p => ({ id: uid(), name: p.name || '', qty: p.qty ?? '', unit: p.unit || '', price: p.price ?? '' }));
        input.value = '';
      }
      renderForm(type);
    } catch (e) {
      console.error(e);
      const err = document.getElementById('bk-form-err');
      if (err) { err.style.display = 'block'; err.textContent = e.friendly || 'AI tidak bisa membaca teks itu, coba tulis ulang atau isi manual.'; }
      btn.disabled = false; btn.textContent = 'Isi otomatis (AI)';
    }
  }

  async function saveTransaction(type, withReceipt) {
    const st = formState[type];
    const errEl = document.getElementById('bk-form-err');
    const validItems = st.items.filter(i => i.name && Number(i.qty) > 0 && Number(i.price) >= 0);
    if (validItems.length === 0) {
      errEl.style.display = 'block';
      errEl.textContent = 'Isi minimal satu item dengan nama, jumlah, dan harga yang valid.';
      return;
    }
    errEl.style.display = 'none';
    const itemsTotal = validItems.reduce((s,i) => s + Number(i.qty) * Number(i.price), 0);
    const ongkosKirim = type === 'pembelian' ? (Number(st.ongkosKirim) || 0) : 0;
    const total = itemsTotal + ongkosKirim;
    const isEdit = !!editingTxnId;
    const existing = isEdit ? txns.find(x => x.id === editingTxnId) : null;
    const txn = {
      id: isEdit ? editingTxnId : uid(),
      type,
      items: validItems.map(i => ({ name: i.name, qty: Number(i.qty), unit: i.unit || '', price: Number(i.price), code: (i.code||'').trim() })),
      total,
      ongkosKirim: type === 'pembelian' ? ongkosKirim : undefined,
      customerName: type === 'penjualan' ? st.party : '',
      customerPhone: type === 'penjualan' ? st.phone : '',
      supplierName: type === 'pembelian' ? st.party : '',
      paid: type === 'penjualan' ? (st.paid !== false) : undefined,
      rekening: type === 'penjualan' ? st.rekening : undefined,
      createdAt: isEdit && existing ? existing.createdAt : Date.now(),
      createdBy: isEdit && existing ? existing.createdBy : (currentUser ? currentUser.email : null),
    };
    const clickedBtnId = withReceipt === false ? 'bk-save-noresi-btn' : 'bk-save-btn';
    const saveBtn = document.getElementById(clickedBtnId) || document.getElementById('bk-save-btn');
    const otherBtn = document.getElementById(withReceipt === false ? 'bk-save-btn' : 'bk-save-noresi-btn');
    const originalLabel = saveBtn.textContent;
    saveBtn.disabled = true; saveBtn.textContent = 'Menyimpan...';
    if (otherBtn) otherBtn.disabled = true;
    try {
      await saveTxn(txn);
      if (isEdit) {
        const idx = txns.findIndex(x => x.id === editingTxnId);
        if (idx >= 0) txns[idx] = txn; else txns.unshift(txn);
      } else {
        txns.unshift(txn);
      }
      const wasEdit = isEdit;
      editingTxnId = null;
      formState[type] = type === 'penjualan'
        ? { items: [blankItem()], party: '', phone: '', paid: true, note: '', rekening: BANK_ACCOUNTS[0].id }
        : { items: [blankItem()], party: '', note: '', ongkosKirim: '' };
      if (wasEdit) {
        activeTab = 'riwayat';
        renderTabs(); renderBody();
      } else if (type === 'penjualan' && withReceipt !== false) {
        showReceipt(txn);
      } else if (type === 'penjualan') {
        activeTab = 'dashboard';
        renderTabs(); renderBody();
        showToast('Penjualan tersimpan tanpa resi.');
      } else {
        activeTab = 'dashboard';
        renderTabs(); renderBody();
      }
    } catch (e) {
      errEl.style.display = 'block';
      errEl.textContent = 'Gagal menyimpan transaksi. Coba lagi.';
      console.error(e);
      saveBtn.disabled = false; saveBtn.textContent = originalLabel;
      if (otherBtn) otherBtn.disabled = false;
    }
  }

  function startEdit(id) {
    const t = txns.find(x => x.id === id);
    if (!t) return;
    editingTxnId = id;
    if (t.type === 'produksi') {
      produksiFormState = {
        bahan: (t.bahan || []).map(i => ({ id: uid(), name: i.name, qty: i.qty, unit: i.unit || '' })),
        hasil: (t.hasil || []).map(i => ({ id: uid(), name: i.name, qty: i.qty, unit: i.unit || '' })),
      };
      activeTab = 'produksi';
      renderTabs(); renderBody();
      return;
    }
    formState[t.type] = t.type === 'penjualan'
      ? { items: t.items.map(i => ({ id: uid(), name: i.name, qty: i.qty, unit: i.unit || '', price: i.price, code: i.code || '' })), party: t.customerName || '', phone: t.customerPhone || '', paid: t.paid !== false, note: '', rekening: t.rekening || BANK_ACCOUNTS[0].id }
      : { items: t.items.map(i => ({ id: uid(), name: i.name, qty: i.qty, unit: i.unit || '', price: i.price, code: i.code || '' })), party: t.supplierName || '', note: '', ongkosKirim: t.ongkosKirim || '' };
    activeTab = t.type;
    renderTabs(); renderBody();
  }

  async function syncServiceAfterLinkedTxnDeleted(deletedTxnId) {
    const s = findLinkedService(deletedTxnId);
    if (!s) return;
    try {
      if (s.prodTxnId === deletedTxnId) {
        if (s.linkedTxnId) {
          try { await deleteTxnFromStore(s.linkedTxnId); } catch (e) { /* mungkin sudah terhapus */ }
          txns = txns.filter(x => x.id !== s.linkedTxnId);
        }
        s.prodTxnId = null;
        s.linkedTxnId = null;
        s.serviceItemName = null;
        s.status = 'dikerjakan';
        s.updatedAt = Date.now();
        s.history = s.history || [];
        s.history.push({ status: 'dikerjakan (otomatis dikembalikan, catatan sparepart dihapus)', at: Date.now() });
        await saveService(s);
        showToast(`Catatan sparepart untuk service "${s.customerName}" dihapus, status dikembalikan ke "Dikerjakan".`);
      } else if (s.linkedTxnId === deletedTxnId) {
        s.linkedTxnId = null;
        s.status = 'selesai';
        s.updatedAt = Date.now();
        s.history = s.history || [];
        s.history.push({ status: 'selesai (otomatis dikembalikan, transaksi pemasukan dihapus)', at: Date.now() });
        await saveService(s);
        showToast(`Transaksi pemasukan untuk service "${s.customerName}" dihapus, status dikembalikan ke "Selesai".`);
      } else if (s.dpTxnId === deletedTxnId) {
        s.dpAmount = 0;
        s.dpTxnId = null;
        s.updatedAt = Date.now();
        s.history = s.history || [];
        s.history.push({ status: 'DP dibatalkan otomatis (transaksi DP dihapus dari Riwayat)', at: Date.now() });
        await saveService(s);
        showToast(`Catatan DP untuk service "${s.customerName}" dihapus dari Riwayat.`);
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function removeTxn(id) {
    const t = txns.find(x => x.id === id);
    if (!t) return;
    const linkedSvc = findLinkedService(id);
    const confirmMsg = linkedSvc
      ? `Transaksi ini terhubung dengan data Service Laptop atas nama "${linkedSvc.customerName}" (${linkedSvc.device}). Menghapusnya akan mengembalikan status service tersebut secara otomatis. Lanjutkan hapus?`
      : 'Hapus transaksi ini? Tindakan ini tidak bisa dibatalkan.';
    showConfirm(confirmMsg, async () => {
      try {
        await deleteTxnFromStore(id);
        txns = txns.filter(x => x.id !== id);
        await syncServiceAfterLinkedTxnDeleted(id);
        renderBody();
        if (!linkedSvc) showToast('Transaksi berhasil dihapus.');
      } catch (e) {
        console.error(e);
        showToast('Gagal menghapus transaksi, coba lagi.');
      }
    });
  }

  // ---------- RIWAYAT ----------
  function renderRiwayat() {
    const months = availableMonths();
    const byMonth = txns.filter(t => riwayatMonth === 'semua' ? true : monthKey(t.createdAt) === riwayatMonth);
    const filtered = byMonth.filter(t => riwayatFilter === 'semua' ? true : t.type === riwayatFilter);
    const masuk = byMonth.filter(t => t.type === 'penjualan').reduce((s,t) => s + t.total, 0);
    const keluar = byMonth.filter(t => t.type === 'pembelian').reduce((s,t) => s + t.total, 0);
    const hppAll = computeHPP();
    const hppBulan = byMonth.filter(t => t.type === 'penjualan').reduce((s,t) => s + (hppAll.hppByTxn[t.id] || 0), 0);
    const labaKotorBulan = masuk - hppBulan;

    bodyEl.innerHTML = `
      <div class="bk-field" style="max-width:260px;">
        <label>Bulan</label>
        <select id="bk-month-select" style="width:100%; border:1.5px solid var(--line); border-radius:12px; padding:9px 11px; font-size:13.5px; font-family:'Inter',sans-serif; background:#fff;">

        <div class="bk-stat in"><div class="lbl">Laba kotor</div><div class="val" style="color:${labaKotorBulan>=0?'var(--money-in)':'var(--money-out)'}">${rupiah(labaKotorBulan)}</div></div>

        <div class="bk-chip ${riwayatFilter==='penjualan'?'active':''}" data-f="penjualan">Penjualan</div>
        <div class="bk-chip ${riwayatFilter==='pembelian'?'active':''}" data-f="pembelian">Pembelian</div>
        <div class="bk-chip ${riwayatFilter==='produksi'?'active':''}" data-f="produksi">Produksi</div>
      </div>
      ${filtered.length ? `<div class="bk-select-bar">
        <label class="bk-select-all">
          <input type="checkbox" id="bk-select-all" ${filtered.length && filtered.every(t=>selectedTxnIds.has(t.id)) ? 'checked' : ''} />
          Pilih semua (${filtered.length})
        </label>
        <button class="bk-btn bk-bulk-del ${selectedTxnIds.size ? 'show' : ''}" id="bk-bulk-del-btn">Hapus terpilih (${selectedTxnIds.size})</button>
      </div>` : ''}
      <div id="bk-riwayat-list">${filtered.length ? filtered.map(riwayatRowHtml).join('') : '<div class="bk-empty">Tidak ada transaksi pada kategori/bulan ini.</div>'}</div>
    `;
    document.getElementById('bk-month-select').addEventListener('change', (e) => { riwayatMonth = e.target.value; selectedTxnIds.clear(); renderRiwayat(); });
    document.getElementById('bk-download-lr').addEventListener('click', () => downloadLabaRugi(riwayatMonth, byMonth, masuk, keluar, hppBulan, labaKotorBulan));
    document.getElementById('bk-download-lr-excel').addEventListener('click', () => downloadLabaRugiExcel(riwayatMonth, byMonth, masuk, keluar, hppBulan, labaKotorBulan));
    bodyEl.querySelectorAll('.bk-chip').forEach(c => c.addEventListener('click', () => { riwayatFilter = c.dataset.f; selectedTxnIds.clear(); renderRiwayat(); }));
    bodyEl.querySelectorAll('.bk-list-row-wrap').forEach(w => {
      const id = w.dataset.txn;
      w.querySelector('.edit-btn').addEventListener('click', () => startEdit(id));
      w.querySelector('.del-btn').addEventListener('click', () => removeTxn(id));
      const chk = w.querySelector('.bk-row-check');
      if (chk) chk.addEventListener('change', () => {
        if (chk.checked) selectedTxnIds.add(id); else selectedTxnIds.delete(id);
        renderRiwayat();
      });

      if (selectAllBox.checked) filtered.forEach(t => selectedTxnIds.add(t.id));

      renderRiwayat();
    });

      const idsArr = Array.from(selectedTxnIds);
      const anyLinked = idsArr.some(id => findLinkedService(id));

        : `Hapus ${idsArr.length} transaksi terpilih? Tindakan ini tidak bisa dibatalkan.`;
      showConfirm(confirmMsg, async () => {
        const ids = Array.from(selectedTxnIds);
        try {
          for (const id of ids) {
            await deleteTxnFromStore(id);
            txns = txns.filter(x => x.id !== id);
            await syncServiceAfterLinkedTxnDeleted(id);
          }

  // ---------- STOK ----------
  function computeStock() {
    const stockMap = {};
    function addQty(name, unit, delta) {
      const key = (name || '').trim().toLowerCase();
      if (!key) return;
      if (!stockMap[key]) stockMap[key] = { name: name.trim(), unit: unit || '', qty: 0 };
      stockMap[key].qty += delta;
      if (unit) stockMap[key].unit = unit;
    }
    txns.forEach(t => {
      if (t.type === 'pembelian') {
        t.items.forEach(i => addQty(i.name, i.unit, Number(i.qty) || 0));
      } else if (t.type === 'penjualan') {
        t.items.forEach(i => addQty(i.name, i.unit, -(Number(i.qty) || 0)));
      } else if (t.type === 'produksi') {
        (t.bahan || []).forEach(i => addQty(i.name, i.unit, -(Number(i.qty) || 0)));
        (t.hasil || []).forEach(i => addQty(i.name, i.unit, Number(i.qty) || 0));
      }
    });
    return stockMap;
  }

  // ---------- HPP (Harga Pokok Penjualan) via metode rata-rata bergerak ----------
  function computeHPP() {
    const sorted = [...txns].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const avg = {}; // key -> { qty, cost } biaya kumulatif per item
    const keyOf = n => (n || '').trim().toLowerCase();

    function addStock(name, qty, cost) {
      const k = keyOf(name);
      if (!k || qty <= 0) return;
      if (!avg[k]) avg[k] = { name: (name || '').trim(), qty: 0, cost: 0 };
      avg[k].qty += qty;
      avg[k].cost += cost;
    }
    function unitCostOf(name) {
      const k = keyOf(name);
      const r = avg[k];
      return (r && r.qty > 0) ? r.cost / r.qty : 0;
    }
    function removeStock(name, qty) {
      const k = keyOf(name);
      const r = avg[k];
      const uc = unitCostOf(name);
      if (r) {
        r.qty -= qty;
        r.cost -= qty * uc;
        if (r.qty < 0.0000001) { r.qty = 0; r.cost = 0; }
      }
      return uc;
    }

    const hppByTxn = {};
    const prodCostByTxn = {};
    let totalRevenue = 0, totalHPP = 0;

    sorted.forEach(t => {
      if (t.type === 'pembelian') {
        const shipping = Number(t.ongkosKirim) || 0;
        const subtotal = t.items.reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);
        t.items.forEach(i => {
          const qty = Number(i.qty) || 0;
          const itemValue = qty * (Number(i.price) || 0);
          const allocShipping = shipping > 0 ? (subtotal > 0 ? shipping * (itemValue / subtotal) : shipping / t.items.length) : 0;
          addStock(i.name, qty, itemValue + allocShipping);
        });
      } else if (t.type === 'produksi') {
        let batchCost = 0;
        (t.bahan || []).forEach(i => {
          const qty = Number(i.qty) || 0;
          batchCost += qty * removeStock(i.name, qty);
        });
        const totalHasilQty = (t.hasil || []).reduce((s, i) => s + (Number(i.qty) || 0), 0) || 1;
        const hasilDetail = [];
        (t.hasil || []).forEach(i => {
          const qty = Number(i.qty) || 0;
          const allocCost = batchCost * (qty / totalHasilQty);
          addStock(i.name, qty, allocCost);
          hasilDetail.push({ name: i.name, qty, unit: i.unit || '', allocCost, unitCost: qty > 0 ? allocCost / qty : 0 });
        });
        prodCostByTxn[t.id] = { batchCost, hasil: hasilDetail };
      } else if (t.type === 'penjualan') {
        let txnHpp = 0;
        t.items.forEach(i => {
          const qty = Number(i.qty) || 0;
          txnHpp += qty * removeStock(i.name, qty);
        });
        hppByTxn[t.id] = txnHpp;
        totalHPP += txnHpp;
        totalRevenue += t.total;
      }
    });

    return { hppByTxn, prodCostByTxn, totalHPP, totalRevenue, labaKotor: totalRevenue - totalHPP, getCurrentUnitCost: unitCostOf };
  }

  // Sama seperti computeHPP, tapi hanya memproses transaksi sampai tanggal cutoff tertentu.
  // Dipakai untuk menghitung nilai stok pakai HPP "pada saat itu", bukan harga sekarang.
  function computeHPPUpTo(cutoffTs) {
    const sorted = [...txns].filter(t => (t.createdAt || 0) <= cutoffTs).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const avg = {};
    const keyOf = n => (n || '').trim().toLowerCase();
    function addStock(name, qty, cost) {
      const k = keyOf(name);
      if (!k || qty <= 0) return;
      if (!avg[k]) avg[k] = { name: (name || '').trim(), qty: 0, cost: 0 };
      avg[k].qty += qty;
      avg[k].cost += cost;
    }
    function unitCostOf(name) {
      const k = keyOf(name);
      const r = avg[k];
      return (r && r.qty > 0) ? r.cost / r.qty : 0;
    }
    function removeStock(name, qty) {
      const k = keyOf(name);
      const r = avg[k];
      const uc = unitCostOf(name);
      if (r) {
        r.qty -= qty;
        r.cost -= qty * uc;
        if (r.qty < 0.0000001) { r.qty = 0; r.cost = 0; }
      }
      return uc;
    }
    sorted.forEach(t => {
      if (t.type === 'pembelian') {
        const shipping = Number(t.ongkosKirim) || 0;
        const subtotal = t.items.reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);
        t.items.forEach(i => {
          const qty = Number(i.qty) || 0;
          const itemValue = qty * (Number(i.price) || 0);
          const allocShipping = shipping > 0 ? (subtotal > 0 ? shipping * (itemValue / subtotal) : shipping / t.items.length) : 0;
          addStock(i.name, qty, itemValue + allocShipping);
        });
      } else if (t.type === 'produksi') {
        let batchCost = 0;
        (t.bahan || []).forEach(i => {
          const qty = Number(i.qty) || 0;
          batchCost += qty * removeStock(i.name, qty);
        });
        const totalHasilQty = (t.hasil || []).reduce((s, i) => s + (Number(i.qty) || 0), 0) || 1;
        (t.hasil || []).forEach(i => {
          const qty = Number(i.qty) || 0;
          addStock(i.name, qty, batchCost * (qty / totalHasilQty));
        });
      } else if (t.type === 'penjualan') {
        t.items.forEach(i => removeStock(i.name, Number(i.qty) || 0));
      }
    });
    return { getUnitCostAt: unitCostOf };
  }
  function monthEndTimestamp(mKey) {
    const [y, m] = mKey.split('-').map(Number);
    return new Date(y, m, 0, 23, 59, 59, 999).getTime();
  }
  function computeStokValueForMonth(mKey) {
    const rows = computeStokBulanan(mKey);
    const cutoff = mKey === 'semua' ? Date.now() : monthEndTimestamp(mKey);
    const snap = computeHPPUpTo(cutoff);
    let totalValue = 0;
    const withValue = rows.map(r => {
      const uc = snap.getUnitCostAt(r.name);
      const value = r.akhir > 0 ? r.akhir * uc : 0;
      totalValue += value;
      return { ...r, unitCost: uc, value };
    });
    return { rows: withValue, totalValue };
  }

  function renderProdEstimateHtml() {
    const hppNow = computeHPP();
    const validBahan = produksiFormState.bahan.filter(i => i.name && Number(i.qty) > 0);

  function wireServiceAktifEvents() {
    document.getElementById('bk-svc-name').addEventListener('input', e => serviceFormState.customerName = e.target.value);
    document.getElementById('bk-svc-phone').addEventListener('input', e => serviceFormState.customerPhone = e.target.value);
    document.getElementById('bk-svc-device').addEventListener('input', e => serviceFormState.device = e.target.value);
    document.getElementById('bk-svc-est').addEventListener('input', e => serviceFormState.estimasiBiaya = e.target.value);
    document.getElementById('bk-svc-complaint').addEventListener('input', e => serviceFormState.complaint = e.target.value);
    document.getElementById('bk-svc-accessories').addEventListener('input', e => serviceFormState.accessories = e.target.value);
    document.getElementById('bk-svc-rekening').addEventListener('change', e => serviceFormState.rekening = e.target.value);
    document.getElementById('bk-svc-save-btn').addEventListener('click', saveNewService);
    document.getElementById('bk-svc-quick-btn').addEventListener('click', runQuickAiService);
    bodyEl.querySelectorAll('.bk-service-status-bar .bk-chip').forEach(c => c.addEventListener('click', () => { svcFilter = c.dataset.f; renderService(); }));
    wireServiceCardEvents();
  }

  function svcCompletedAt(s) {
    const h = (s.history || []).slice().reverse().find(x => x.status === 'diambil');
    return (h && h.at) || s.updatedAt || s.createdAt;
  }
  function svcMonthKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function svcAvailableMonths() {
    const done = services.filter(s => s.status === 'diambil');
    const set = new Set(done.map(s => svcMonthKey(svcCompletedAt(s))));
    return Array.from(set).sort().reverse();
  }

  function renderServiceRiwayatHtml() {
    const done = services.filter(s => s.status === 'diambil').sort((a,b) => svcCompletedAt(b) - svcCompletedAt(a));
    const months = svcAvailableMonths();
    const byMonth = done.filter(s => svcRiwayatMonth === 'semua' ? true : svcMonthKey(svcCompletedAt(s)) === svcRiwayatMonth);
    const q = svcSearchQuery.trim().toLowerCase();
    const filtered = q ? byMonth.filter(s => (s.customerName||'').toLowerCase().includes(q) || (s.device||'').toLowerCase().includes(q)) : byMonth;
    const totalPendapatan = byMonth.reduce((sum,s) => sum + (Number(s.biayaFinal)||0), 0);

    return `
      <div class="bk-two-col" style="margin-bottom:16px;">
        <div class="bk-field" style="margin-bottom:0;">
          <label>Bulan selesai</label>
          <select id="bk-svc-month-select" style="width:100%; border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; font-size:13.5px; font-family:'Inter',sans-serif; background:#fff;">
            <option value="semua" ${svcRiwayatMonth==='semua'?'selected':''}>Semua bulan</option>
            ${months.map(m => `<option value="${m}" ${svcRiwayatMonth===m?'selected':''}>${monthLabel(m)}</option>`).join('')}
          </select>
        </div>
        <div class="bk-field" style="margin-bottom:0;">
          <label>Cari nama pelanggan / device</label>
          <input id="bk-svc-search" value="${escapeAttr(svcSearchQuery)}" placeholder="Contoh: Budi / Asus A455L" />
        </div>
      </div>
      <div class="bk-stats" style="margin-bottom:16px;">
        <div class="bk-stat"><div class="lbl">Service selesai ${svcRiwayatMonth==='semua'?'(semua waktu)':('&middot; '+monthLabel(svcRiwayatMonth))}</div><div class="val" id="bk-svc-riwayat-count">${byMonth.length}</div></div>
        <div class="bk-stat in"><div class="lbl">Total pendapatan jasa</div><div class="val" id="bk-svc-riwayat-total">${rupiah(totalPendapatan)}</div></div>
      </div>
      <div id="bk-svc-list">${filtered.length ? filtered.map(serviceCardHtml).join('') : '<div class="bk-empty">Belum ada riwayat service pada filter ini.</div>'}</div>
    `;
  }

  function refreshSvcRiwayatList() {
    const done = services.filter(s => s.status === 'diambil').sort((a,b) => svcCompletedAt(b) - svcCompletedAt(a));
    const byMonth = done.filter(s => svcRiwayatMonth === 'semua' ? true : svcMonthKey(svcCompletedAt(s)) === svcRiwayatMonth);
    const q = svcSearchQuery.trim().toLowerCase();
    const filtered = q ? byMonth.filter(s => (s.customerName||'').toLowerCase().includes(q) || (s.device||'').toLowerCase().includes(q)) : byMonth;
    const listEl = document.getElementById('bk-svc-list');
    if (listEl) listEl.innerHTML = filtered.length ? filtered.map(serviceCardHtml).join('') : '<div class="bk-empty">Belum ada riwayat service pada filter ini.</div>';
    const totalPendapatan = byMonth.reduce((sum,s) => sum + (Number(s.biayaFinal)||0), 0);
    const countEl = document.getElementById('bk-svc-riwayat-count');
    const totalEl = document.getElementById('bk-svc-riwayat-total');
    if (countEl) countEl.textContent = byMonth.length;
    if (totalEl) totalEl.textContent = rupiah(totalPendapatan);
    wireServiceCardEvents();
  }

  function wireServiceRiwayatEvents() {
    const monthSel = document.getElementById('bk-svc-month-select');
    if (monthSel) monthSel.addEventListener('change', e => { svcRiwayatMonth = e.target.value; refreshSvcRiwayatList(); });
    const searchInp = document.getElementById('bk-svc-search');
    if (searchInp) searchInp.addEventListener('input', e => { svcSearchQuery = e.target.value; refreshSvcRiwayatList(); });
    wireServiceCardEvents();
  }

  async function runQuickAiService() {
    const input = document.getElementById('bk-svc-quick-input');
    const btn = document.getElementById('bk-svc-quick-btn');
    const text = input.value.trim();
    if (!text) { input.placeholder = 'Tulis dulu deskripsi service-nya...'; input.focus(); return; }
    btn.disabled = true; btn.textContent = 'Memproses...';
    try {
      const prompt = `Ubah teks berikut menjadi data service laptop terstruktur.\nTeks: "${text}"\nFormat JSON object: {"customerName":"nama pelanggan atau string kosong jika tidak disebut","customerPhone":"nomor whatsapp atau string kosong jika tidak disebut","device":"merk/tipe laptop atau string kosong jika tidak disebut","complaint":"keluhan/kerusakan yang disebutkan","accessories":"kelengkapan yang dititipkan atau string kosong jika tidak disebut","estimasiBiaya": angka perkiraan biaya dalam rupiah, 0 jika tidak disebut}\nBalas HANYA dengan JSON object valid, tanpa teks lain, tanpa markdown code fence.`;
      const raw = await callClaudeAI(prompt);
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      if (parsed.customerName) serviceFormState.customerName = parsed.customerName;
      if (parsed.customerPhone) serviceFormState.customerPhone = parsed.customerPhone;
      if (parsed.device) serviceFormState.device = parsed.device;
      if (parsed.complaint) serviceFormState.complaint = parsed.complaint;
      if (parsed.accessories) serviceFormState.accessories = parsed.accessories;
      if (parsed.estimasiBiaya) serviceFormState.estimasiBiaya = parsed.estimasiBiaya;
      input.value = '';
      renderService();
    } catch (e) {
      console.error(e);
      const err = document.getElementById('bk-svc-form-err');
      if (err) { err.style.display = 'block'; err.textContent = e.friendly || 'AI tidak bisa membaca teks itu, coba tulis ulang atau isi manual.'; }
      btn.disabled = false; btn.textContent = 'Isi otomatis (AI)';
    }
  }

  async function saveNewService() {
    const errEl = document.getElementById('bk-svc-form-err');
    const name = serviceFormState.customerName.trim();
    const device = serviceFormState.device.trim();
    const complaint = serviceFormState.complaint.trim();
    if (!name || !device || !complaint) {
      errEl.style.display = 'block';
      errEl.textContent = 'Isi minimal nama pelanggan, merk/tipe laptop, dan keluhan.';
      return;
    }
    errEl.style.display = 'none';
    const s = {
      id: uid(),
      customerName: name,
      customerPhone: serviceFormState.customerPhone.trim(),
      device,
      complaint,
      accessories: serviceFormState.accessories.trim(),
      estimasiBiaya: Number(serviceFormState.estimasiBiaya) || 0,
      rekening: serviceFormState.rekening || BANK_ACCOUNTS[0].id,
      catatanDiagnosa: '',
      biayaFinal: 0,
      dpAmount: 0,
      dpTxnId: null,
      paid: true,
      status: 'diterima',
      linkedTxnId: null,
      createdAt: Date.now(),
      createdBy: currentUser ? currentUser.email : null,
      updatedAt: Date.now(),
      history: [{ status: 'diterima', at: Date.now() }],
    };
    const btn = document.getElementById('bk-svc-save-btn');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    try {
      await saveService(s);
      services.unshift(s);
      serviceFormState = blankServiceForm();
      renderService();
      showToast('Service laptop tercatat.');
    } catch (e) {
      console.error(e);
      errEl.style.display = 'block';
      errEl.textContent = 'Gagal menyimpan data service, coba lagi.';
      btn.disabled = false; btn.textContent = 'Terima service masuk';
    }
  }

  function wireServiceCardEvents() {
    const list = document.getElementById('bk-svc-list');
    if (!list) return;

    list.querySelectorAll('.svc-edit-detail-btn').forEach(b => b.addEventListener('click', () => {
      editingServiceDetailId = b.dataset.id;
      renderService();
    }));
    list.querySelectorAll('.svc-cancel-detail').forEach(b => b.addEventListener('click', () => {
      editingServiceDetailId = null;
      renderService();
    }));
    list.querySelectorAll('.svc-save-detail').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.id;
      const name = list.querySelector(`.svc-edit-name[data-id="${id}"]`).value.trim();
      const phone = list.querySelector(`.svc-edit-phone[data-id="${id}"]`).value.trim();
      const device = list.querySelector(`.svc-edit-device[data-id="${id}"]`).value.trim();
      const accessories = list.querySelector(`.svc-edit-accessories[data-id="${id}"]`).value.trim();
      const complaint = list.querySelector(`.svc-edit-complaint[data-id="${id}"]`).value.trim();
      const rekening = list.querySelector(`.svc-edit-rekening[data-id="${id}"]`).value;
      const errEl = document.getElementById(`bk-svc-edit-err-${id}`);
      if (!name || !device || !complaint) {
        if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'Nama pelanggan, merk/tipe laptop, dan keluhan wajib diisi.'; }
        return;
      }
      await updateService(id, { customerName: name, customerPhone: phone, device, accessories, complaint, rekening });
      editingServiceDetailId = null;
      renderService();
      showToast('Info service diperbarui.');
    }));

    list.querySelectorAll('.svc-dp-save').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.id;
      const s = services.find(x => x.id === id);
      if (!s) return;
      const input = list.querySelector(`.svc-dp-input[data-id="${id}"]`);
      const amount = Number(input.value) || 0;
      if (amount <= 0) { showToast('Isi jumlah DP terlebih dahulu.'); return; }
      b.disabled = true; b.textContent = 'Menyimpan...';
      try {
        const txn = {
          id: uid(),
          type: 'penjualan',
          items: [{ name: `DP Service Laptop - ${s.device} (${id.slice(0,6)})`, qty: 1, unit: 'jasa', price: amount }],
          total: amount,
          customerName: s.customerName,
          customerPhone: s.customerPhone,
          supplierName: '',
          paid: true,
          rekening: s.rekening || BANK_ACCOUNTS[0].id,
          createdAt: Date.now(),
        };
        await saveTxn(txn);
        txns.unshift(txn);
        s.dpAmount = amount;
        s.dpTxnId = txn.id;
        s.updatedAt = Date.now();
        s.history = s.history || [];
        s.history.push({ status: `DP diterima: ${rupiah(amount)}`, at: Date.now() });
        await saveService(s);
        renderService();
        showToast('DP tercatat sebagai pemasukan.');
      } catch (e) {
        console.error(e);
        showToast('Gagal mencatat DP, coba lagi.');
        b.disabled = false; b.textContent = 'Catat DP';
      }
    }));

    list.querySelectorAll('.svc-dp-remove').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.id;
      const s = services.find(x => x.id === id);
      if (!s) return;
      showConfirm(`Batalkan DP sebesar ${rupiah(s.dpAmount)}? Transaksi pemasukan DP ini akan ikut dihapus.`, async () => {
        try {
          if (s.dpTxnId) {
            try { await deleteTxnFromStore(s.dpTxnId); } catch (e) { /* mungkin sudah terhapus */ }
            txns = txns.filter(x => x.id !== s.dpTxnId);
          }
          s.dpAmount = 0;
          s.dpTxnId = null;
          s.updatedAt = Date.now();
          s.history = s.history || [];
          s.history.push({ status: 'DP dibatalkan', at: Date.now() });
          await saveService(s);
          renderService();
          showToast('DP dibatalkan.');
        } catch (e) {
          console.error(e);
          showToast('Gagal membatalkan DP, coba lagi.');
        }
      });
    }));

    list.querySelectorAll('.act-diagnosa').forEach(b => b.addEventListener('click', () => advanceServiceStatus(b.dataset.id, 'diagnosa')));

    list.querySelectorAll('.act-kirim-estimasi').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.id;
      const note = list.querySelector(`.svc-diag-note[data-id="${id}"]`).value;
      const est = list.querySelector(`.svc-diag-est[data-id="${id}"]`).value;
      await updateService(id, { catatanDiagnosa: note, estimasiBiaya: Number(est) || 0 });
      await advanceServiceStatus(id, 'menunggu_konfirmasi', false);
      renderService();
      sendServiceWhatsapp(id, 'estimasi');
    }));

    list.querySelectorAll('.act-setuju').forEach(b => b.addEventListener('click', () => advanceServiceStatus(b.dataset.id, 'dikerjakan')));
    list.querySelectorAll('.act-revisi').forEach(b => b.addEventListener('click', () => advanceServiceStatus(b.dataset.id, 'diagnosa')));

    list.querySelectorAll('.svc-part-row').forEach(row => {
      const sid = row.dataset.svc, pid = row.dataset.id;
      const s = services.find(x => x.id === sid);
      const part = s && s.parts ? s.parts.find(p => p.id === pid) : null;
      if (!part) return;
      row.querySelector('.f-name').addEventListener('input', e => part.name = e.target.value);
      row.querySelector('.f-qty').addEventListener('input', e => part.qty = e.target.value);
      row.querySelector('.f-unit').addEventListener('input', e => part.unit = e.target.value);
      row.querySelector('.rm').addEventListener('click', () => {
        s.parts = s.parts.filter(p => p.id !== pid);
        if (!s.parts.length) s.parts.push(blankSvcPart());
        renderService();
      });
    });
    list.querySelectorAll('.svc-add-part').forEach(b => b.addEventListener('click', () => {
      const s = services.find(x => x.id === b.dataset.id);
      if (!s) return;
      s.parts = s.parts || [];
      s.parts.push(blankSvcPart());
      renderService();
    }));

    list.querySelectorAll('.act-selesai').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.id;
      const s = services.find(x => x.id === id);
      if (!s) return;
      const biayaEl = list.querySelector(`.svc-biaya-final[data-id="${id}"]`);
      const biaya = Number(biayaEl.value) || 0;
      const validParts = (s.parts || []).filter(p => p.name && Number(p.qty) > 0)
        .map(p => ({ name: p.name.trim(), qty: Number(p.qty), unit: (p.unit||'').trim() }));
      const partsInfo = validParts.length ? ` Sparepart yang dipakai (${validParts.map(p=>p.name).join(', ')}) akan otomatis mengurangi Stok.` : '';
      showConfirm(`Tandai service "${s.customerName}" (${s.device}) selesai dikerjakan dengan biaya final ${rupiah(biaya)}?${partsInfo}`, async () => {
      let serviceItemName = s.serviceItemName;
      if (validParts.length) {
        serviceItemName = `Jasa Service Laptop - ${s.device} (${id.slice(0,6)})`;
        const prodTxn = {
          id: uid(),
          type: 'produksi',
          bahan: validParts,
          hasil: [{ name: serviceItemName, qty: 1, unit: 'jasa' }],
          total: 0,
          createdAt: Date.now(),
        };
        try {
          await saveTxn(prodTxn);
          txns.unshift(prodTxn);
          s.prodTxnId = prodTxn.id;
        } catch (e) {
          console.error(e);
          showToast('Gagal mencatat pemakaian sparepart, coba lagi.');
          return;
        }
      }

      await updateService(id, { biayaFinal: biaya, parts: s.parts, serviceItemName });
      await advanceServiceStatus(id, 'selesai', false);
      renderService();
      sendServiceWhatsapp(id, 'selesai');
      });
    }));

    list.querySelectorAll('.svc-paid-check').forEach(chk => chk.addEventListener('change', () => {
      const s = services.find(x => x.id === chk.dataset.id);

    list.querySelectorAll('.act-wa').forEach(b => b.addEventListener('click', () => sendServiceWhatsapp(b.dataset.id, 'manual')));

    list.querySelectorAll('.act-print-nota').forEach(b => b.addEventListener('click', () => {
      const s = services.find(x => x.id === b.dataset.id);

    list.querySelectorAll('.svc-del-btn').forEach(b => b.addEventListener('click', () => removeService(b.dataset.id)));

  async function updateService(id, patch) {
    const s = services.find(x => x.id === id);
    if (!s) return;
    Object.assign(s, patch, { updatedAt: Date.now() });
    try { await saveService(s); } catch (e) { console.error(e); showToast('Gagal menyimpan perubahan, coba lagi.'); }
  }

  async function advanceServiceStatus(id, newStatus, rerender = true) {
    const s = services.find(x => x.id === id);
    if (!s) return;
    s.status = newStatus;
    s.updatedAt = Date.now();
    s.history = s.history || [];
    s.history.push({ status: newStatus, at: Date.now() });
    try {
      await saveService(s);
      if (rerender) renderService();
    } catch (e) {
      console.error(e);
      showToast('Gagal memperbarui status, coba lagi.');
    }
  }

  async function finalizeServiceAsIncome(id) {
    const s = services.find(x => x.id === id);
    if (!s) return;
    const sisa = Math.max(0, (Number(s.biayaFinal)||0) - (Number(s.dpAmount)||0));
    const confirmMsg = s.dpAmount
      ? `Biaya final ${rupiah(s.biayaFinal)} dikurangi DP ${rupiah(s.dpAmount)} = sisa ${rupiah(sisa)} akan dicatat sebagai pemasukan, dan status ditandai sudah diambil. Lanjutkan?`
      : `Catat biaya service ${rupiah(s.biayaFinal)} sebagai pemasukan dan tandai sudah diambil?`;
    showConfirm(confirmMsg, async () => {
      try {
        const txn = {
          id: uid(),
          type: 'penjualan',
          items: [{ name: s.serviceItemName || `Jasa Service Laptop - ${s.device}`, qty: 1, unit: 'jasa', price: sisa }],
          total: sisa,
          customerName: s.customerName,
          customerPhone: s.customerPhone,
          supplierName: '',
          paid: sisa <= 0 ? true : (s.paid !== false),
          rekening: s.rekening || BANK_ACCOUNTS[0].id,
          createdAt: Date.now(),
        };
        await saveTxn(txn);
        txns.unshift(txn);
        s.linkedTxnId = txn.id;
        s.paid = txn.paid;
        s.status = 'diambil';
        s.updatedAt = Date.now();
        s.history = s.history || [];
        s.history.push({ status: 'diambil', at: Date.now() });
        await saveService(s);
        renderService();
        showServiceReceipt(s);
      } catch (e) {
        console.error(e);
        showToast('Gagal menyelesaikan data service, coba lagi.');
      }
    });
  }

  async function removeService(id) {
    const s = services.find(x => x.id === id);
    if (!s) return;
    showConfirm('Hapus data service ini? Kalau ada transaksi pemasukan terkait, transaksi itu juga akan ikut terhapus.', async () => {
      try {
        if (s.linkedTxnId) {
          try { await deleteTxnFromStore(s.linkedTxnId); } catch (e) { /* mungkin sudah terhapus */ }
          txns = txns.filter(x => x.id !== s.linkedTxnId);
        }
        if (s.prodTxnId) {
          try { await deleteTxnFromStore(s.prodTxnId); } catch (e) { /* mungkin sudah terhapus */ }
          txns = txns.filter(x => x.id !== s.prodTxnId);
        }
        if (s.dpTxnId) {
          try { await deleteTxnFromStore(s.dpTxnId); } catch (e) { /* mungkin sudah terhapus */ }
          txns = txns.filter(x => x.id !== s.dpTxnId);
        }
        await deleteServiceFromStore(id);
        services = services.filter(x => x.id !== id);
        renderService();
        showToast('Data service dihapus.');
      } catch (e) {
        console.error(e);
        showToast('Gagal menghapus data service, coba lagi.');
      }
    });
  }

  function sendServiceWhatsapp(id, context) {
    const s = services.find(x => x.id === id);
    if (!s) return;
    const phoneRaw = (s.customerPhone || '').replace(/[^0-9]/g, '');
    const phone = phoneRaw.startsWith('0') ? '62' + phoneRaw.slice(1) : phoneRaw;
    if (!phone) { showToast('Nomor WhatsApp pelanggan belum diisi.'); return; }
    const storeName = document.getElementById('bk-storename').value || 'Toko Saya';
    let msg;
    if (context === 'estimasi') {
      msg = `Halo ${s.customerName}, hasil pengecekan laptop ${s.device} di ${storeName}: ${s.catatanDiagnosa || '-'}. Estimasi biaya perbaikan: ${rupiah(s.estimasiBiaya)}. Mohon konfirmasi apakah dilanjutkan ya. Terima kasih!`;
    } else if (context === 'selesai') {
      msg = `Halo ${s.customerName}, laptop ${s.device} sudah selesai diservice di ${storeName} dengan biaya ${rupiah(s.biayaFinal)}. Silakan diambil ya, terima kasih!`;
    } else {
      msg = `Halo ${s.customerName}, update status service laptop ${s.device} di ${storeName}: ${serviceStatusLabel(s.status)}.`;
    }
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  // ---------- PIUTANG ----------
  function renderPiutang() {
    const unpaid = txns.filter(t => t.type === 'penjualan' && t.paid === false).sort((a,b) => b.createdAt - a.createdAt);
    const total = unpaid.reduce((s,t) => s + t.total, 0);
    bodyEl.innerHTML = `
      <div class="bk-stats" style="grid-template-columns: 1fr;">
        <div class="bk-stat out"><div class="lbl">Total piutang belum lunas</div><div class="val">${rupiah(total)}</div></div>
      </div>
      <div id="bk-piutang-list">${unpaid.length ? unpaid.map(piutangRowHtml).join('') : '<div class="bk-empty">Tidak ada piutang. Semua penjualan sudah lunas.</div>'}</div>
    `;
    bodyEl.querySelectorAll('[data-lunas]').forEach(btn => {
      btn.addEventListener('click', () => markLunas(btn.dataset.lunas));
    });
    bodyEl.querySelectorAll('[data-remind]').forEach(btn => {
      btn.addEventListener('click', () => remindWhatsapp(btn.dataset.remind));
    });
  }

      <div class="bk-piutang-top">
        <div>
          <div style="font-weight:500;">${t.customerName || 'Tanpa nama'}</div>
          <div class="sub" style="font-size:11.5px; color:var(--ink-soft);">${names} &middot; ${new Date(t.createdAt).toLocaleDateString('id-ID')}</div>

      <div class="bk-piutang-actions">

        ${t.customerPhone ? `<button class="bk-btn ghost" data-remind="${t.id}">Ingatkan via WhatsApp</button>` : ''}
      </div>
    </div>`;
  }

  function remindWhatsapp(id) {
    const t = txns.find(x => x.id === id);

  // ---------- EXPORT EXCEL (Laba Rugi, Neraca, Arus Kas, Beban, Stok Bulanan, Per Rekening) ----------
  function stripEntities(s) {
    return String(s || '')
      .replace(/&middot;/g, ' - ')
      .replace(/&minus;/g, '-')
      .replace(/&rarr;/g, '->')
      .replace(/&amp;/g, '&')
      .replace(/&mdash;/g, '-');
  }

  function itemBreakdownRows(scopedTxns, type) {
    const map = {};
    scopedTxns.filter(t => t.type === type).forEach(t => {
      t.items.forEach(i => {
        let key = i.name.trim();
        if (/^Jasa Service Laptop/i.test(key)) key = 'Jasa Service Laptop (semua unit)';
        if (!map[key]) map[key] = { qty: 0, total: 0, unit: i.unit || '' };
        map[key].qty += Number(i.qty) || 0;
        map[key].total += (Number(i.qty)||0) * (Number(i.price)||0);
      });
    });
    return Object.entries(map).sort((a,b) => b[1].total - a[1].total).map(([name, r]) => [name, r.qty, r.unit, r.total]);
  }

  function computeLabaRugiForMonth(mKey) {
    const byMonth = mKey === 'semua' ? txns : txns.filter(t => monthKey(t.createdAt) === mKey);
    const masuk = byMonth.filter(t => t.type === 'penjualan').reduce((s,t) => s + t.total, 0);
    const keluar = byMonth.filter(t => t.type === 'pembelian').reduce((s,t) => s + t.total, 0);
    const hppAll = computeHPP();
    const hppBulan = byMonth.filter(t => t.type === 'penjualan').reduce((s,t) => s + (hppAll.hppByTxn[t.id] || 0), 0);
    const labaKotorBulan = masuk - hppBulan;
    const bebanFiltered = bebanList.filter(b => mKey === 'semua' ? true : monthKey(b.createdAt) === mKey);
    const totalBeban = bebanFiltered.reduce((s,b) => s + (Number(b.nominal)||0), 0);
    const labaBersih = labaKotorBulan - totalBeban;
    return { byMonth, masuk, keluar, hppBulan, labaKotorBulan, bebanFiltered, totalBeban, labaBersih };
  }

      [],

      ['Beban (Pembelian bahan baku)', -keluar],
      ['Laba/Rugi bersih (arus kas)', masuk - keluar],

  // ---------- LAPORAN: Arus Kas, Neraca, Beban Operasional, Stok Bulanan, Per Rekening ----------
  function laporanAvailableMonths() {
    const set = new Set();
    txns.forEach(t => set.add(monthKey(t.createdAt)));
    bebanList.forEach(b => set.add(monthKey(b.createdAt)));
    utangList.forEach(u => set.add(monthKey(u.createdAt)));
    utangPayments.forEach(p => set.add(monthKey(p.createdAt)));
    modalEntries.forEach(m => set.add(monthKey(m.createdAt)));
    return Array.from(set).sort().reverse();
  }

  function computeKasTotal() {
    let kas = 0;
    txns.forEach(t => {
      if (t.type === 'penjualan' && t.paid !== false) kas += t.total;
      if (t.type === 'pembelian') kas -= t.total;
    });
    bebanList.forEach(b => { kas -= Number(b.nominal) || 0; });
    utangList.forEach(u => { kas += Number(u.nominalAwal) || 0; });
    utangPayments.forEach(p => { kas -= Number(p.nominal) || 0; });
    modalEntries.forEach(m => { kas += Number(m.nominal) || 0; });
    return kas;
  }
  function computePiutangTotalLap() {
    return txns.filter(t => t.type === 'penjualan' && t.paid === false).reduce((s,t) => s + t.total, 0);
  }
  function computePersediaanTotal() {
    const stockMap = computeStock();
    const hpp = computeHPP();
    let total = 0;
    Object.values(stockMap).forEach(r => {
      if (/^Jasa Service Laptop/i.test(r.name)) return;
      if (r.qty > 0) total += r.qty * hpp.getCurrentUnitCost(r.name);
    });
    return total;
  }
  function computeKewajibanTotal() {
    return utangList.reduce((s,u) => s + (Number(u.sisaUtang)||0), 0);
  }
  function computeNeraca() {
    const kas = computeKasTotal();
    const piutang = computePiutangTotalLap();
    const persediaan = computePersediaanTotal();
    const kewajiban = computeKewajibanTotal();
    const modalAwalTotal = computeModalAwalTotal();
    const totalAset = kas + piutang + persediaan;
    const totalModal = totalAset - kewajiban;
    const labaDitahan = totalModal - modalAwalTotal;
    return { kas, piutang, persediaan, kewajiban, totalAset, modalAwal: modalAwalTotal, labaDitahan, totalModal };
  }

  function computeArusKasForMonth(mKey) {
    const inflow = [];
    const outflow = [];
    txns.forEach(t => {
      const inMonth = mKey === 'semua' ? true : monthKey(t.createdAt) === mKey;
      if (!inMonth) return;
      if (t.type === 'penjualan' && t.paid !== false) {
        inflow.push({ label: `${t.customerName || 'Penjualan'} &middot; ${(t.items||[]).map(i=>i.name).join(', ')}`, amount: t.total, date: t.createdAt });
      }
      if (t.type === 'pembelian') {
        outflow.push({ label: `${t.supplierName || 'Pembelian'} &middot; ${(t.items||[]).map(i=>i.name).join(', ')}`, amount: t.total, date: t.createdAt });
      }
    });
    bebanList.forEach(b => {
      const inMonth = mKey === 'semua' ? true : monthKey(b.createdAt) === mKey;
      if (!inMonth) return;
      const kategoriLabel = b.kategori === 'Lainnya' && b.kategoriCustom ? b.kategoriCustom : b.kategori;
      outflow.push({ label: `Beban: ${kategoriLabel}${b.keterangan ? ' - '+b.keterangan : ''}`, amount: Number(b.nominal)||0, date: b.createdAt });
    });
    utangList.forEach(u => {
      const inMonth = mKey === 'semua' ? true : monthKey(u.createdAt) === mKey;
      if (!inMonth) return;
      inflow.push({ label: `Terima pinjaman: ${u.kreditur} (${u.jenis})`, amount: Number(u.nominalAwal)||0, date: u.createdAt });
    });
    utangPayments.forEach(p => {
      const inMonth = mKey === 'semua' ? true : monthKey(p.createdAt) === mKey;
      if (!inMonth) return;
      const u = utangList.find(x => x.id === p.utangId);
      outflow.push({ label: `Bayar cicilan utang: ${u ? u.kreditur : '-'}`, amount: Number(p.nominal)||0, date: p.createdAt });
    });
    modalEntries.forEach(m => {
      const inMonth = mKey === 'semua' ? true : monthKey(m.createdAt) === mKey;
      if (!inMonth) return;
      inflow.push({ label: `Setoran modal: ${m.keterangan || 'Tanpa keterangan'}`, amount: Number(m.nominal)||0, date: m.createdAt });
    });
    inflow.sort((a,b)=>b.date-a.date);
    outflow.sort((a,b)=>b.date-a.date);
    const totalMasuk = inflow.reduce((s,x)=>s+x.amount,0);
    const totalKeluar = outflow.reduce((s,x)=>s+x.amount,0);
    return { inflow, outflow, totalMasuk, totalKeluar, netKas: totalMasuk - totalKeluar };
  }
  function computeSaldoKasSebelum(mKey) {
    if (mKey === 'semua') return 0;
    let saldo = 0;
    txns.forEach(t => {
      if (monthKey(t.createdAt) < mKey) {
        if (t.type === 'penjualan' && t.paid !== false) saldo += t.total;
        if (t.type === 'pembelian') saldo -= t.total;
      }
    });
    bebanList.forEach(b => { if (monthKey(b.createdAt) < mKey) saldo -= (Number(b.nominal)||0); });
    utangList.forEach(u => { if (monthKey(u.createdAt) < mKey) saldo += (Number(u.nominalAwal)||0); });
    utangPayments.forEach(p => { if (monthKey(p.createdAt) < mKey) saldo -= (Number(p.nominal)||0); });
    modalEntries.forEach(m => { if (monthKey(m.createdAt) < mKey) saldo += (Number(m.nominal)||0); });
    return saldo;
  }

  function computeStokBulanan(mKey) {
    const items = {};
    function ensure(name, unit) {
      const k = (name||'').trim().toLowerCase();
      if (!k || /^jasa service laptop/i.test(name||'')) return null;
      if (!items[k]) items[k] = { name: name.trim(), unit: unit||'', awal:0, masuk:0, keluar:0 };
      if (unit) items[k].unit = unit;
      return items[k];
    }
    const sorted = [...txns].sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    sorted.forEach(t => {
      const tMonth = monthKey(t.createdAt);
      if (mKey !== 'semua' && tMonth > mKey) return;
      const isBefore = mKey !== 'semua' && tMonth < mKey;
      if (t.type === 'pembelian') {
        t.items.forEach(i => {
          const it = ensure(i.name, i.unit); if (!it) return;
          if (isBefore) it.awal += Number(i.qty)||0; else it.masuk += Number(i.qty)||0;
        });
      } else if (t.type === 'penjualan') {
        t.items.forEach(i => {
          const it = ensure(i.name, i.unit); if (!it) return;
          if (isBefore) it.awal -= Number(i.qty)||0; else it.keluar += Number(i.qty)||0;
        });
      } else if (t.type === 'produksi') {
        (t.bahan||[]).forEach(i => {
          const it = ensure(i.name, i.unit); if (!it) return;
          if (isBefore) it.awal -= Number(i.qty)||0; else it.keluar += Number(i.qty)||0;
        });
        (t.hasil||[]).forEach(i => {
          const it = ensure(i.name, i.unit); if (!it) return;
          if (isBefore) it.awal += Number(i.qty)||0; else it.masuk += Number(i.qty)||0;
        });
      }
    });
    return Object.values(items).map(it => ({ ...it, akhir: it.awal + it.masuk - it.keluar })).sort((a,b) => a.name.localeCompare(b.name));
  }

  function computeRekeningReport() {
    const byAccount = {};
    BANK_ACCOUNTS.forEach(acc => byAccount[acc.id] = { ...acc, total: 0, transactions: [] });
    txns.forEach(t => {
      if (t.type === 'penjualan' && t.paid !== false && t.rekening && byAccount[t.rekening]) {
        byAccount[t.rekening].total += t.total;
        byAccount[t.rekening].transactions.push(t);
      }
    });
    Object.values(byAccount).forEach(a => a.transactions.sort((x,y) => (y.createdAt||0) - (x.createdAt||0)));
    return byAccount;
  }

  function wireLaporanEvents() {
    if (laporanView === 'aruskas') wireArusKasEvents();

        await saveModalEntry(m);
        modalEntries.push(m);
        modalEntryFormState = blankModalEntryForm();
        renderLaporan();

      } catch (e) { console.error(e); errEl.style.display = 'block'; errEl.textContent = 'Gagal menyimpan, coba lagi.'; }
    });

        showConfirm('Hapus setoran modal ini? Ini akan mempengaruhi perhitungan Kas dan Neraca.', async () => {
          try {
            await deleteModalEntryFromStore(id);
            modalEntries = modalEntries.filter(m => m.id !== id);
            renderLaporan();
            showToast('Setoran modal dihapus.');

          closings.unshift(c);

          try {

            renderLaporan();

  function utangRowHtml(u) {
    const lunas = (Number(u.sisaUtang)||0) <= 0;

        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          <span class="bk-badge ${lunas?'lunas':'belum'}">${lunas?'Lunas':'Aktif'}</span>
          <div class="bk-icon-btn danger utang-del-btn" title="Hapus utang">&times;</div>
        </div>
      </div>
      <div class="bk-svc-detail"><span class="lbl">Pinjaman awal:</span> ${rupiah(u.nominalAwal)} &middot; <span class="lbl">Sisa:</span> ${rupiah(u.sisaUtang)}</div>
